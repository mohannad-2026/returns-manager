  /* =====================================================================
     DASHBOARD
  ===================================================================== */
  /* =====================================================================
     DASHBOARD — period/branch filter, KPIs vs previous period, charts
  ===================================================================== */
  dash: {range:'month', storeId:''},
  DASH_RANGES: [['7','آخر 7 أيام'],['month','الشهر ده'],['30','آخر 30 يوم'],['90','آخر 3 شهور'],['year','السنة دي']],
  /* validated categorical palette (fixed order, never cycled) — light & dark steps */
  VIZ_CAT: { light:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'],
             dark: ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'] },
  vizMode(){
    const v = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#ffffff';
    const m = v.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i);
    if(!m) return 'light';
    const [r,g,b] = [1,2,3].map(i=>parseInt(m[i],16)/255);
    return (0.2126*r+0.7152*g+0.0722*b) < 0.45 ? 'dark' : 'light';
  },
  dashPeriod(){
    const r = this.dash.range, now = new Date();
    const ymd = dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    let from = new Date(now);
    if(r==='month') from = new Date(now.getFullYear(), now.getMonth(), 1);
    else if(r==='year') from = new Date(now.getFullYear(), 0, 1);
    else from.setDate(now.getDate() - (parseInt(r,10)-1));
    const days = Math.round((new Date(ymd(now)) - new Date(ymd(from)))/86400000) + 1;
    const pTo = new Date(from); pTo.setDate(pTo.getDate()-1);
    const pFrom = new Date(pTo); pFrom.setDate(pFrom.getDate()-(days-1));
    return {from: ymd(from), to: ymd(now), days, pFrom: ymd(pFrom), pTo: ymd(pTo), fromD: from};
  },
  setDash(key, val){ this.dash[key] = val; this.render(); },
  deltaHtml(cur, prev, upIsBad){
    if(!prev && !cur) return '<span class="kpi-delta flat">— زي الفترة اللي قبلها</span>';
    if(!prev) return `<span class="kpi-delta ${upIsBad?'bad':'good'}">▲ جديد مقارنة بالفترة اللي قبلها</span>`;
    const pct = Math.round((cur-prev)/prev*100);
    if(pct===0) return '<span class="kpi-delta flat">= نفس الفترة اللي قبلها</span>';
    const up = pct>0, bad = upIsBad ? up : !up;
    return `<span class="kpi-delta ${bad?'bad':'good'}">${up?'▲':'▼'} ${fmtNum(Math.abs(pct))}% عن الفترة اللي قبلها</span>`;
  },
  /* one floating tooltip for every chart mark (content set with textContent) */
  initVizTip(){
    if(this._vizTipReady) return; this._vizTipReady = true;
    const tip = document.createElement('div'); tip.id = 'vizTip'; tip.className = 'viz-tip'; document.body.appendChild(tip);
    const show = (el, x, y)=>{
      let data; try{ data = JSON.parse(el.getAttribute('data-tip')); }catch(e){ return; }
      tip.innerHTML = '';
      const h = document.createElement('div'); h.className='vt-title'; h.textContent = data.t||''; tip.appendChild(h);
      (data.rows||[]).forEach(([label,val,color])=>{
        const row = document.createElement('div'); row.className='vt-row';
        const k = document.createElement('span'); k.className='vt-key'; if(color) k.style.background = color; row.appendChild(k);
        const v = document.createElement('b'); v.textContent = val; row.appendChild(v);
        const l = document.createElement('span'); l.textContent = label; row.appendChild(l);
        tip.appendChild(row);
      });
      tip.style.display='block';
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.min(window.innerWidth-tw-8, Math.max(8, x - tw/2))+'px';
      tip.style.top = Math.max(8, y - th - 14)+'px';
    };
    document.addEventListener('pointermove', e=>{
      const el = e.target.closest && e.target.closest('[data-tip]');
      if(el) show(el, e.clientX, e.clientY); else tip.style.display='none';
    });
    document.addEventListener('focusin', e=>{
      const el = e.target.closest && e.target.closest('[data-tip]');
      if(el){ const r = el.getBoundingClientRect(); show(el, r.left+r.width/2, r.top); }
    });
    document.addEventListener('focusout', ()=>{ tip.style.display='none'; });
  },
  tipAttr(obj){ return esc(JSON.stringify(obj)); },
  /* column chart (single series, time on x) — SVG, 4px rounded caps, hairline grid */
  columnChartHtml(buckets, color){
    const W=1200, H=250, padL=44, padR=8, padT=14, padB=30;
    const max = Math.max(1, ...buckets.map(b=>b.v));
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const nice = [1,2,2.5,5,10].map(m=>m*step).find(s=>max/s<=4) || step*10;
    const top = Math.ceil(max/nice)*nice;
    const ih = H-padT-padB, iw = W-padL-padR, n = buckets.length, band = iw/n;
    const bw = Math.min(24, band*0.62);
    const y = v=> padT + ih - (v/top)*ih;
    let g = '';
    for(let t=0; t<=top; t+=nice){ g += `<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" class="viz-grid"/><text x="${padL-6}" y="${y(t)+4}" class="viz-axis" text-anchor="end">${fmtNum(t)}</text>`; }
    const every = Math.ceil(n/8);
    let bars = '';
    buckets.forEach((b,i)=>{
      const cx = padL + band*i + band/2, x = cx-bw/2, yy = y(b.v), h = padT+ih-yy;
      if(b.v>0){
        const r = Math.min(4, h, bw/2);
        bars += `<path d="M${x},${padT+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${padT+ih} Z" fill="${color}" class="viz-mark"/>`;
      }
      bars += `<rect x="${padL+band*i}" y="${padT}" width="${band}" height="${ih}" fill="transparent" tabindex="0" class="viz-hit" data-tip="${this.tipAttr({t:b.label, rows:[['الكمية المرتجعة', fmtNum(b.v), color],['عدد العمليات', fmtNum(b.ops||0), null]]})}"/>`;
      if(i%every===0) bars += `<text x="${cx}" y="${H-8}" class="viz-axis" text-anchor="middle">${esc(b.short)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" dir="ltr" role="img" aria-label="الكمية المرتجعة على مدار الفترة">${g}<line x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}" class="viz-base"/>${bars}</svg>`;
  },
  renderDashboard(){
    this.initVizTip();
    const d = this.db, u = this.currentUser();
    const all = this.allStores();
    let scoped = all ? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
    let scopedOrders = all ? (d.orders||[]) : (d.orders||[]).filter(o=>o.storeId===u.storeId);
    if(all && this.dash.storeId){ scoped = scoped.filter(r=>r.storeId===this.dash.storeId); scopedOrders = scopedOrders.filter(o=>o.storeId===this.dash.storeId); }
    const P = this.dashPeriod();
    const inP = r=>r.date>=P.from && r.date<=P.to, inPrev = r=>r.date>=P.pFrom && r.date<=P.pTo;
    const cur = scoped.filter(inP), prev = scoped.filter(inPrev);
    const sumQ = a=>a.reduce((s,r)=>s+Number(r.qty||0),0);
    const qty = sumQ(cur), qtyPrev = sumQ(prev);
    const items = new Set(cur.map(r=>r.itemId)).size, itemsPrev = new Set(prev.map(r=>r.itemId)).size;
    const itemCost = id=>{ const it = d.items.find(i=>i.id===id); return it ? Number(it.cost||0) : 0; };
    const value = cur.reduce((s,r)=>s+Number(r.qty||0)*itemCost(r.itemId),0), valuePrev = prev.reduce((s,r)=>s+Number(r.qty||0)*itemCost(r.itemId),0);
    const ordQ = sumQ(scopedOrders.filter(inP));
    const rate = ordQ ? Math.round(qty/ordQ*1000)/10 : null;
    const showMoney = this.can('finance.view') && d.items.some(i=>Number(i.cost||0)>0);

    // expiry alerts (kept from before)
    const inAlert = new Date(); inAlert.setDate(inAlert.getDate()+this.expiryAlertDays());
    const expiryAlerts = scoped.filter(r=>r.expiry).map(r=>({...r, exp:new Date(r.expiry)})).filter(r=>r.exp<=inAlert).sort((a,b)=>a.exp-b.exp);

    // trend buckets: days → weeks → months depending on period length
    const buckets = [];
    const mode = this.vizMode(), CAT = this.VIZ_CAT[mode];
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || CAT[0];
    const addB = (from,to,label,short)=>{ const rs = cur.filter(r=>r.date>=from && r.date<=to); buckets.push({label, short, v:sumQ(rs), ops:rs.length}); };
    const ymd = dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    if(P.days<=35){
      for(let i=0;i<P.days;i++){ const dt=new Date(P.fromD); dt.setDate(dt.getDate()+i); addB(ymd(dt),ymd(dt), `${dt.getDate()} ${MONTHS[dt.getMonth()]}`, String(dt.getDate())); }
    } else if(P.days<=120){
      for(let i=0;i<P.days;i+=7){ const a=new Date(P.fromD); a.setDate(a.getDate()+i); const b=new Date(a); b.setDate(b.getDate()+6); addB(ymd(a), ymd(b)>P.to?P.to:ymd(b), `أسبوع ${a.getDate()} ${MONTHS[a.getMonth()]}`, `${a.getDate()}/${a.getMonth()+1}`); }
    } else {
      const s = new Date(P.fromD); for(let m=s.getMonth(); m<=new Date().getMonth(); m++){ const a=new Date(s.getFullYear(),m,1), b=new Date(s.getFullYear(),m+1,0); addB(ymd(a), ymd(b), MONTHS[m], MONTHS[m].slice(0,3)); }
    }

    // top items, each bar split by reason (top 5 reasons + "أخرى")
    const reasonTot = {}; cur.forEach(r=>{ reasonTot[r.reason||'أخرى']=(reasonTot[r.reason||'أخرى']||0)+Number(r.qty||0); });
    const reasonsSorted = Object.entries(reasonTot).sort((a,b)=>b[1]-a[1]);
    const mainReasons = reasonsSorted.slice(0,5).map(x=>x[0]);
    const hasOther = reasonsSorted.length>5;
    const seriesNames = mainReasons.concat(hasOther?['باقي الأسباب']:[]);
    const colorOf = name=> CAT[seriesNames.indexOf(name)] || CAT[7];
    const byItem = {};
    cur.forEach(r=>{
      const k = mainReasons.includes(r.reason) ? r.reason : 'باقي الأسباب';
      byItem[r.itemId] = byItem[r.itemId] || {total:0, ops:0, parts:{}};
      byItem[r.itemId].total += Number(r.qty||0); byItem[r.itemId].ops++;
      byItem[r.itemId].parts[k] = (byItem[r.itemId].parts[k]||0) + Number(r.qty||0);
    });
    const topItems = Object.entries(byItem).sort((a,b)=>b[1].total-a[1].total).slice(0,8);
    const maxItem = topItems.length ? topItems[0][1].total : 1;

    // branches
    const byStore = {};
    if(all && !this.dash.storeId) cur.forEach(r=>{ byStore[r.storeId] = byStore[r.storeId] || {q:0,ops:0}; byStore[r.storeId].q += Number(r.qty||0); byStore[r.storeId].ops++; });
    const storeRows = Object.entries(byStore).sort((a,b)=>b[1].q-a[1].q).slice(0,8);
    const maxStore = storeRows.length ? storeRows[0][1].q : 1;

    // recent activity (kept)
    let recentActivity = [];
    if(this.isAdmin()){
      recentActivity = (d.activityLog||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,6).map(e=>({label:e.label, meta:`${e.username} — ${new Date(e.ts).toLocaleString('ar-EG')}`}));
    } else {
      recentActivity = scoped.slice().sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''))).slice(0,6)
        .map(r=>({label:`ترجيع: ${this.itemName(r.itemId)} (${fmtNum(r.qty)} ${this.itemUnit(r.itemId)})`, meta:r.date||''}));
    }
    const emptySetup = d.stores.length===0 || d.items.length===0;
    const rangeLabel = (this.DASH_RANGES.find(x=>x[0]===this.dash.range)||[])[1];
    const stackRow = (label, parts, total, max, sub)=>{
      const w = Math.max(2, total/max*100);
      return `<div class="hb-row">
        <div class="hb-label" title="${esc(label)}">${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</div>
        <div class="hb-track"><div class="hb-bar" style="width:${w}%">${parts.map(([n,q,c])=>`<span style="flex:${q};background:${c}" tabindex="0" data-tip="${this.tipAttr({t:label, rows:[[n, fmtNum(q), c],['الإجمالي', fmtNum(total), null]]})}"></span>`).join('')}</div></div>
        <div class="hb-val">${fmtNum(total)}</div>
      </div>`;
    };
    const tableView = (head, rows)=>`<details class="viz-table"><summary>عرض كجدول</summary><div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;

    return `
      ${emptySetup ? `
      <div class="card" style="border-color:var(--accent-soft);background:var(--accent-soft);margin-bottom:14px;">
        <b>لبدء الاستخدام:</b> أضف أولاً <a href="#" onclick="App.go('stores');return false;">المحلات</a> و<a href="#" onclick="App.go('items');return false;">الأصناف</a>${all?` و<a href="#" onclick="App.go('warehouses');return false;">المستودعات</a>`:''}، ثم ابدأ تسجيل <a href="#" onclick="App.go('returns');return false;">المرتجعات</a>.
      </div>` : ''}

      <div class="dash-filters">
        <div class="seg">${this.DASH_RANGES.map(([k,l])=>`<button class="${this.dash.range===k?'on':''}" onclick="App.setDash('range','${k}')">${l}</button>`).join('')}</div>
        ${all? `<select onchange="App.setDash('storeId',this.value)"><option value="">كل الفروع</option>${d.stores.map(s=>`<option value="${s.id}" ${this.dash.storeId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>` : ''}
        <span class="small muted">من ${esc(P.from)} إلى ${esc(P.to)}</span>
      </div>

      <div class="grid grid-4 kpi-grid">
        <div class="stat accent kpi"><div class="l">الكمية المرتجعة</div><div class="n">${fmtNum(qty)}</div>${this.deltaHtml(qty, qtyPrev, true)}</div>
        <div class="stat kpi"><div class="l">عمليات الترجيع</div><div class="n">${fmtNum(cur.length)}</div>${this.deltaHtml(cur.length, prev.length, true)}</div>
        <div class="stat kpi"><div class="l">أصناف مرتجعة</div><div class="n">${fmtNum(items)}</div>${this.deltaHtml(items, itemsPrev, true)}</div>
        ${showMoney
          ? `<div class="stat kpi"><div class="l">قيمة المرتجعات (بالتكلفة)</div><div class="n">${fmtNum(Math.round(value))}</div>${this.deltaHtml(value, valuePrev, true)}</div>`
          : `<div class="stat kpi"><div class="l">نسبة الترجيع من الطلبيات</div><div class="n">${rate==null?'—':fmtNum(rate)+'%'}</div><span class="kpi-delta flat">${ordQ?`من ${fmtNum(ordQ)} مطلوب`:'مفيش طلبيات في الفترة'}</span></div>`}
      </div>
      <div class="grid grid-4 kpi-mini" style="margin-top:10px;">
        <div class="mini"><span>أكثر سبب</span><b>${reasonsSorted[0]?esc(reasonsSorted[0][0]):'—'}</b></div>
        <div class="mini"><span>أكثر صنف رجع</span><b>${topItems[0]?esc(this.itemName(topItems[0][0])):'—'}</b></div>
        <div class="mini"><span>${showMoney?'نسبة الترجيع من الطلبيات':'متوسط الكمية في العملية'}</span><b>${showMoney?(rate==null?'—':fmtNum(rate)+'%'):(cur.length?fmtNum(Math.round(qty/cur.length*10)/10):'—')}</b></div>
        <div class="mini ${expiryAlerts.length?'warn':''}"><span>تنبيهات صلاحية</span><b>${fmtNum(expiryAlerts.length)}</b></div>
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="section-head"><h3>المرتجعات على مدار الفترة <span class="muted small">(${esc(rangeLabel||'')} — ${P.days<=35?'يومي':P.days<=120?'أسبوعي':'شهري'})</span></h3></div>
        ${qty? this.columnChartHtml(buckets, accent) + tableView(['الفترة','الكمية','العمليات'], buckets.map(b=>[b.label, fmtNum(b.v), fmtNum(b.ops)])) : `<div class="empty small">مفيش مرتجعات في الفترة دي</div>`}
      </div>

      <div class="grid grid-2" style="margin-top:14px;align-items:start;">
        <div class="card">
          <div class="section-head"><h3>الأكثر ترجيعًا وأسبابه</h3></div>
          ${topItems.length? `
          <div class="viz-legend">${seriesNames.map(n=>`<span><i style="background:${colorOf(n)}"></i>${esc(n)}</span>`).join('')}</div>
          <div class="hb">${topItems.map(([iid,info])=>stackRow(this.itemName(iid)||'صنف محذوف', seriesNames.filter(n=>info.parts[n]).map(n=>[n, info.parts[n], colorOf(n)]), info.total, maxItem, `${fmtNum(info.ops)} عملية`)).join('')}</div>
          ${tableView(['الصنف','الإجمالي'].concat(seriesNames), topItems.map(([iid,info])=>[this.itemName(iid), fmtNum(info.total)].concat(seriesNames.map(n=>fmtNum(info.parts[n]||0)))))}` : `<div class="empty small">مفيش بيانات في الفترة دي</div>`}
        </div>
        <div class="card">
          <div class="section-head"><h3>أسباب المرتجعات</h3></div>
          ${reasonsSorted.length? `<div class="hb">${reasonsSorted.slice(0,8).map(([n,q])=>{
              const c = colorOf(mainReasons.includes(n)? n : 'باقي الأسباب');
              const pct = qty? Math.round(q/qty*100) : 0;
              return stackRow(n, [[n,q,c]], q, reasonsSorted[0][1], `${fmtNum(pct)}% من الإجمالي`);
            }).join('')}</div>` : `<div class="empty small">مفيش بيانات في الفترة دي</div>`}
        </div>
      </div>

      <div class="grid grid-2" style="margin-top:14px;align-items:start;">
        ${storeRows.length? `<div class="card">
          <div class="section-head"><h3>الفروع الأكثر ترجيعًا</h3></div>
          <div class="hb">${storeRows.map(([sid,info])=>stackRow(this.storeName(sid)||'—', [['الكمية', info.q, accent]], info.q, maxStore, `${fmtNum(info.ops)} عملية`)).join('')}</div>
        </div>` : ''}
        <div class="card">
          <div class="section-head"><h3>تنبيهات الصلاحية</h3></div>
          ${expiryAlerts.length? `
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>المحل</th><th>الصلاحية</th><th>الحالة</th></tr></thead><tbody>
            ${expiryAlerts.slice(0,8).map(r=>{
              const expired = r.exp < new Date(new Date().setHours(0,0,0,0));
              return `<tr><td>${esc(this.itemName(r.itemId))}</td><td>${esc(this.storeName(r.storeId)||'—')}</td><td>${esc(r.expiry)}</td><td>${expired?'<span class="tag bad">⛔ منتهية</span>':'<span class="tag warn">⚠ قريبة</span>'}</td></tr>`;
            }).join('')}
          </tbody></table></div>` : `<div class="empty small">لا توجد تنبيهات صلاحية حاليًا</div>`}
        </div>
        <div class="card">
          <div class="section-head"><h3>آخر الحركات</h3></div>
          ${recentActivity.length? `<div class="activity-feed">${recentActivity.map(a=>`<div class="activity-row"><div class="dot"></div><div class="body"><div class="label">${esc(a.label)}</div>${a.meta?`<div class="meta">${esc(a.meta)}</div>`:''}</div></div>`).join('')}</div>` : `<div class="empty small">لا توجد حركات مسجّلة بعد</div>`}
        </div>
      </div>
    `;
  },

  /* =====================================================================
     RETURNS
  ===================================================================== */
  returnsFilter: {store:'', item:'', from:'', to:'', reason:'', q:''},

  renderReturns(){
    const d = this.db;
    const u = this.currentUser();
    const f = this.returnsFilter;
    let rows = this.allStores() ? d.returns.slice() : d.returns.filter(r=>this.inUserScope(r,u));
    if(f.store) rows = rows.filter(r=>r.storeId===f.store);
    if(f.item) rows = rows.filter(r=>r.itemId===f.item);
    if(f.reason) rows = rows.filter(r=>r.reason===f.reason);
    if(f.from) rows = rows.filter(r=>r.date>=f.from);
    if(f.to) rows = rows.filter(r=>r.date<=f.to);
    if(f.q){
      const q = f.q.trim().toLowerCase();
      rows = rows.filter(r=>{
        const it = d.items.find(i=>i.id===r.itemId);
        return (r.transferNo||'').toLowerCase().includes(q)
          || (it && (it.barcode||'').toLowerCase().includes(q))
          || (it && (it.code||'').toLowerCase().includes(q))
          || (it && (it.name||'').toLowerCase().includes(q));
      });
    }
    rows.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const canPickStore = this.allStores();

    return `
      <div class="section-head">
        <h3>سجل المرتجعات <span class="muted small">(${fmtNum(rows.length)} عملية — إجمالي الكمية ${fmtNum(totalQty)})</span></h3>
        <div class="actions">
          <button class="btn btn-sm" onclick="App.exportCSV(App.buildReturnsExportRows(),'المرتجعات')">تصدير CSV</button>
          ${this.can('returns.import')? `<button class="btn btn-sm" onclick="App.openImportReturns()">📥 استيراد من إكسيل</button>`:''}
          ${this.can('returns.add')? `<button class="btn btn-accent btn-sm" onclick="App.openReturnForm()">+ تسجيل مرتجع جديد</button>`:''}
        </div>
      </div>

      <div class="filters card" style="margin-bottom:14px;">
        <div class="field" style="flex:2;min-width:220px;">
          <label>بحث بالباركود أو رقم المرتجع/التحويل أو اسم الصنف</label>
          <input type="text" id="returnsSearchInput" placeholder="اكتب للبحث..." value="${esc(f.q)}" oninput="App.returnsFilter.q=this.value;App.render()">
        </div>
        ${canPickStore? `<div class="field"><label>المحل</label><select onchange="App.returnsFilter.store=this.value;App.render()">
          <option value="">كل المحلات</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${f.store===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>`:''}
        <div class="field"><label>الصنف</label><select onchange="App.returnsFilter.item=this.value;App.render()">
          <option value="">كل الأصناف</option>
          ${d.items.map(s=>`<option value="${s.id}" ${f.item===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>السبب</label><select onchange="App.returnsFilter.reason=this.value;App.render()">
          <option value="">كل الأسباب</option>
          ${this.reasons().map(r=>`<option ${f.reason===r?'selected':''}>${esc(r)}</option>`).join('')}
        </select></div>
        <div class="field"><label>من تاريخ</label><input type="date" value="${f.from}" onchange="App.returnsFilter.from=this.value;App.render()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${f.to}" onchange="App.returnsFilter.to=this.value;App.render()"></div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.returnsFilter={store:'',item:'',from:'',to:'',reason:'',q:''};App.render()">تصفية جديدة</button></div>
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>التاريخ</th><th>الوقت</th><th>المحل</th><th>اسم الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>شد الصنف</th><th>الكمية</th><th>رقم تحويل المرتجع</th><th>السبب</th><th>طريقة العلاج</th><th>تاريخ الصلاحية</th><th>المستودع</th><th></th>
          </tr></thead>
          <tbody>
          ${rows.length===0? `<tr><td colspan="14"><div class="empty">لا توجد مرتجعات مطابقة<br><span class="small">استخدم زر "تسجيل مرتجع جديد" لإضافة أول عملية</span></div></td></tr>` :
          rows.map(r=>{
            const it = d.items.find(i=>i.id===r.itemId);
            return `
            <tr>
              <td>${esc(r.date)}</td>
              <td>${esc(r.time||'—')}</td>
              <td>${esc(this.storeName(r.storeId)||'—')}</td>
              <td>${esc(it?it.name:'—')}</td>
              <td>${esc((it&&it.code)||'—')}</td>
              <td>${esc((it&&it.barcode)||'—')}</td>
              <td>${esc((it&&it.packSize)||'—')}</td>
              <td>${fmtNum(r.qty)} ${esc(this.returnUnit(r))}</td>
              <td>${esc(r.transferNo||'—')}</td>
              <td><span class="tag">${esc(r.reason)}</span></td>
              <td>${this.can('returns.edit')?`<select onchange="App.quickSetResolution('${r.id}',this.value)" style="min-width:150px;">${this.resolutions().map(res=>`<option ${(r.resolution||'معلّق')===res?'selected':''}>${esc(res)}</option>`).join('')}</select>`:`<span class="tag">${esc(r.resolution||'معلّق')}</span>`}</td>
              <td>${r.expiry? esc(r.expiry) : '<span class="muted">—</span>'}</td>
              <td>${esc(this.whName(r.warehouseId))}</td>
              <td>
                ${this.can('returns.edit')? `<button class="icon-btn" title="تعديل" onclick="App.openReturnForm('${r.id}')">✎</button>`:''}
                ${this.can('returns.delete')? `<button class="icon-btn" title="حذف" onclick="App.deleteReturn('${r.id}')">✕</button>`:''}
              </td>
            </tr>
          `;}).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  buildReturnsExportRows(){
    const rows = this.allStores() ? this.db.returns : this.db.returns.filter(r=>r.storeId===this.currentUser().storeId);
    return [
      ['التاريخ','الوقت','المحل','اسم الصنف','رمز الصنف','الباركود','الكمية','الوحدة','رقم تحويل المرتجع','السبب','تاريخ الصلاحية','المستودع'],
      ...rows.map(r=>{
        const it = this.db.items.find(i=>i.id===r.itemId);
        return [r.date,r.time,this.storeName(r.storeId),it?it.name:'—',(it&&it.code)||'',(it&&it.barcode)||'',r.qty,this.returnUnit(r),r.transferNo,r.reason,r.expiry,this.whName(r.warehouseId)];
      })
    ];
  },

  openReturnForm(id){
    const d = this.db;
    const editing = id ? d.returns.find(r=>r.id===id) : null;
    const u = this.currentUser();
    const lockedStore = !this.allStores() ? u.storeId : null;

    if(d.stores.length===0 || d.items.length===0){
      this.notify('من فضلك أضف محل واحد على الأقل وصنف واحد على الأقل قبل تسجيل مرتجع.');
      return;
    }

    const initialItemId = editing ? editing.itemId : d.items[0].id;
    const initialItem = d.items.find(i=>i.id===initialItemId) || d.items[0];
    const initialUnit = (editing && editing.unit) ? editing.unit
      : (initialItem && UNITS.includes(initialItem.unit) ? initialItem.unit : UNITS[0]);
    const isCustomReason = editing && !this.reasons().includes(editing.reason);

    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>${editing?'تعديل مرتجع':'تسجيل مرتجع جديد'}</h3>
      <div class="form-row">
        <div class="field">
          <label>المحل</label>
          <select id="f_store" ${lockedStore?'disabled':''}>
            ${d.stores.map(s=>`<option value="${s.id}" ${(editing?editing.storeId:lockedStore)===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>الباركود (اكتب أو امسح للبحث السريع)</label>
          <input type="text" id="f_barcode" value="${esc(initialItem?initialItem.barcode||'':'')}" oninput="App.onReturnBarcodeInput(this.value)">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>اسم الصنف</label>
          <select id="f_item" onchange="App.onReturnItemSelect()">
            ${d.items.map(s=>`<option value="${s.id}" ${initialItemId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>رمز الصنف</label><input type="text" id="f_code" value="${esc(initialItem?initialItem.code||'':'')}" readonly></div>
      </div>
      <div class="form-row">
        <div class="field"><label>شد الصنف</label><input type="text" id="f_pack" value="${esc(initialItem?initialItem.packSize||'':'')}" readonly></div>
        <div class="field">
          <label>الوحدة</label>
          <input type="hidden" id="f_unit" value="${esc(initialUnit)}">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${UNITS.map(un=>`<button type="button" class="pill-tab unit-pill ${initialUnit===un?'active':''}" data-unit="${esc(un)}" onclick="App.selectReturnUnit('${esc(un)}')">${esc(un)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>الكمية</label><input type="number" min="0" step="any" id="f_qty" value="${editing?editing.qty:''}"></div>
        <div class="field"><label>رقم تحويل المرتجع</label><input type="text" id="f_transfer" value="${editing?esc(editing.transferNo||''):''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>تاريخ الترجيع</label><input type="date" id="f_date" value="${editing?editing.date:todayStr()}"></div>
        <div class="field"><label>وقت الترجيع</label><input type="time" id="f_time" value="${editing?(editing.time||nowTime()):nowTime()}"></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>سبب الترجيع</label>
          <select id="f_reason" onchange="App.onReturnReasonChange()">${this.reasons().map(r=>`<option ${(isCustomReason? r==='أخرى' : editing&&editing.reason===r)?'selected':''}>${esc(r)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>تاريخ الصلاحية (إن وجد)</label><input type="date" id="f_expiry" value="${editing&&editing.expiry?editing.expiry:''}"></div>
      </div>
      <div class="field" id="f_reason_other_wrap" style="display:${isCustomReason?'block':'none'};">
        <label>اذكر السبب</label>
        <input type="text" id="f_reason_other" placeholder="اكتب سبب الترجيع بالتفصيل" value="${isCustomReason?esc(editing.reason):''}">
      </div>
      <div class="field">
        <label>المستودع المستلم (اختياري)</label>
        <select id="f_wh">
          <option value="">— بدون تحديد —</option>
          ${d.warehouses.map(s=>`<option value="${s.id}" ${(editing?editing.warehouseId:(u.warehouseId||this.storeDefaultWarehouse(lockedStore||d.stores[0]&&d.stores[0].id)))===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>طريقة العلاج (ماذا تم فعليًا في البضاعة المرتجعة)</label>
        <select id="f_resolution">
          ${this.resolutions().map(r=>`<option ${(editing?editing.resolution:'معلّق')===r?'selected':''}>${esc(r)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveReturn('${editing?editing.id:''}')">${editing?'حفظ التعديل':'حفظ المرتجع'}</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
  },
  onReturnItemSelect(){
    const itemId = document.getElementById('f_item').value;
    const it = this.db.items.find(i=>i.id===itemId);
    const barcodeEl = document.getElementById('f_barcode');
    const codeEl = document.getElementById('f_code');
    const packEl = document.getElementById('f_pack');
    if(barcodeEl) barcodeEl.value = it ? (it.barcode||'') : '';
    if(codeEl) codeEl.value = it ? (it.code||'') : '';
    if(packEl) packEl.value = it ? (it.packSize||'') : '';
    if(it && UNITS.includes(it.unit)) this.selectReturnUnit(it.unit);
  },
  selectReturnUnit(val){
    const hidden = document.getElementById('f_unit');
    if(hidden) hidden.value = val;
    document.querySelectorAll('.unit-pill').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.unit===val);
    });
  },
  onReturnReasonChange(){
    const sel = document.getElementById('f_reason');
    const wrap = document.getElementById('f_reason_other_wrap');
    if(!sel || !wrap) return;
    wrap.style.display = sel.value === 'أخرى' ? 'block' : 'none';
    if(sel.value === 'أخرى'){
      const otherInput = document.getElementById('f_reason_other');
      if(otherInput) otherInput.focus();
    }
  },
  onReturnBarcodeInput(val){
    val = String(val||'').trim();
    if(!val) return;
    const it = this.db.items.find(i=>String(i.barcode||'').trim()===val);
    if(it){
      const itemEl = document.getElementById('f_item');
      if(itemEl){ itemEl.value = it.id; this.onReturnItemSelect(); }
    }
  },


  saveReturn(id){
    const storeId = document.getElementById('f_store').value;
    const itemId = document.getElementById('f_item').value;
    const unit = document.getElementById('f_unit').value;
    const qty = parseFloat(document.getElementById('f_qty').value);
    const transferNo = document.getElementById('f_transfer').value.trim();
    const date = document.getElementById('f_date').value;
    const time = document.getElementById('f_time').value;
    let reason = document.getElementById('f_reason').value;
    const expiry = document.getElementById('f_expiry').value;
    const warehouseId = document.getElementById('f_wh').value || null;
    const resolutionEl = document.getElementById('f_resolution');
    const resolution = resolutionEl ? resolutionEl.value : 'معلّق';

    if(reason === 'أخرى'){
      const otherReason = document.getElementById('f_reason_other').value.trim();
      if(!otherReason){
        this.notify('من فضلك اكتب سبب الترجيع في الخانة اللي ظهرت بعد اختيار "أخرى".');
        return;
      }
      reason = otherReason;
    }

    if(!storeId || !itemId || !qty || qty<=0 || !date){
      this.notify('من فضلك أكمل الحقول المطلوبة: المحل، الصنف، الكمية، التاريخ.');
      return;
    }
    const itName = this.itemName(itemId);
    if(id){
      const r = this.db.returns.find(x=>x.id===id);
      // reverse this return's old stock effect before applying the edited values
      this.adjustStock(r.itemId,'store',r.storeId, r.qty);
      if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, -r.qty);
      Object.assign(r, {storeId,itemId,unit,qty,transferNo,date,time,reason,expiry,warehouseId,resolution});
      this.adjustStock(itemId,'store',storeId, -qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, qty);
      this.logActivity(`عدّل مرتجع: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    } else {
      this.db.returns.push({id:uid(), storeId,itemId,unit,qty,transferNo,date,time,reason,expiry,warehouseId,resolution});
      // a return moves stock from the store back to the warehouse
      this.adjustStock(itemId,'store',storeId, -qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, qty);
      this.logActivity(`سجّل مرتجع جديد: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }
    this.closeModal();
    this.refresh();
  },
  quickSetResolution(id, value){
    const r = this.db.returns.find(x=>x.id===id);
    if(!r) return;
    r.resolution = value;
    this.logActivity(`غيّر طريقة علاج مرتجع (${this.itemName(r.itemId)}) إلى: ${value}`);
    this.refresh();
  },
  deleteReturn(id){
    this.confirmAction('تأكيد حذف سجل المرتجع؟', ()=>{
      const r = this.db.returns.find(x=>x.id===id);
      if(r){
        this.adjustStock(r.itemId,'store',r.storeId, r.qty);
        if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, -r.qty);
        this.logActivity(`حذف مرتجع: ${this.itemName(r.itemId)} (${fmtNum(r.qty)}) — ${this.storeName(r.storeId)||''}`);
      }
      this.db.returns = this.db.returns.filter(r=>r.id!==id);
      this.refresh();
    });
  },

  /* ---------------- BULK IMPORT RETURNS FROM EXCEL ---------------- */
  async downloadReturnsTemplate(){
    const wsData = [
      ['التاريخ (YYYY-MM-DD)','الوقت (HH:MM)','المحل','الباركود','رمز الصنف','اسم الصنف','شد الصنف','الوحدة (اختر من القائمة)','الكمية','رقم تحويل المرتجع','السبب','تاريخ الصلاحية (اختياري)','المستودع (اختياري)'],
      ['2026-09-20','14:30','فرع المعادي','6221234567890','IT-1001','بسكويت شوكولاتة 200جم','24 قطعة','كرتون',12,'TRF-1001','منتهي الصلاحية','2026-09-10','المستودع الرئيسي'],
      ['2026-09-21','10:15','فرع مدينة نصر','','','عصير مانجو 1 لتر','','حبة',5,'TRF-1002','تالف','','' ],
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:16},{wch:12},{wch:18},{wch:18},{wch:14},{wch:30},{wch:14},{wch:20},{wch:10},{wch:16},{wch:18},{wch:16},{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المرتجعات');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});

    // Column H = "الوحدة" (8th column). Inject a real Excel dropdown (data
    // validation) into that column, since the free XLSX library can't
    // write data validations through its normal API.
    try{
      const zip = await JSZip.loadAsync(out);
      const sheetPath = 'xl/worksheets/sheet1.xml';
      const sheetFile = zip.file(sheetPath);
      if(!sheetFile) throw new Error('sheet xml not found');
      let xml = await sheetFile.async('string');
      const dv = `<dataValidations count="1"><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="H2:H1000"><formula1>"${UNITS.join(',')}"</formula1></dataValidation></dataValidations>`;
      xml = xml.includes('</sheetData>')
        ? xml.replace('</sheetData>', '</sheetData>'+dv)
        : xml.replace('</worksheet>', dv+'</worksheet>');
      zip.file(sheetPath, xml);
      const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      this.saveFile('نموذج_استيراد_المرتجعات.xlsx', blob);
    }catch(err){
      console.error('data validation injection failed, saving plain file', err);
      const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      this.saveFile('نموذج_استيراد_المرتجعات.xlsx', blob);
    }
  },
  openImportReturns(){ this.openSmartImport('returns'); },
  excelCellToDateStr(cell){
    if(cell instanceof Date){
      return `${cell.getFullYear()}-${String(cell.getMonth()+1).padStart(2,'0')}-${String(cell.getDate()).padStart(2,'0')}`;
    }
    const s = String(cell==null?'':cell).trim();
    if(!s) return '';
    if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
      const [y,m,dd] = s.split('-');
      return `${y}-${m.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    }
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    return s;
  },
  excelCellToTimeStr(cell){
    if(cell instanceof Date){
      return `${String(cell.getHours()).padStart(2,'0')}:${String(cell.getMinutes()).padStart(2,'0')}`;
    }
    const s = String(cell==null?'':cell).trim();
    if(/^\d{1,2}:\d{2}$/.test(s)) return s.length===4? '0'+s : s;
    return s;
  },
  /* =====================================================================
     SMART IMPORT FOR RETURNS / ORDERS — any sheet, any column order.
     Only the item (code OR barcode OR name) and the quantity are needed;
     everything else about the item (code, barcode, pack, unit) comes from
     the registered items list. Missing date/branch/reason use the defaults
     chosen in the dialog.
  ===================================================================== */
  _moveImport: null,
  MOVE_FIELDS: {
    returns: [
      {k:'qty', label:'الكمية', required:true}, {k:'date', label:'التاريخ'}, {k:'time', label:'الوقت'},
      {k:'store', label:'المحل / الفرع'}, {k:'warehouse', label:'المستودع'}, {k:'transferNo', label:'رقم تحويل المرتجع'},
      {k:'reason', label:'السبب'}, {k:'expiry', label:'تاريخ الصلاحية'},
    ],
    orders: [
      {k:'qty', label:'الكمية', required:true}, {k:'date', label:'التاريخ'},
      {k:'store', label:'المحل / الفرع'}, {k:'warehouse', label:'المستودع المورّد'},
    ],
  },
  _moveFieldOf(h){
    const n = this._arNorm(h);
    if(!n) return null;
    const any = (ws)=> ws.some(w=>n.includes(this._arNorm(w)));
    if(any(['صلاحيه','انتهاء','expiry','exp date','best before'])) return 'expiry';
    if(any(['تاريخ','date','اليوم'])) return 'date';
    if(any(['وقت','الساعه','time'])) return 'time';
    if(any(['تحويل','رقم المرتجع','رقم الاذن','اذن','سند','مستند','transfer','ref','voucher','doc no'])) return 'transferNo';
    if(any(['سبب','reason'])) return 'reason';
    if(any(['مستودع','مخزن','warehouse'])) return 'warehouse';
    if(any(['فرع','محل','معرض','store','branch','shop'])) return 'store';
    return null;
  },
  _parseDateCell(cell){
    if(cell instanceof Date && !isNaN(cell)) return `${cell.getFullYear()}-${String(cell.getMonth()+1).padStart(2,'0')}-${String(cell.getDate()).padStart(2,'0')}`;
    if(typeof cell==='number' && cell>20000 && cell<80000){ // Excel serial date
      const dt = new Date(Math.round((cell-25569)*86400000));
      return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
    }
    const s = this._arNorm(cell);
    if(!s) return '';
    let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){
      let a=+m[1], b=+m[2], y=m[3].length===2? '20'+m[3] : m[3];
      let day=a, mon=b;                  // day/month is the local convention
      if(b>12 && a<=12){ day=b; mon=a; } // clearly month/day
      return `${y}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
    return '';
  },
  _parseTimeCell(cell){
    if(cell instanceof Date && !isNaN(cell)) return `${String(cell.getHours()).padStart(2,'0')}:${String(cell.getMinutes()).padStart(2,'0')}`;
    if(typeof cell==='number' && cell>=0 && cell<1){ const mins=Math.round(cell*1440); return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`; }
    const m = this._arNorm(cell).match(/^(\d{1,2}):(\d{2})/);
    return m ? `${m[1].padStart(2,'0')}:${m[2]}` : '';
  },
  openSmartImport(kind){
    if(!this.can(kind+'.import')){ this.notify('مش مسموح لحسابك بالاستيراد — كلّم المدير.'); return; }
    const d = this.db, u = this.currentUser();
    if(d.items.length===0){ this.notify('سجّل الأصناف الأول (من صفحة الأصناف) عشان البرنامج يقدر يتعرف عليها في الملف.'); return; }
    if(d.stores.length===0){ this.notify('أضف محل واحد على الأقل الأول.'); return; }
    const admin = this.allStores();
    const defStore = (!admin && u.storeId) ? u.storeId : (d.stores[0]||{}).id;
    this._moveImport = {kind, book:null, sheetIdx:0, map:{}, defStore, defWh: this.storeDefaultWarehouse(defStore) || (u.warehouseId||''),
      defDate: todayStr(), defReason: kind==='returns' ? (this.reasons()[0]||'أخرى') : ''};
    const title = kind==='returns' ? 'المرتجعات' : 'الطلبيات';
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>📥 استيراد ${title} من إكسيل</h3>
      <div class="help-box" style="margin-bottom:14px;">
        ارفع <b>أي شيت</b> زي ما هو — يكفي يكون فيه <b>الصنف</b> (بالكود أو الباركود أو الاسم) و<b>الكمية</b>، بأي ترتيب.
        البرنامج بيتعرف على الصنف ويجيب باقي بياناته (الكود، الباركود، الشد، الوحدة) من الأصناف المسجلة.
        لو الملف فيه أعمدة زي التاريخ أو الفرع${kind==='returns'?' أو السبب أو رقم التحويل':''} هياخدها، ولو مش موجودة هيستخدم الاختيارات اللي تحت.
      </div>
      <div class="field"><label>ملف الإكسيل (xlsx / xls / csv)</label>
        <input type="file" id="moveFile" accept=".xlsx,.xls,.xlsm,.csv" onchange="App.readMoveFile()"></div>
      <div id="moveImportPreview"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" id="moveImportApply" disabled onclick="App.applyMoveImport()">تأكيد الاستيراد</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `, true);
  },
  readMoveFile(){
    const input = document.getElementById('moveFile');
    const box = document.getElementById('moveImportPreview');
    if(!input.files || !input.files[0]) return;
    box.innerHTML = '<div class="small muted">جاري قراءة الملف…</div>';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
        const maps = this._stockMaps();
        const st = this._moveImport;
        const fields = this.MOVE_FIELDS[st.kind];
        const sheets = wb.SheetNames.map(n=>{
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''});
          const a = this._analyzeStockSheet(aoa, maps);
          const map = {};
          a.header.forEach((h,c)=>{ const f=this._moveFieldOf(h); if(f && map[f]==null && fields.some(x=>x.k===f)) map[f]=c; });
          // no header for the branch / warehouse? find it by content
          const storeNames = new Set(this.db.stores.flatMap(s=>[s.name,s.code].filter(Boolean).map(x=>this._idKey(x))));
          const whNames = new Set(this.db.warehouses.flatMap(w=>[w.name,w.code].filter(Boolean).map(x=>this._idKey(x))));
          a.cols.forEach(x=>{
            if(!x.nonEmpty) return;
            const vals = a.data.slice(0,300).map(r=>this._idKey(r[x.c])).filter(v=>v && !/^\d+$/.test(v));
            if(!vals.length) return;
            if(map.store==null && vals.filter(v=>storeNames.has(v)).length/vals.length>=0.6) map.store = x.c;
            else if(map.warehouse==null && fields.some(f=>f.k==='warehouse') && vals.filter(v=>whNames.has(v)).length/vals.length>=0.6) map.warehouse = x.c;
          });
          const taken = new Set(Object.values(map));
          map.qty = (a.qtyCands.find(c=>!taken.has(c) && !a.idCols.includes(c)));
          if(map.qty==null) delete map.qty;
          const matched = a.data.filter(r=>a.idCols.some(c=>this._matchItem(r[c], maps))).length;
          return {name:n, a, map, matched};
        });
        let bestIdx = 0; sheets.forEach((s,i)=>{ if(s.matched>sheets[bestIdx].matched) bestIdx=i; });
        st.book = sheets; st.sheetIdx = bestIdx; st.map = Object.assign({}, sheets[bestIdx].map);
        this.renderMoveImportPreview();
      }catch(err){
        console.error(err);
        box.innerHTML = `<div class="help-box" style="color:var(--bad);">تعذّرت قراءة الملف. تأكد إنه ملف إكسيل (xlsx / xls) أو csv.</div>`;
      }
    };
    reader.readAsArrayBuffer(input.files[0]);
  },
  _computeMoveImport(){
    const st = this._moveImport, d = this.db, u = this.currentUser(), admin = this.allStores();
    const a = st.book[st.sheetIdx].a, m = st.map;
    const maps = this._stockMaps();
    const storeBy = new Map(); d.stores.forEach(s=>[s.name,s.code].filter(Boolean).forEach(k=>storeBy.set(this._idKey(k), s)));
    const whBy = new Map(); d.warehouses.forEach(w=>[w.name,w.code].filter(Boolean).forEach(k=>whBy.set(this._idKey(k), w)));
    const cell = (r,k)=> m[k]==null ? '' : r[m[k]];
    const out = {rows:[], unmatched:new Map(), noQty:0, noStore:0, wrongStore:0, badDate:0};
    a.data.forEach(r=>{
      let it = null;
      for(const c of a.idCols){ it = this._matchItem(r[c], maps); if(it) break; }
      const qty = m.qty==null ? NaN : this._parseQty(cell(r,'qty'));
      if(!it){
        const label = (a.idCols.length? r[a.idCols[0]] : '') || r.find(v=>typeof v==='string' && v.trim() && isNaN(this._parseQty(v))) || '';
        if(String(label).trim() && !isNaN(qty) && !/اجمال|مجموع|total|sum/i.test(this._arNorm(label))) out.unmatched.set(String(label).trim(), true);
        return;
      }
      if(isNaN(qty) || qty<=0){ out.noQty++; return; }
      let storeId = st.defStore;
      if(m.store!=null && String(cell(r,'store')).trim()!==''){
        const s = storeBy.get(this._idKey(cell(r,'store')));
        if(!s){ out.noStore++; return; }
        storeId = s.id;
      }
      if(!storeId){ out.noStore++; return; }
      if(!admin && u.storeId && storeId!==u.storeId){ out.wrongStore++; return; }
      let warehouseId = st.defWh || this.storeDefaultWarehouse(storeId) || null;
      if(m.warehouse!=null && String(cell(r,'warehouse')).trim()!==''){
        const w = whBy.get(this._idKey(cell(r,'warehouse')));
        if(w) warehouseId = w.id;
      }
      let date = st.defDate;
      if(m.date!=null && String(cell(r,'date')).trim()!==''){
        date = this._parseDateCell(cell(r,'date'));
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ out.badDate++; return; }
      }
      const rec = {itemId:it.id, storeId, warehouseId, qty, date};
      if(st.kind==='returns'){
        rec.time = (m.time!=null && this._parseTimeCell(cell(r,'time'))) || nowTime();
        rec.transferNo = m.transferNo!=null ? this._cellStr(cell(r,'transferNo')).trim() : '';
        rec.reason = (m.reason!=null && String(cell(r,'reason')).trim()) || st.defReason || 'أخرى';
        rec.expiry = m.expiry!=null ? this._parseDateCell(cell(r,'expiry')) : '';
        rec.unit = it.unit || '';
      }
      out.rows.push(rec);
    });
    out.unmatched = Array.from(out.unmatched.keys());
    return out;
  },

        <div class="stat ${extraSkipped?'warn':''}"><div class="n">${fmtNum(extraSkipped)}</div><div class="l">صف اتساب${res.noQty?` — ${fmtNum(res.noQty)} من غير كمية`:''}${res.noStore?` — ${fmtNum(res.noStore)} فرع مش معروف`:''}${res.wrongStore?` — ${fmtNum(res.wrongStore)} لفرع غير فرعك`:''}${res.badDate?` — ${fmtNum(res.badDate)} تاريخ غلط`:''}</div></div>

      ${sample.length? `<div class="small muted" style="margin-bottom:4px;">معاينة — بيانات الصنف جاية من الأصناف المسجلة:</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>المحل</th><th>الصنف</th><th>الكود</th><th>الباركود</th><th>الشد</th><th>الكمية</th>${st.kind==='returns'?'<th>رقم التحويل</th><th>السبب</th>':''}</tr></thead><tbody>
        ${sample.map(r=>{ const it=d.items.find(i=>i.id===r.itemId)||{};
          return `<tr><td>${esc(r.date)}</td><td>${esc(this.storeName(r.storeId)||'—')}</td><td>${esc(it.name||'')}</td><td>${esc(it.code||'—')}</td><td>${esc(it.barcode||'—')}</td><td>${esc(it.packSize||'—')}</td><td>${fmtNum(r.qty)} ${esc(it.unit||'')}</td>${st.kind==='returns'?`<td>${esc(r.transferNo||'—')}</td><td>${esc(r.reason)}</td>`:''}</tr>`; }).join('')}
      </tbody></table></div>${res.rows.length>sample.length?`<div class="small muted" style="margin-top:4px;">و${fmtNum(res.rows.length-sample.length)} صف كمان…</div>`:''}`:''}
    `;
  },
  applyMoveImport(){
    const st = this._moveImport;
    const res = st && st.result;
    if(!res || !res.rows.length) return;
    res.rows.forEach(r=>{
      if(st.kind==='returns'){
        this.db.returns.push({id:uid(), storeId:r.storeId, itemId:r.itemId, warehouseId:r.warehouseId, unit:r.unit, qty:r.qty,
          transferNo:r.transferNo, date:r.date, time:r.time, reason:r.reason, expiry:r.expiry});
        // a return moves stock from the store back to the warehouse
        this.adjustStock(r.itemId,'store',r.storeId, -r.qty);
        if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, r.qty);
      }else{
        this.db.orders.push({id:uid(), storeId:r.storeId, itemId:r.itemId, qty:r.qty, date:r.date, warehouseId:r.warehouseId});
        // an order moves stock from the warehouse to the store
        this.adjustStock(r.itemId,'store',r.storeId, r.qty);
        if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, -r.qty);
      }
    });
    const label = st.kind==='returns' ? 'مرتجع' : 'طلبية';
    this.logActivity(`استورد ${fmtNum(res.rows.length)} ${label} من إكسيل`);
    this._moveImport = null;
    this.closeModal();
    this.refresh();
    this.notify(`تم تسجيل ${fmtNum(res.rows.length)} ${label} من الملف ✅`);
  },

  /* =====================================================================
     ORDERS
  ===================================================================== */
  ordersFilter:{store:'',item:'',from:'',to:''},

  renderOrders(){
    const d = this.db;
    const u = this.currentUser();
    const f = this.ordersFilter;
    let rows = this.allStores() ? d.orders.slice() : d.orders.filter(r=>r.storeId===u.storeId);
    if(f.store) rows = rows.filter(r=>r.storeId===f.store);
    if(f.item) rows = rows.filter(r=>r.itemId===f.item);
    if(f.from) rows = rows.filter(r=>r.date>=f.from);
    if(f.to) rows = rows.filter(r=>r.date<=f.to);
    rows.sort((a,b)=>b.date.localeCompare(a.date));
    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const canPickStore = this.allStores();

    return `
      <div class="help-box" style="margin-bottom:14px;">
        سجّل هنا كمية كل طلبية تصل للمحل من كل صنف. البيانات دي بتُستخدم في تقرير "الطلبيات مقابل المرتجعات" لمعرفة نسبة الترجيع من إجمالي ما تم طلبه.
      </div>
      <div class="section-head">
        <h3>سجل الطلبيات <span class="muted small">(${fmtNum(rows.length)} عملية — إجمالي الكمية ${fmtNum(totalQty)})</span></h3>
        <div class="actions">
          ${this.can('orders.import')? `<button class="btn btn-sm" onclick="App.openSmartImport('orders')">📥 استيراد من إكسيل</button>`:''}
          ${this.can('orders.add')? `<button class="btn btn-accent btn-sm" onclick="App.openOrderForm()">+ تسجيل طلبية</button>`:''}
        </div>
      </div>
      <div class="filters card" style="margin-bottom:14px;">
        ${canPickStore? `<div class="field"><label>المحل</label><select onchange="App.ordersFilter.store=this.value;App.render()">
          <option value="">كل المحلات</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${f.store===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>`:''}
        <div class="field"><label>الصنف</label><select onchange="App.ordersFilter.item=this.value;App.render()">
          <option value="">كل الأصناف</option>
          ${d.items.map(s=>`<option value="${s.id}" ${f.item===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>من تاريخ</label><input type="date" value="${f.from}" onchange="App.ordersFilter.from=this.value;App.render()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${f.to}" onchange="App.ordersFilter.to=this.value;App.render()"></div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>التاريخ</th><th>المحل</th><th>الصنف</th><th>الكمية المطلوبة</th><th></th></tr></thead>
          <tbody>
          ${rows.length===0?`<tr><td colspan="5"><div class="empty">لا توجد طلبيات مسجلة بعد</div></td></tr>`:
          rows.map(r=>`
            <tr>
              <td>${esc(r.date)}</td>
              <td>${esc(this.storeName(r.storeId)||'—')}</td>
              <td>${esc(this.itemName(r.itemId)||'—')}</td>
              <td>${fmtNum(r.qty)} ${esc(this.itemUnit(r.itemId))}</td>
              <td>
                ${this.can('orders.edit')? `<button class="icon-btn" title="تعديل" onclick="App.openOrderForm('${r.id}')">✎</button>`:''}
                ${this.can('orders.delete')? `<button class="icon-btn" title="حذف" onclick="App.deleteOrder('${r.id}')">✕</button>`:''}
              </td>
            </tr>
          `).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  openOrderForm(id){
    const d = this.db;
    const editing = id? d.orders.find(o=>o.id===id):null;
    const u = this.currentUser();
    const lockedStore = !this.allStores() ? u.storeId : null;
    if(d.stores.length===0 || d.items.length===0){
      this.notify('من فضلك أضف محل واحد على الأقل وصنف واحد على الأقل أولاً.');
      return;
    }
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>${editing?'تعديل طلبية':'تسجيل طلبية جديدة'}</h3>
      <div class="form-row">
        <div class="field"><label>المحل</label>
          <select id="o_store" ${lockedStore?'disabled':''}>
            ${d.stores.map(s=>`<option value="${s.id}" ${(editing?editing.storeId:lockedStore)===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>الصنف</label>
          <select id="o_item">${d.items.map(s=>`<option value="${s.id}" ${editing&&editing.itemId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>الكمية المطلوبة</label><input type="number" min="0" step="any" id="o_qty" value="${editing?editing.qty:''}"></div>
        <div class="field"><label>تاريخ الطلب</label><input type="date" id="o_date" value="${editing?editing.date:todayStr()}"></div>
      </div>
      <div class="field"><label>المستودع المورّد (اختياري — لتحديث أرصدة المخزون تلقائيًا)</label>
        <select id="o_wh">
          <option value="">— بدون تحديد —</option>
          ${d.warehouses.map(w=>`<option value="${w.id}" ${editing&&editing.warehouseId===w.id?'selected':''}>${w.code?'['+esc(w.code)+'] ':''}${esc(w.name)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveOrder('${editing?editing.id:''}')">${editing?'حفظ التعديل':'حفظ الطلبية'}</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
  },
  saveOrder(id){
    const storeId = document.getElementById('o_store').value;
    const itemId = document.getElementById('o_item').value;
    const qty = parseFloat(document.getElementById('o_qty').value);
    const date = document.getElementById('o_date').value;
    const warehouseId = document.getElementById('o_wh').value || null;
    if(!storeId||!itemId||!qty||qty<=0||!date){ this.notify('أكمل جميع الحقول.'); return; }
    const itName = this.itemName(itemId);
    if(id){
      const o = this.db.orders.find(x=>x.id===id);
      // reverse this order's old stock effect before applying the edited values
      this.adjustStock(o.itemId,'store',o.storeId, -o.qty);
      if(o.warehouseId) this.adjustStock(o.itemId,'warehouse',o.warehouseId, o.qty);
      Object.assign(o, {storeId,itemId,qty,date,warehouseId});
      this.adjustStock(itemId,'store',storeId, qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, -qty);
      this.logActivity(`عدّل طلبية: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }else{
      this.db.orders.push({id:uid(),storeId,itemId,qty,date,warehouseId});
      // an order moves stock from the warehouse to the store
      this.adjustStock(itemId,'store',storeId, qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, -qty);
      this.logActivity(`سجّل طلبية جديدة: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }
    this.closeModal(); this.refresh();
  },
  deleteOrder(id){
    this.confirmAction('تأكيد حذف الطلبية؟', ()=>{
      const o = this.db.orders.find(x=>x.id===id);
      if(o){
        this.adjustStock(o.itemId,'store',o.storeId, -o.qty);
        if(o.warehouseId) this.adjustStock(o.itemId,'warehouse',o.warehouseId, o.qty);
        this.logActivity(`حذف طلبية: ${this.itemName(o.itemId)} (${fmtNum(o.qty)}) — ${this.storeName(o.storeId)||''}`);
      }
      this.db.orders = this.db.orders.filter(o=>o.id!==id);
      this.refresh();
    });
  },

  /* =====================================================================
     ITEMS / STORES / WAREHOUSES / USERS  (simple master data CRUD)
  ===================================================================== */
  itemsFilter:{q:'', unit:''},
  inventoryFilter:{locType:'store', locId:'', q:''},
  itemsSelected: new Set(),
  toggleItemSelect(id, checked){
    if(checked) this.itemsSelected.add(id); else this.itemsSelected.delete(id);
    this.render();
  },
  toggleItemSelectAll(checked, visibleIds){
    if(checked) visibleIds.forEach(id=>this.itemsSelected.add(id));
    else visibleIds.forEach(id=>this.itemsSelected.delete(id));
    this.render();
  },
  deleteSelectedItems(){
    const n = this.itemsSelected.size;
    if(n===0) return;
    this.confirmAction(`تأكيد حذف ${n} صنف؟ لن يتم حذف المرتجعات أو الطلبيات المسجلة بها.`, ()=>{
      this.db.items = this.db.items.filter(i=>!this.itemsSelected.has(i.id));
      this.db.stock = this.db.stock.filter(s=>!this.itemsSelected.has(s.itemId));
      this.itemsSelected.clear();
      this.refresh();
    });
  },
  renderItems(){
    const d=this.db;
    const f=this.itemsFilter;
    let rows = d.items.slice();
    if(f.q){
      const q=f.q.trim().toLowerCase();
      rows = rows.filter(it=>
        (it.name||'').toLowerCase().includes(q) ||
        (it.code||'').toLowerCase().includes(q) ||
        (it.barcode||'').toLowerCase().includes(q)
      );
    }
    if(f.unit) rows = rows.filter(it=>(it.unit||'')===f.unit);
    const units = [...new Set(d.items.map(it=>it.unit).filter(Boolean))].sort();
    const visibleIds = rows.map(it=>it.id);
    const allVisibleSelected = visibleIds.length>0 && visibleIds.every(id=>this.itemsSelected.has(id));
    const selCount = this.itemsSelected.size;

    return `
      <div class="section-head"><h3>الأصناف (${fmtNum(rows.length)}${rows.length!==d.items.length?' من '+fmtNum(d.items.length):''})</h3>
        <div class="actions">
          ${(selCount>0 && this.can('items.edit'))? `<button class="btn btn-danger btn-sm" onclick="App.deleteSelectedItems()">✕ حذف المحدد (${fmtNum(selCount)})</button>`:''}
          <button class="btn btn-sm" onclick="App.exportItemsExcel()">⬇ تصدير الأصناف Excel</button>
          ${this.can('items.import')? `<button class="btn btn-sm" onclick="App.openImportItems()">📥 استيراد من إكسيل</button>`:''}
          ${this.can('items.edit')? `<button class="btn btn-accent btn-sm" onclick="App.openItemForm()">+ إضافة صنف</button>`:''}
        </div></div>

      ${(()=>{ const bad = this.can('items.edit') ? this.badItems() : []; return bad.length? `
      <div class="help-box" style="margin-bottom:14px;border-color:var(--warn);display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span style="flex:1;min-width:240px;">⚠️ فيه <b>${fmtNum(bad.length)}</b> صنف اسمهم رقم بس (زي "1" و"#") — دول اتسجلوا غلط من استيراد إكسيل قديم وأعمدتهم متلخبطة. احذفهم واستورد الشيت تاني بالاستيراد الجديد.</span>
        <button class="btn btn-danger btn-sm" onclick="App.deleteBadItems()">🧹 حذف الأصناف المتسجلة غلط (${fmtNum(bad.length)})</button>
      </div>`:''; })()}
      <div class="filters card" style="margin-bottom:14px;">
        <div class="field" style="flex:2;min-width:220px;">
          <label>بحث بالاسم أو رمز الصنف أو الباركود</label>
          <input type="text" id="itemsSearchInput" placeholder="اكتب للبحث..." value="${esc(f.q)}" oninput="App.itemsFilter.q=this.value;App.render()">
        </div>
        <div class="field">
          <label>الوحدة</label>
          <select onchange="App.itemsFilter.unit=this.value;App.render()">
            <option value="">كل الوحدات</option>
            ${units.map(u=>`<option value="${esc(u)}" ${f.unit===u?'selected':''}>${esc(u)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.itemsFilter={q:'',unit:''};App.render()">إلغاء الفلترة</button></div>
      </div>

      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th style="width:34px;"><input type="checkbox" ${allVisibleSelected?'checked':''} data-ids='${JSON.stringify(visibleIds)}' onchange="App.toggleItemSelectAll(this.checked, JSON.parse(this.dataset.ids))"></th>
        <th>اسم الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>شد الصنف</th><th>الوحدة</th>${this.can('finance.view')?'<th>تكلفة الوحدة</th>':''}<th></th>
      </tr></thead><tbody>
      ${rows.length===0?`<tr><td colspan="8"><div class="empty">${d.items.length===0?'لا توجد أصناف بعد':'لا توجد نتائج مطابقة للبحث/الفلترة'}</div></td></tr>`:
      rows.map(it=>`<tr>
        <td><input type="checkbox" ${this.itemsSelected.has(it.id)?'checked':''} onchange="App.toggleItemSelect('${it.id}', this.checked)"></td>
        <td>${esc(it.name)}</td>
        <td>${esc(it.code||'—')}</td>
        <td>${esc(it.barcode||'—')}</td>
        <td>${esc(it.packSize||'—')}</td>
        <td>${esc(it.unit||'—')}</td>
        ${this.can('finance.view')?`<td>${it.cost?fmtNum(it.cost):'—'}</td>`:''}
        <td>
          ${this.can('items.edit')?`<button class="icon-btn" onclick="App.openItemForm('${it.id}')">✎</button>
          <button class="icon-btn" onclick="App.deleteItem('${it.id}')">✕</button>`:''}
        </td>
      </tr>`).join('')}
      </tbody></table></div>
    `;
  },
  openItemForm(id){
    const editing = id? this.db.items.find(i=>i.id===id):null;
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>${editing?'تعديل صنف':'إضافة صنف جديد'}</h3>
      <div class="field"><label>اسم الصنف</label><input type="text" id="it_name" placeholder="مثال: بسكويت شوكولاتة 200 جم" value="${editing?esc(editing.name):''}"></div>
      <div class="form-row">
        <div class="field"><label>رمز الصنف</label><input type="text" id="it_code" placeholder="مثال: IT-1042" value="${editing?esc(editing.code||''):''}"></div>
        <div class="field"><label>الباركود</label><input type="text" id="it_barcode" placeholder="مثال: 6221234567890" value="${editing?esc(editing.barcode||''):''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>شد الصنف (عدد القطع بالكرتونة/الشِد)</label><input type="text" id="it_pack" placeholder="مثال: 24 قطعة" value="${editing?esc(editing.packSize||''):''}"></div>
        <div class="field"><label>وحدة القياس</label><input type="text" id="it_unit" placeholder="مثال: كرتونة" value="${editing?esc(editing.unit||''):''}"></div>
      </div>
      ${this.can('finance.edit')? `<div class="field"><label>تكلفة الوحدة (اختياري — تُستخدم في تقارير التكاليف والخسائر)</label><input type="number" min="0" step="any" id="it_cost" value="${editing&&editing.cost?editing.cost:''}"></div>`
        : (this.can('finance.view') ? `<div class="field"><label>تكلفة الوحدة</label><input type="text" value="${editing&&editing.cost?fmtNum(editing.cost):'—'}" disabled></div>` : '')}
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveItem('${editing?editing.id:''}')">حفظ</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>`);
  },
  saveItem(id){
    const name=document.getElementById('it_name').value.trim();
    const code=document.getElementById('it_code').value.trim();
    const barcode=document.getElementById('it_barcode').value.trim();
    const packSize=document.getElementById('it_pack').value.trim();
    const unit=document.getElementById('it_unit').value.trim();
    const costEl = document.getElementById('it_cost');
    if(!name){this.notify('اكتب اسم الصنف.');return;}
    if(id){
      const it = this.db.items.find(i=>i.id===id);
      Object.assign(it,{name,code,barcode,packSize,unit});
      if(costEl) it.cost = parseFloat(costEl.value)||0;
      this.logActivity(`عدّل صنف: ${name}`);
    } else {
      this.db.items.push({id:uid(),name,code,barcode,packSize,unit,cost: costEl?(parseFloat(costEl.value)||0):0});
      this.logActivity(`أضاف صنف جديد: ${name}`);
    }
    this.closeModal(); this.refresh();
  },
  deleteItem(id){
    this.confirmAction('حذف هذا الصنف؟ لن يتم حذف المرتجعات المسجلة به.', ()=>{
      const it = this.db.items.find(i=>i.id===id);
      this.db.items=this.db.items.filter(i=>i.id!==id);
      this.db.stock=this.db.stock.filter(s=>s.itemId!==id);
      this.logActivity(`حذف صنف: ${it?it.name:id}`);
      this.refresh();
    });
  },

  /* ---------------- INVENTORY (current stock quantity per item per location) ---------------- */
  renderInventory(){
    const d = this.db;
    const u = this.currentUser();
    const admin = this.allStores();
    const f = this.inventoryFilter;

    let locType = f.locType;
    if(!admin && locType==='warehouse' && !u.warehouseId) locType = 'store';
    // a warehouse-only user opens straight on their own warehouse
    if(!admin && locType==='store' && !u.storeId && u.warehouseId) locType = 'warehouse';

    const availableStores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const availableWarehouses = admin ? d.warehouses : (u.warehouseId ? d.warehouses.filter(w=>w.id===u.warehouseId) : []);
    const locOptions = locType==='store' ? availableStores : availableWarehouses;

    let locId = f.locId;
    if(!locId || !locOptions.find(o=>o.id===locId)) locId = locOptions[0] ? locOptions[0].id : '';
    f.locType = locType; f.locId = locId;

    let items = d.items.slice();
    if(f.q){
      const q = f.q.trim().toLowerCase();
      items = items.filter(it=>(it.name||'').toLowerCase().includes(q) || (it.code||'').toLowerCase().includes(q) || (it.barcode||'').toLowerCase().includes(q));
    }

    return `
      <div class="section-head"><h3>المخزون</h3>
        ${this.can('inventory.import') && locId ? `<div class="actions">
          <button class="btn btn-accent btn-sm" onclick="App.openStockImport()">📥 رفع الأرصدة من إكسيل</button>
          <button class="btn btn-sm" onclick="App.downloadStockTemplate()">⬇ نموذج إكسيل فاضي</button>
        </div>` : ''}
      </div>
      <div class="filters card" style="margin-bottom:14px;">
        <div class="field">
          <label>نوع الموقع</label>
          <select onchange="App.inventoryFilter.locType=this.value;App.inventoryFilter.locId='';App.render()">
            <option value="store" ${locType==='store'?'selected':''}>محل</option>
            ${(admin || u.warehouseId) ? `<option value="warehouse" ${locType==='warehouse'?'selected':''}>مستودع</option>` : ''}
          </select>
        </div>
        <div class="field">
          <label>${locType==='store'?'المحل':'المستودع'}</label>

  },
  openStockAdjustForm(itemId, locType, locId){

  /* ---------------- STOCK IMPORT FROM EXCEL ----------------
     Reads a sheet with (item code or barcode or name) + quantity, matches each
     row to a registered item, previews the result, then either REPLACES the
     location's balance (a stock count) or ADDS to it (goods received). */
  _stockImport: null,
  downloadStockTemplate(){
    const f = this.inventoryFilter;
    const rows = [['كود الصنف','الباركود','اسم الصنف','الكمية']];
    this.db.items.forEach(it=>rows.push([it.code||'', it.barcode||'', it.name||'', '']));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:16},{wch:18},{wch:40},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المخزون');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const locName = f.locType==='store' ? this.storeName(f.locId) : this.whName(f.locId);
    this.saveFile(`نموذج_رفع_المخزون_${locName||''}.xlsx`, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  },
  openStockImport(){

    const f = this.inventoryFilter;
    const locName = f.locType==='store' ? this.storeName(f.locId) : this.whName(f.locId);
    this._stockImport = {locType:f.locType, locId:f.locId, mode:'replace', book:null, sheetIdx:0, qtyCol:null, useLocCol:true};
    this.openModal(`
