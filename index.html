<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة مرتجعات المحلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --bg:#151D2B;
  --surface:#1B2536;
  --surface-2:#212C40;
  --ink:#E7ECF5;
  --ink-soft:#B7C2D6;
  --muted:#7B8AA3;
  --line:#2C3750;
  --accent:#22D3EE;
  --accent-ink:#04262B;
  --accent-soft:#0F2A31;
  --good:#34D399;
  --good-soft:#12301F;
  --bad:#F47272;
  --bad-soft:#331A19;
  --warn:#FBBF24;
  --warn-soft:#332A0F;
  --radius:6px;
  --sidebar-w:230px;
  --sidebar-bg:#0F1826;
  --sidebar-ink:#E7ECF5;
  --sidebar-ink-soft:#8896AC;
  --sidebar-muted:#5B6B85;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --bg:#151D2B;
    --surface:#1B2536;
    --surface-2:#212C40;
    --ink:#E7ECF5;
    --ink-soft:#B7C2D6;
    --muted:#7B8AA3;
    --line:#2C3750;
    --accent:#22D3EE;
    --accent-ink:#04262B;
    --accent-soft:#0F2A31;
    --good:#34D399;
    --good-soft:#12301F;
    --bad:#F47272;
    --bad-soft:#331A19;
    --warn:#FBBF24;
    --warn-soft:#332A0F;
    --sidebar-bg:#0F1826;
    --sidebar-ink:#E7ECF5;
    --sidebar-ink-soft:#8896AC;
    --sidebar-muted:#5B6B85;
  }
}
:root[data-theme="dark"]{
  --bg:#151D2B;
  --surface:#1B2536;
  --surface-2:#212C40;
  --ink:#E7ECF5;
  --ink-soft:#B7C2D6;
  --muted:#7B8AA3;
  --line:#2C3750;
  --accent:#22D3EE;
  --accent-ink:#04262B;
  --accent-soft:#0F2A31;
  --good:#34D399;
  --good-soft:#12301F;
  --bad:#F47272;
  --bad-soft:#331A19;
  --warn:#FBBF24;
  --warn-soft:#332A0F;
  --sidebar-bg:#0F1826;
  --sidebar-ink:#E7ECF5;
  --sidebar-ink-soft:#8896AC;
  --sidebar-muted:#5B6B85;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3{font-weight:700;margin:0;font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;}
.brand strong, .stat .n, .brand-name{font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;font-weight:900;}
button{font-family:inherit;}
table{font-variant-numeric:tabular-nums;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ---------- Login ---------- */
#screen-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:32px 28px;
}
.login-brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}
.login-brand .mark{
  width:36px;height:36px;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;flex-shrink:0;
}
.login-brand h1{font-size:17px;}
.login-brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--surface-2);
  color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;
  border-radius:var(--radius);
  padding:9px 16px;
  font-size:14px;font-weight:700;
  cursor:pointer;
  background:var(--surface-2);
  color:var(--ink);
  border-color:var(--line);
}
.btn:hover{filter:brightness(0.97);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-accent:hover{filter:brightness(1.06);}
.btn-danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft);}
.btn-block{width:100%;}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.login-hint{
  margin-top:16px;font-size:12px;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;
}
.login-error{color:var(--bad);font-size:13px;margin-bottom:10px;display:none;}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-ink);
  display:flex;flex-direction:column;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 22px;}
.brand .mark{
  width:38px;height:38px;border-radius:10px;background:var(--accent);
  color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  font-weight:900;flex-shrink:0;overflow:hidden;
}
.brand strong{font-size:16px;display:block;letter-spacing:.2px;}
.brand small{font-size:11.5px;opacity:.75;display:block;margin-top:2px;}
.navlist{list-style:none;margin:0;padding:0;flex:1;}
.navlist li{margin-bottom:4px;}
.navlink{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:right;
  background:transparent;border:none;color:var(--sidebar-ink-soft);
  padding:13px 14px;border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer;
  transition:background .15s ease;
}
.navlink .ic{width:20px;text-align:center;opacity:.9;font-size:16.5px;}
.navlink:hover{background:rgba(255,255,255,.08);}
.navlink.active{background:var(--accent);color:var(--accent-ink);font-weight:800;}
.nav-ripple{
  position:absolute;border-radius:50%;transform:scale(0);
  background:rgba(255,255,255,.45);pointer-events:none;
  animation:navRippleAnim .55s ease-out;
}
@keyframes navRippleAnim{to{transform:scale(2.6);opacity:0;}}
.side-foot{border-top:1px solid rgba(255,255,255,.14);padding-top:16px;margin-top:10px;}
.who-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:4px 8px 16px;}
.who-avatar{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.14);color:var(--sidebar-ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.who{font-size:12.5px;color:var(--sidebar-muted);min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;}
.who b{color:var(--sidebar-ink);display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.who-badge{
  display:inline-block;font-size:11px;font-weight:700;
  padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.12);
  color:var(--sidebar-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.who-actions{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 8px;}
.side-icon-btn{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--sidebar-ink-soft);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.side-icon-btn:hover{background:rgba(255,255,255,.16);color:var(--sidebar-ink);}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 22px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.topbar h2{font-size:19px;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.content{padding:20px 22px 60px;}

.menu-toggle{display:none;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;font-size:16px;color:var(--ink);}

/* ---------- shared components ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
}
.card + .card{margin-top:14px;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.stat .n{font-size:26px;font-weight:900;line-height:1.2;}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px;}
.stat.accent{border-color:var(--accent-soft);background:var(--accent-soft);}
.stat.accent .n{color:var(--accent);}
.stat.warn{border-color:var(--warn-soft);background:var(--warn-soft);}
.stat.warn .n{color:var(--warn);}
.stat.bad{border-color:var(--bad-soft);background:var(--bad-soft);}
.stat.bad .n{color:var(--bad);}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h3{font-size:16px;}
.section-head .actions{display:flex;gap:8px;flex-wrap:wrap;}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table.tbl th, table.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tbl thead th{background:var(--surface-2);font-weight:700;color:var(--ink-soft);font-size:12.5px;position:sticky;top:0;}
table.tbl tbody tr:hover{background:var(--surface-2);}
table.tbl tbody tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.tag.good{background:var(--good-soft);color:var(--good);border-color:var(--good-soft);}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft);}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft);}

.empty{padding:40px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:28px;margin-bottom:8px;}

.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(15,15,15,.45);
  align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow-y:auto;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--surface);border-radius:10px;max-width:560px;width:100%;
  padding:22px 22px 20px;border:1px solid var(--line);
}
.modal h3{font-size:16.5px;margin-bottom:16px;}
.modal-close{float:left;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}
.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:16px;}

.badge-role{font-size:11px;padding:2px 8px;border-radius:100px;background:var(--accent-soft);color:var(--accent);font-weight:700;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
.filters .field{margin-bottom:0;min-width:150px;flex:1;}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pill-tab{padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13px;cursor:pointer;font-weight:700;}
.pill-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0;}
.help-box{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--muted);}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;border-radius:5px;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
::placeholder{color:#93A0B4;}

/* notification bell (admin-only activity feed) */
.notif-bell-btn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:17px;cursor:pointer;color:var(--ink);}
.notif-bell-btn:hover{background:var(--surface-2);}
.notif-badge{position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;font-size:10px;line-height:1;border-radius:20px;padding:3px 5px;min-width:14px;text-align:center;font-weight:700;}
.notif-panel{position:absolute;top:46px;left:0;width:340px;max-width:85vw;max-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:20;padding:8px;}
.notif-item{padding:9px 10px;border-radius:7px;font-size:12.5px;line-height:1.6;border-bottom:1px solid var(--line);}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:var(--surface-2);}
.notif-item .t{color:var(--muted);font-size:11px;margin-top:2px;}

/* ---------- dashboard: simple sequential bar chart ---------- */
.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:10px;}
.bar-row .bar-label{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{background:var(--surface-2);border-radius:4px;height:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);}
.bar-row .bar-value{font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;}

/* ---------- dashboard: recent activity feed ---------- */
.activity-feed{display:flex;flex-direction:column;}
.activity-row{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px;}
.activity-row:last-child{border-bottom:none;}
.activity-row .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;}
.activity-row .body{flex:1;min-width:0;}
.activity-row .label{color:var(--ink-soft);line-height:1.5;}
.activity-row .meta{color:var(--muted);font-size:11px;margin-top:2px;}

/* ---------- theme picker (الإعدادات) ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.theme-swatch{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:right;font-family:inherit;}
.theme-swatch.active{border-color:var(--accent);}
.theme-swatch .dots{display:flex;gap:6px;margin-bottom:10px;}
.theme-swatch .dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;}

@media(max-width:860px){
  .sidebar{position:fixed;right:0;top:0;bottom:0;z-index:40;transform:translateX(100%);transition:transform .2s ease;box-shadow:0 0 0 1000px rgba(0,0,0,0);}
  .sidebar.open{transform:translateX(0);box-shadow:-10px 0 30px rgba(0,0,0,.25);}
  .menu-toggle{display:inline-flex;}
  .content{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
}

/* ---------- print (used by "طباعة التقرير / حفظ PDF") ---------- */
@media print{
  html, body{background:#fff !important;}
  body *{visibility:hidden;}
  #customReportPrintArea, #customReportPrintArea *{visibility:visible;}
  #customReportPrintArea{position:absolute;top:0;right:0;left:0;width:100%;margin:0;}
  #customReportPrintArea .card{border:1px solid #ddd;box-shadow:none;break-inside:avoid;}
  #customReportPrintArea table.tbl thead{display:table-header-group;}
  #customReportPrintArea table.tbl tr{page-break-inside:avoid;}
  #customReportPrintArea .stat{border:1px solid #ddd;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">مر</div>
      <div>
        <h1>نظام مرتجعات المحلات</h1>
        <span>تسجيل الدخول للمتابعة</span>
      </div>
    </div>
    <div class="login-error" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn btn-accent btn-block" onclick="App.login()">دخول</button>
    <div style="text-align:center;margin-top:10px;">
      <button class="icon-btn small" style="text-decoration:underline;" onclick="App.openForgotPasswordForm()">نسيت كلمة المرور؟</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandWrap"></div>
    <ul class="navlist" id="navlist"></ul>
    <div class="side-foot">
      <div class="who-card">
        <div class="who-avatar" id="whoAvatar"></div>
        <div class="who"><b id="whoName"></b><span class="who-badge" id="whoRole"></span></div>
      </div>
      <div class="who-actions">
        <button class="side-icon-btn" onclick="App.openMyAccountForm()" title="تغيير اسم المستخدم / كلمة المرور" aria-label="تغيير اسم المستخدم / كلمة المرور">⚙</button>
        <button class="side-icon-btn" onclick="App.logout()" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="menu-toggle" onclick="App.toggleSidebar()">☰</button>
        <div>
          <h2 id="pageTitle">لوحة التحكم</h2>
          <div class="sub" id="pageSub"></div>
        </div>
      </div>
      <div id="notifBellWrap" style="position:relative;"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =====================================================================

/* migrateData: apply defaults/upgrades to a raw db object, whether it came
   from localStorage (loadData) or from a Firestore snapshot. Keeping this in
   one place means both sources stay consistent as new fields get added. */
/* shared by both a user's custom permissions and a job title's template —
   fills in any permission category missing from an older, already-saved
   permissions object, so opening its checkboxes never crashes and nothing
   that was already granted quietly changes. */
function migratePerms(p){
  if(!p) return p;
  if(p.items && p.items.edit===undefined){ p.items = { view:true, edit: !!p.items.manage }; }
  if(!p.items) p.items = { view:true, edit:true };
  if(!p.inventory) p.inventory = { view:true, edit:false };
  if(!p.stores) p.stores = { view:false, edit:false };
  if(!p.warehouses) p.warehouses = { view:false, edit:false };
  if(!p.links) p.links = { view:false, edit:false };
  if(!p.finance) p.finance = { view:false, edit:false };
  return p;
}

function migrateData(d){
  if(!d.settings) d.settings = { companyName:'', logo:'' };
  // migrate: settings gain a theme choice, customizable reason/resolution
  // lists, expiry-alert threshold and password policy — all optional, all
  // fall back to their DEFAULT_* constant when unset
  if(!d.settings.themeId) d.settings.themeId = 'cyan';
  if(d.settings.reasons===undefined) d.settings.reasons = null;
  if(d.settings.resolutions===undefined) d.settings.resolutions = null;
  if(!d.settings.expiryAlertDays) d.settings.expiryAlertDays = DEFAULT_EXPIRY_ALERT_DAYS;
  if(!d.settings.passwordPolicy) d.settings.passwordPolicy = {...DEFAULT_PASSWORD_POLICY};
  // migrate: EmailJS config for the email-verification-code feature (login
  // 2FA + owner-only danger-zone confirmation) — empty until the owner fills
  // it in from الإعدادات; the feature quietly does nothing until then
  if(!d.settings.emailjs) d.settings.emailjs = {serviceId:'', templateId:'', publicKey:''};
  if(!d.jobTitles) d.jobTitles = [];
  if(!d.activityLog) d.activityLog = [];
  if(!d.stock) d.stock = [];
  // migrate: job titles gain a "type" (store/warehouse/both) — old ones
  // apply to both, so nothing they already granted disappears
  (d.jobTitles||[]).forEach(j=>{ if(!j.type) j.type = 'both'; if(!j.perms) j.perms = defaultPermissions(); migratePerms(j.perms); });
  // migrate: old orders had no warehouse link (needed for stock effects)
  (d.orders||[]).forEach(o=>{ if(o.warehouseId===undefined) o.warehouseId = null; });
  // migrate: stores gain an optional default/linked warehouse
  (d.stores||[]).forEach(s=>{ if(s.defaultWarehouseId===undefined) s.defaultWarehouseId = null; });
  // migrate: items gain an optional unit cost (for financial/loss reports)
  (d.items||[]).forEach(it=>{ if(it.cost===undefined || it.cost===null || it.cost==='') it.cost = it.cost || 0; });
  // migrate: returns gain a "resolution" (what actually happened to the goods),
  // defaulting to "معلّق" so nothing already recorded looks decided when it wasn't
  (d.returns||[]).forEach(r=>{ if(!r.resolution) r.resolution = 'معلّق'; });
  // migrate: give any pre-existing store user full permissions by default
  // so nothing they could already do disappears after this update
  (d.users||[]).forEach(u=>{
    if(u.role==='store' && !u.permissions){ u.permissions = defaultPermissions(); }
    if(u.jobTitle==null) u.jobTitle = '';
    if(u.jobId===undefined) u.jobId = null;
    if(u.warehouseId===undefined) u.warehouseId = null;
    if(u.email==null) u.email = '';
    if(u.phone==null) u.phone = '';
    // migrate: items.manage (single flag) -> items.view/items.edit,
    // and add the newer permission categories (inventory, stores, warehouses,
    // links, finance) — all default to false (view/edit) except inventory.view,
    // so nobody silently gains new admin-ish powers just from this update
    if(u.permissions) migratePerms(u.permissions);
  });
  return d;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) { const d = defaultData(); saveData(d); return d; }
    const d = JSON.parse(raw);
    return migrateData(d);
  }catch(e){ const d = defaultData(); saveData(d); return d; }
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){ console.error('storage failed', e); }
  // also push to the shared Firestore backend so every device stays in sync,
  // once the first sync/seed has completed (see firebase setup below)
  if(window.__fsReady && window.__mainDocRef){
    window.__mainDocRef.set(d).catch(e=>console.error('firestore save failed', e));
  }
}

const App = {
  db: loadData(),
  session: null,
  view: 'dashboard',

  /* apply the chosen theme's colors as inline CSS variables on <html> —
     beats every stylesheet rule, so it's consistent regardless of the
     visitor's OS light/dark setting. Called on load, whenever a Firestore
     sync brings in a theme chosen on another device, and live when the
     owner picks one in الإعدادات. */
  applyTheme(themeId){
    const id = themeId || (this.db.settings && this.db.settings.themeId) || 'cyan';
    const theme = THEMES.find(t=>t.id===id) || THEMES[0];
    const root = document.documentElement.style;
    THEME_VAR_KEYS.forEach(k=>{ if(theme.vars[k]) root.setProperty('--'+k, theme.vars[k]); });
  },

  init(){
    this.applyTheme();
    if(window.emailjs && this.isEmailJSConfigured()){
      try{ emailjs.init({publicKey: this.db.settings.emailjs.publicKey}); }catch(e){}
    }
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw){
      try{
        const s = JSON.parse(raw);
        const su = this.db.users.find(u=>u.id===s.userId);
        if(su){
          // a session from before email verification was required — force a
          // fresh login so the email-entry + code flow below runs for them
          if(!su.email){
            localStorage.removeItem(SESSION_KEY);
            this._forceEmailMsg = true;
          } else {
            this.session = s;
          }
        }
      }catch(e){}
    }
    if(this.session){ this.showApp(); } else { this.showLogin(); }
    if(this._forceEmailMsg){
      const err = document.getElementById('loginError');
      if(err){ err.textContent = 'سجّل الدخول من جديد وأدخل بريدك الإلكتروني (بقى إلزاميًا لتفعيل رمز التحقق).'; err.style.display='block'; }
    }

    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') App.login(); });
    document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') App.login(); });

    // close the notifications panel when clicking anywhere outside it
    document.addEventListener('click', e=>{
      const wrap = document.getElementById('notifBellWrap');
      const panel = document.getElementById('notifPanel');
      if(panel && panel.style.display==='block' && wrap && !wrap.contains(e.target)){
        panel.style.display = 'none';
        App._notifPanelOpen = false;
      }
    });
  },

  showLogin(){
    document.getElementById('screen-login').style.display='flex';
    document.getElementById('app').style.display='none';
  },
  showApp(){
    document.getElementById('screen-login').style.display='none';
    document.getElementById('app').style.display='block';
    this.renderBrand();
    this.buildNav();
    this.go('dashboard');
  },

  /* ---------------- EMAIL VERIFICATION (EmailJS) ----------------
     Powers two things: (1) a login verification code sent to every user's
     registered email, with the device remembered for 5 days so it isn't
     asked every time; (2) the danger-zone reset confirmation code, sent to
     the owner's own email instead of shown on screen. Configured entirely
     from الإعدادات (owner-only) — nothing is sent until those 3 fields are
     filled in, so the app keeps working normally in the meantime. */
  isEmailJSConfigured(){
    const e = this.db.settings && this.db.settings.emailjs;
    return !!(e && e.serviceId && e.templateId && e.publicKey);
  },
  sendVerificationEmail(toEmail, code, toName){
    const e = this.db.settings.emailjs;
    if(!window.emailjs || !this.isEmailJSConfigured()) return Promise.reject(new Error('emailjs not configured'));
    try{ emailjs.init({publicKey: e.publicKey}); }catch(err){}
    return emailjs.send(e.serviceId, e.templateId, {
      to_email: toEmail,
      code: code,
      app_name: (this.db.settings && this.db.settings.companyName) || 'نظام مرتجعات المحلات',
      to_name: toName || 'مستخدم النظام',
    });
  },
  TRUSTED_DEVICE_DAYS: 5,
  isDeviceTrusted(userId){
    try{
      const raw = localStorage.getItem('rm_trusted_'+userId);
      if(!raw) return false;
      const ts = parseInt(raw,10);
      if(!ts) return false;
      return (Date.now()-ts) < this.TRUSTED_DEVICE_DAYS*24*60*60*1000;
    }catch(e){ return false; }
  },
  markDeviceTrusted(userId){
    try{ localStorage.setItem('rm_trusted_'+userId, String(Date.now())); }catch(e){}
  },
  LOGIN_CODE_VALID_MINUTES: 10,
  _loginCode: null, // {userId, code, ts}
  _pendingEmailUserId: null,

  /* step 1 of login() when the user has no email registered yet: block
     them here — they can't proceed until they add one, since it's now
     required for the verification code. */
  openRequireEmailForm(userId){
    const user = this.db.users.find(u=>u.id===userId);
    this.openModal(`
      <button class="modal-close" onclick="App.cancelLoginFlow()">✕</button>
      <h3>مطلوب بريد إلكتروني</h3>
      <p>حسابك (<b>${esc(user?user.username:'')}</b>) لسه من غير بريد إلكتروني مسجّل، وبقى إلزاميًا عشان نبعتلك عليه رمز تحقق عند تسجيل الدخول. أدخله وهيتبعتلك الرمز فورًا.</p>
      <div class="field"><label>بريدك الإلكتروني</label><input type="email" id="reqEmailInput" placeholder="example@email.com"></div>
      <div id="reqEmailResult" class="small" style="color:var(--bad);"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveRequiredEmail('${userId}')">حفظ وإرسال الرمز</button>
        <button class="btn" onclick="App.cancelLoginFlow()">إلغاء</button>
      </div>`);
  },
  saveRequiredEmail(userId){
    const val = (document.getElementById('reqEmailInput').value||'').trim();
    const resultBox = document.getElementById('reqEmailResult');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ resultBox.textContent = 'اكتب بريدًا إلكترونيًا صحيحًا.'; return; }
    const user = this.db.users.find(u=>u.id===userId);
    if(!user){ this.cancelLoginFlow(); return; }
    user.email = val;
    saveData(this.db);
    this.startLoginVerification(userId);
  },
  cancelLoginFlow(){
    this._loginCode = null;
    this._pendingEmailUserId = null;
    this.closeModal();
  },
  /* step 2: send (or resend) the code and show the entry form */
  startLoginVerification(userId){
    const user = this.db.users.find(u=>u.id===userId);
    if(!user) return;
    if(!this.isEmailJSConfigured()){
      // not set up yet (owner hasn't filled emailjs settings) — don't lock
      // anyone out of the whole app over an optional feature not yet configured
      this.completeLogin(userId);
      return;
    }
    const code = String(Math.floor(100000 + Math.random()*900000));
    this._loginCode = { userId, code, ts: Date.now() };
    const masked = user.email.replace(/^(.{2}).*(@.*)$/, (m,a,b)=>a+'***'+b);
    this.openModal(`
      <button class="modal-close" onclick="App.cancelLoginFlow()">✕</button>
      <h3>رمز التحقق</h3>
      <p>بعتنا رمز تحقق من 6 أرقام على بريدك (${esc(masked)}). اكتبه هنا للدخول.</p>
      <div class="field"><label>الرمز</label><input type="text" id="loginCodeInput" inputmode="numeric" placeholder="——————" autocomplete="one-time-code"></div>
      <div id="loginCodeResult" class="small" style="color:var(--bad);"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.verifyLoginCode()">تأكيد الدخول</button>
        <button class="btn btn-sm" onclick="App.startLoginVerification('${userId}')">إعادة إرسال الرمز</button>
        <button class="btn" onclick="App.cancelLoginFlow()">إلغاء</button>
      </div>`);
    this.sendVerificationEmail(user.email, code, user.name).catch(err=>{
      console.error('email send failed', err);
      const resultBox = document.getElementById('loginCodeResult');
      if(resultBox) resultBox.textContent = 'تعذّر إرسال البريد. تأكد من إعدادات EmailJS في صفحة الإعدادات، أو جرّب "إعادة إرسال الرمز".';
    });
  },
  verifyLoginCode(){
    const resultBox = document.getElementById('loginCodeResult');
    const val = (document.getElementById('loginCodeInput').value||'').trim();
    if(!this._loginCode){ resultBox.textContent = 'انتهت صلاحية هذه المحاولة، سجّل الدخول من جديد.'; return; }
    const ageMinutes = (Date.now()-this._loginCode.ts)/60000;
    if(ageMinutes > this.LOGIN_CODE_VALID_MINUTES){ resultBox.textContent = 'انتهت صلاحية الرمز، دوس "إعادة إرسال الرمز".'; return; }
    if(val !== this._loginCode.code){ resultBox.textContent = 'الرمز غير صحيح.'; return; }
    const userId = this._loginCode.userId;
    this.markDeviceTrusted(userId);
    this._loginCode = null;
    this.completeLogin(userId);
  },
  completeLogin(userId){
    const user = this.db.users.find(u=>u.id===userId);
    if(!user) return;
    this.closeModal();
    this.session = { userId };
    localStorage.setItem(SESSION_KEY, JSON.stringify(this.session));
    this.logActivity(`سجّل دخول (${user.name||user.username})`);
    saveData(this.db);
    this.showApp();
  },

  /* sidebar logo/company-name area — shows the company logo & name the admin
     set (Reports > إعدادات التقرير), and falls back to the app's own name
     when nothing is set yet. Editable from Settings, so it updates here too
     the moment it's saved (no separate "sidebar branding" setting to manage). */
  renderBrand(){
    const wrap = document.getElementById('brandWrap');
    if(!wrap) return;
    const settings = (this.db && this.db.settings) || {companyName:'', logo:''};
    const hasCompany = !!(settings.companyName || settings.logo);
    wrap.innerHTML = hasCompany ? `
      <div class="mark">${settings.logo? `<img src="${settings.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:8px;">` : esc((settings.companyName||'؟').trim().slice(0,2))}</div>
      <div><strong class="brand-name">${esc(settings.companyName||'مرتجعات المحلات')}</strong><small>نظام إدارة مرتجعات المحلات</small></div>
    ` : `
      <div class="mark">مر</div>
      <div><strong class="brand-name">مرتجعات المحلات</strong><small>نظام إدارة داخلي</small></div>
    `;
  },

  login(){
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const user = this.db.users.find(x=>x.username===u && x.password===p);

  logout(){

    document.getElementById('loginPass').value='';
    this.showLogin();
  },
  currentUser(){ return this.db.users.find(u=>u.id===this.session.userId); },
  isAdmin(){ return this.currentUser().role==='admin'; },

  /* check one permission for the logged-in user, e.g. App.can('returns.add').
     admin always has everything; a store user without a permissions object
     (shouldn't happen after migration, but just in case) also gets full access. */
  can(permPath){
    const u = this.currentUser();
    if(!u || u.role==='admin') return true;
    const perms = u.permissions || defaultPermissions();
    let node = perms;
    for(const p of permPath.split('.')){ node = node ? node[p] : undefined; }
    return !!node;
  },

  toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); },

  NAV: [
    {id:'dashboard', label:'لوحة التحكم', ic:'⌂'},
    {id:'returns', label:'المرتجعات', ic:'↩'},
    {id:'orders', label:'الطلبيات', ic:'▤', perm:'orders.view'},
    {id:'reports', label:'التقارير', ic:'▦', perm:'reports.view'},
    {id:'items', label:'الأصناف', ic:'◆', perm:'items.view'},
    {id:'inventory', label:'المخزون', ic:'▥', perm:'inventory.view'},
    {id:'stores', label:'المحلات', ic:'⌘', perms:['stores.view','links.view']},
    {id:'warehouses', label:'المستودعات', ic:'⛁', perm:'warehouses.view'},
    {id:'users', label:'المستخدمون', ic:'☺', adminOnly:true},
    {id:'settings', label:'الإعدادات', ic:'⚙', ownerOnly:true},
  ],

  /* the OWNER account — the one and only user allowed to change the
     company name/logo. Deliberately separate from the admin role: even
     another "مدير عام" account can't see or reach this page, only the
     specific username below can. Change it here if the owner's username
     ever changes. */
  OWNER_USERNAME: 'admin',
  isOwner(){ const u = this.currentUser(); return !!u && u.username === this.OWNER_USERNAME; },

  /* customizable lists (owner-editable from الإعدادات); fall back to the
     built-in defaults until the owner customizes them */
  reasons(){ const r = this.db.settings && this.db.settings.reasons; return (r && r.length) ? r : DEFAULT_REASONS; },
  resolutions(){ const r = this.db.settings && this.db.settings.resolutions; return (r && r.length) ? r : DEFAULT_RESOLUTIONS; },
  expiryAlertDays(){ return (this.db.settings && this.db.settings.expiryAlertDays) || DEFAULT_EXPIRY_ALERT_DAYS; },

  /* whether the current user may see this NAV entry at all: adminOnly beats
     everything, a single `perm` is a simple gate, and `perms` is an "any of
     these" gate for an entry whose page has more than one sub-section
     governed by different permissions (e.g. المحلات = عرض المحلات أو ربطها). */
  navVisible(n){
    if(n.ownerOnly) return this.isOwner();
    if(n.adminOnly) return this.isAdmin();
    if(n.perm) return this.can(n.perm);
    if(n.perms) return n.perms.some(p=>this.can(p));
    return true;
  },

  buildNav(){

      ? 'مدير عام'

    const avatarEl = document.getElementById('whoAvatar');
    if(avatarEl) avatarEl.textContent = (displayName||'?').trim().charAt(0);

  /* ---------------- ACTIVITY LOG & ADMIN NOTIFICATIONS ----------------
     Every meaningful action (login + any add/edit/delete/export) is logged
     to db.activityLog, which syncs like the rest of the data. Only admins
     see a notification feed of it (a bell in the top bar), so a store
     employee's screen looks exactly as before. */
  logActivity(label){
    const u = this.currentUser ? this.currentUser() : null;
    if(!this.db.activityLog) this.db.activityLog = [];
    this.db.activityLog.push({
      id: uid(),
      ts: Date.now(),
      userId: u ? u.id : null,
      username: u ? (u.name || u.username) : '—',
      label
    });
    // keep the log from growing forever — the last 500 actions is plenty
    if(this.db.activityLog.length > 500) this.db.activityLog = this.db.activityLog.slice(-500);
  },

  /* the bell + its dropdown panel are built ONCE and then only patched —
     never innerHTML'd from scratch again — because this gets re-invoked on
     every single real-time sync tick from Firestore. Tearing the whole
     panel down and rebuilding it each time (the old approach) kept
     replacing the <select>/<input> elements out from under the person
     while they were mid-click, which is why the sound-type dropdown
     wouldn't open, the "تجربة" button seemed dead, and the list wouldn't
     scroll — the DOM they were touching kept getting swapped for a new
     copy a few hundred milliseconds later. */
  renderNotifBell(){
    const wrap = document.getElementById('notifBellWrap');
    if(!wrap) return;
    if(!this.isAdmin()){ wrap.innerHTML = ''; return; }
    const log = (this.db.activityLog||[]).slice().sort((a,b)=>b.ts-a.ts);
    const u = this.currentUser();
    const lastSeen = u.notifLastSeenTs || 0;
    const unreadCount = log.filter(e=>e.ts>lastSeen && e.userId!==u.id).length;
    let btn = wrap.querySelector('.notif-bell-btn');
    if(!btn){
      // first build only — creates the button + the (still empty, closed)
      // panel container and never touches them again after this
      wrap.innerHTML = `<button class="notif-bell-btn" onclick="App.toggleNotifPanel()">🔔</button><div id="notifPanel" style="display:none;"></div>`;
      btn = wrap.querySelector('.notif-bell-btn');
    }
    let badge = btn.querySelector('.notif-badge');
    if(unreadCount>0){
      if(!badge){ badge = document.createElement('span'); badge.className='notif-badge'; btn.appendChild(badge); }
      badge.textContent = unreadCount>99?'99+':String(unreadCount);
    } else if(badge){
      badge.remove();
    }
    // panel is open right now: keep its activity list current without
    // touching the settings controls (checkbox/select/range) at all
    if(this._notifPanelOpen) this.refreshNotifList();
  },
  /* rebuilds ONLY the scrollable activity-list portion of an already-open
     panel (not the sound-settings box above it), and restores the scroll
     position afterwards so a real-time update doesn't yank the list back
     to the top while someone's reading it. */
  refreshNotifList(){
    const listEl = document.getElementById('notifLogList');
    if(!listEl) return;
    const log = (this.db.activityLog||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,50);
    const u = this.currentUser();
    const lastSeen = u.notifLastSeenTs || 0;
    const scrollBox = document.querySelector('.notif-panel');
    const prevScroll = scrollBox ? scrollBox.scrollTop : 0;
    listEl.innerHTML = log.length===0? `<div class="empty small">لا يوجد نشاط مسجّل بعد</div>` :
      log.map(e=>`<div class="notif-item ${e.ts>lastSeen && e.userId!==u.id?'unread':''}">
        <div>${esc(e.label)}</div>
        <div class="t">${esc(e.username)} — ${new Date(e.ts).toLocaleString('ar-EG')}</div>
      </div>`).join('');
    if(scrollBox) scrollBox.scrollTop = prevScroll;
  },
  toggleNotifPanel(){
    const panel = document.getElementById('notifPanel');
    if(!panel) return;
    const opening = panel.style.display==='none';
    this._notifPanelOpen = opening;
    if(opening){
      const notifSupported = ('Notification' in window);
      const notifPerm = notifSupported ? Notification.permission : 'unsupported';
      const sp = this.getSoundNotifPrefs();
      // built once per open: the settings box (checkbox/select/range) lives
      // here and is left completely alone afterwards; only #notifLogList
      // gets refreshed while the panel stays open (see refreshNotifList)
      panel.innerHTML = `
        <div class="notif-panel">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <b class="small">آخر الأنشطة</b>
            ${notifSupported && notifPerm==='default' ? `<button class="btn btn-sm" onclick="App.enableBrowserNotifications()">🔔 فعّل تنبيهات المتصفح</button>` : ''}
          </div>
          <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:700;">
                <input type="checkbox" id="notifSoundEnabled" ${sp.enabled?'checked':''} onchange="App.setSoundNotifPref('enabled', this.checked)">
                🔊 تنبيه صوتي عند أي نشاط جديد
              </label>
              <button class="btn btn-sm" onclick="App.playNotifSound()">تجربة</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:7px;">
              <span class="small muted" style="white-space:nowrap;">نوع الصوت</span>
              <select id="notifSoundType" style="flex:1;" onchange="App.setSoundNotifPref('sound', this.value)">
                <option value="chime" ${sp.sound==='chime'?'selected':''}>جرس (افتراضي)</option>
                <option value="beep" ${sp.sound==='beep'?'selected':''}>تنبيه قصير</option>
                <option value="double" ${sp.sound==='double'?'selected':''}>نغمة مزدوجة</option>
                <option value="soft" ${sp.sound==='soft'?'selected':''}>نغمة هادئة</option>
              </select>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span class="small muted" style="white-space:nowrap;">مستوى الصوت</span>
              <input type="range" min="0" max="1" step="0.05" value="${sp.volume}" style="flex:1;" oninput="App.setSoundNotifPref('volume', parseFloat(this.value))">
            </div>
            <div class="small muted" style="margin-top:6px;">💡 دوس "تجربة" مرة واحدة دلوقتي، عشان المتصفح يسمح بتشغيل الصوت تلقائيًا بعد كده لما يحصل نشاط جديد.</div>
          </div>
          <div id="notifLogList"></div>
        </div>
      `;
      panel.style.display = 'block';
      this.refreshNotifList();
      // mark as seen from this admin's perspective (persists to their user
      // record, so it stays read across their other devices too)
      const u = this.currentUser();
      u.notifLastSeenTs = Date.now();
      saveData(this.db);
      const badge = document.querySelector('.notif-bell-btn .notif-badge');
      if(badge) badge.remove();
    } else {
      panel.style.display = 'none';
    }
  },
  enableBrowserNotifications(){
    if(!('Notification' in window)){ this.notify('متصفحك لا يدعم تنبيهات سطح المكتب.'); return; }
    Notification.requestPermission().then(()=>{ this.toggleNotifPanel(); this.toggleNotifPanel(); });
  },

  /* ---------------- SOUND NOTIFICATIONS ----------------
     Per-device preference (stored in localStorage, not synced) for a short
     beep whenever new activity from someone else arrives, independent of
     the desktop-notification permission below. Uses the Web Audio API
     (a couple of oscillator tones) instead of an audio file, so it needs
     no network request and works instantly. Browsers block audio from
     starting on its own until the person has interacted with the page at
     least once, so the "تجربة" (test) button doubles as that first unlock. */
  getSoundNotifPrefs(){
    try{
      const raw = localStorage.getItem('notifSoundPrefs');
      if(raw) return Object.assign({enabled:true, volume:0.5, sound:'chime'}, JSON.parse(raw));
    }catch(e){}
    return {enabled:true, volume:0.5, sound:'chime'};
  },
  setSoundNotifPref(key, value){
    const p = this.getSoundNotifPrefs();
    p[key] = value;
    try{ localStorage.setItem('notifSoundPrefs', JSON.stringify(p)); }catch(e){}
  },
  playNotifSound(forcedSound){
    const p = this.getSoundNotifPrefs();
    if(!forcedSound && !p.enabled) return;
    try{
      if(!this._audioCtx) this._audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = this._audioCtx;
      if(ctx.state==='suspended') ctx.resume().catch(()=>{});
      const now = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.value = (p.volume!=null? p.volume : 0.5);
      master.connect(ctx.destination);
      const tone = (freq, start, dur, type)=>{
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type||'sine';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, now+start);
        g.gain.exponentialRampToValueAtTime(1, now+start+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, now+start+dur);
        osc.connect(g); g.connect(master);
        osc.start(now+start); osc.stop(now+start+dur+0.03);
      };
      const name = forcedSound || p.sound || 'chime';
      if(name==='chime'){ tone(880,0,0.15); tone(1318.51,0.12,0.24); }
      else if(name==='double'){ tone(740,0,0.09,'square'); tone(740,0.16,0.09,'square'); }
      else if(name==='soft'){ tone(523.25,0,0.4,'sine'); }
      else { tone(660,0,0.13,'triangle'); }
    }catch(e){ console.error('notif sound failed', e); }
  },

  /* called from the Firestore listener on every real-time update: pops a
     desktop notification (if the browser permission was granted) and/or
     plays the sound alert (if enabled in this device's preferences) for
     any brand-new activity-log entry created by someone else — but only
     if the account currently logged in on THIS device/tab is an admin.
     Store employees never see or trigger this. */
  checkNewActivityForNotifications(sinceTs){
    if(!this.session || !this.session.userId) return;
    const u = this.currentUser();
    if(!u || u.role!=='admin') return;
    const log = this.db.activityLog||[];
    const fresh = log.filter(e=>e.ts>sinceTs && e.userId!==u.id).sort((a,b)=>a.ts-b.ts);
    if(!fresh.length) return;
    if(('Notification' in window) && Notification.permission==='granted'){
      fresh.forEach(e=>{
        try{ new Notification('نشاط جديد في النظام', {body:`${e.username}: ${e.label}`, tag:e.id}); }
        catch(err){ console.error('notification failed', err); }
      });
    }
    this.playNotifSound();
    this.renderNotifBell();
  },

  storeName(id){ const s=this.db.stores.find(x=>x.id===id); return s?s.name:null; },
  itemName(id){ const s=this.db.items.find(x=>x.id===id); return s?s.name:''; },
  itemUnit(id){ const s=this.db.items.find(x=>x.id===id); return s?(s.unit||''):''; },
  returnUnit(r){ return r.unit || this.itemUnit(r.itemId); },
  whName(id){ const s=this.db.warehouses.find(x=>x.id===id); return s?s.name:'—'; },
  storeDefaultWarehouse(storeId){ const s=this.db.stores.find(x=>x.id===storeId); return s?s.defaultWarehouseId:null; },

  /* ---------------- STOCK (inventory quantities per item per location) ----------------
     locType is 'store' or 'warehouse'; locId is that store's/warehouse's id.
     Kept as a flat array of {id,itemId,locType,locId,qty} — one row per
     item+location combination that has ever had a nonzero movement or a
     manual adjustment. */
  getStock(itemId, locType, locId){
    if(!locId) return 0;
    const s = this.db.stock.find(x=>x.itemId===itemId && x.locType===locType && x.locId===locId);
    return s ? s.qty : 0;
  },
  adjustStock(itemId, locType, locId, delta){
    if(!locId || !delta) return;
    let s = this.db.stock.find(x=>x.itemId===itemId && x.locType===locType && x.locId===locId);
    if(!s){ s = {id:uid(), itemId, locType, locId, qty:0}; this.db.stock.push(s); }
    s.qty += delta;
  },
  setStock(itemId, locType, locId, qty){
    if(!locId) return;
    let s = this.db.stock.find(x=>x.itemId===itemId && x.locType===locType && x.locId===locId);
    if(!s){ s = {id:uid(), itemId, locType, locId, qty:0}; this.db.stock.push(s); }
    s.qty = qty;
  },

  navClick(e, view){
    const btn = e.currentTarget;
    try{
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');
      ripple.className = 'nav-ripple';
      ripple.style.width = ripple.style.height = size+'px';
      const x = (e.clientX!=null ? e.clientX - rect.left : rect.width/2) - size/2;
      const y = (e.clientY!=null ? e.clientY - rect.top : rect.height/2) - size/2;
      ripple.style.left = x+'px';
      ripple.style.top = y+'px';
      btn.appendChild(ripple);
      setTimeout(()=>ripple.remove(), 550);
    }catch(err){}
    this.go(view);
  },
  go(view){
    const meta0 = this.NAV.find(n=>n.id===view);
    if(meta0 && !this.navVisible(meta0)){
      view = 'dashboard';
    }
    this.view = view;
    document.querySelectorAll('.navlink').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    document.getElementById('sidebar').classList.remove('open');
    const meta = this.NAV.find(n=>n.id===view);
    document.getElementById('pageTitle').textContent = meta ? meta.label : '';
    const subs = {
      dashboard:'نظرة عامة سريعة على المرتجعات والتنبيهات',
      returns:'سجل كل مرتجع من كل محل بالتاريخ والوقت ورقم التحويل والسبب',
      orders:'تسجيل كميات الطلبيات لكل محل وصنف لمقارنتها بالمرتجعات',
      reports:'تقارير تفصيلية حسب الصنف والمحل والفترة الزمنية',
      items:'قائمة الأصناف المستخدمة في الطلبيات والمرتجعات',
      inventory:'أرصدة الكميات المتاحة من كل صنف في كل محل ومستودع',
      stores:'إدارة المحلات المشترِكة في النظام',
      warehouses:'إدارة المستودعات التي تستقبل المرتجعات',
      users:'إضافة مستخدمين وربطهم بمحل معيّن',
      settings:'اسم الشركة وشعارها — خاص بحسابك فقط',
    };
    document.getElementById('pageSub').textContent = subs[view]||'';
    this.render();
  },

  /* Replace `container`'s innerHTML with the result of `getHtml()` while
     keeping whichever text input/textarea was focused (and its cursor
     position) focused afterwards — re-rendering while the user is
     mid-keystroke must never kick focus out of the field. Used by every
     re-render path (full page render, and any partial refresh like
     reReport()) so typing anywhere never "stops" after one character. */
  renderInto(container, getHtml){
    const c = (typeof container === 'string') ? document.getElementById(container) : container;
    if(!c) return;
    const active = document.activeElement;
    let focusInfo = null;
    if(active && c.contains(active) && active.id && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
      focusInfo = {id: active.id, start: active.selectionStart, end: active.selectionEnd};
    }
    c.innerHTML = getHtml();
    if(focusInfo){
      const el = document.getElementById(focusInfo.id);
      if(el){
        el.focus();
        if(typeof el.setSelectionRange==='function' && focusInfo.start!=null){
          try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
        }
      }
    }
  },

  render(){
    const fn = {
      dashboard: this.renderDashboard,
      returns: this.renderReturns,
      orders: this.renderOrders,
      items: this.renderItems,
      inventory: this.renderInventory,
      stores: this.renderStores,
      warehouses: this.renderWarehouses,
      users: this.renderUsers,
      reports: this.renderReports,
      settings: this.renderSettings,
    }[this.view];
    this.renderInto('content', ()=> fn ? fn.call(this) : '');
  },

  refresh(){ saveData(this.db); this.render(); this.renderBrand(); },

  /* ---------------- MODAL HELPERS ---------------- */
  openModal(html){
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalBackdrop').classList.add('open');
  },
  closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); },

  /* in-app replacements for window.alert / window.confirm, which are
     blocked or silently no-op inside this preview's sandboxed frame */
  notify(message){
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>تنبيه</h3>
      <p style="margin:0 0 4px;">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.closeModal()">حسنًا</button>
      </div>
    `);
  },
  _pendingConfirm: null,
  confirmAction(message, cb, confirmLabel){
    this._pendingConfirm = cb;
    this.openModal(`
      <button class="modal-close" onclick="App.cancelPendingConfirm()">✕</button>
      <h3>تأكيد</h3>
      <p style="margin:0 0 4px;">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="App.runPendingConfirm()">${esc(confirmLabel||'تأكيد الحذف')}</button>
        <button class="btn" onclick="App.cancelPendingConfirm()">إلغاء</button>
      </div>
    `);
  },
  runPendingConfirm(){
    const cb = this._pendingConfirm;
    this._pendingConfirm = null;
    this.closeModal();
    if(cb) cb();
  },
  cancelPendingConfirm(){
    this._pendingConfirm = null;
    this.closeModal();
  },

  /* =====================================================================
     DASHBOARD
  ===================================================================== */
  renderDashboard(){
    const d = this.db;
    const u = this.currentUser();
    const myReturns = this.isAdmin() ? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
    const monthPrefix = todayStr().slice(0,7);
    const thisMonth = myReturns.filter(r=>r.date && r.date.startsWith(monthPrefix));
    const totalQtyMonth = thisMonth.reduce((a,r)=>a+Number(r.qty||0),0);
    const totalRecordsMonth = thisMonth.length;

    // top reason this month
    const byReason = {};
    thisMonth.forEach(r=>{ byReason[r.reason]=(byReason[r.reason]||0)+Number(r.qty||0); });
    const topReason = Object.entries(byReason).sort((a,b)=>b[1]-a[1])[0];

    // expiry alerts: returned items with expiry within the configured window
    // (owner-editable in الإعدادات, defaults to 30 days) or already expired
    const in30 = new Date(); in30.setDate(in30.getDate()+this.expiryAlertDays());
    const expiryAlerts = myReturns.filter(r=>r.expiry).map(r=>({...r, exp:new Date(r.expiry)}))
      .filter(r=> r.exp <= in30)
      .sort((a,b)=>a.exp-b.exp).slice(0,8);

    // top items by qty (all-time, scoped)
    const byItem = {};
    myReturns.forEach(r=>{ byItem[r.itemId]=(byItem[r.itemId]||0)+Number(r.qty||0); });
    const topItems = Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,6);

    // reasons breakdown chart (this month, scoped) — sequential single-hue bars
    const reasonBars = Object.entries(byReason).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxReasonQty = reasonBars.length? reasonBars[0][1] : 0;

    // recent activity: admins see the system-wide activity log; store/warehouse
    // users see their own recent returns & orders (they don't have activityLog access)
    let recentActivity = [];
    if(this.isAdmin()){
      recentActivity = (d.activityLog||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,8)
        .map(e=>({label:e.label, meta:`${e.username} — ${new Date(e.ts).toLocaleString('ar-EG')}`}));
    } else {
      const myOrders = (d.orders||[]).filter(o=>o.storeId===u.storeId);
      const combined = [
        ...myReturns.map(r=>({t:(r.date||'')+(r.time||''), label:`ترجيع: ${this.itemName(r.itemId)} (${fmtNum(r.qty)} ${this.itemUnit(r.itemId)})`, meta:r.date})),
        ...myOrders.map(o=>({t:(o.date||'')+(o.time||''), label:`طلبية: ${this.itemName(o.itemId)} (${fmtNum(o.qty)} ${this.itemUnit(o.itemId)})`, meta:o.date}))
      ].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,8);
      recentActivity = combined.map(x=>({label:x.label, meta:x.meta||''}));
    }

    const emptySetup = d.stores.length===0 || d.items.length===0;

    return `
      ${emptySetup ? `
      <div class="card" style="border-color:var(--accent-soft);background:var(--accent-soft);margin-bottom:14px;">
        <b>لبدء الاستخدام:</b> أضف أولاً <a href="#" onclick="App.go('stores');return false;">المحلات</a> و<a href="#" onclick="App.go('items');return false;">الأصناف</a>${this.isAdmin()?` و<a href="#" onclick="App.go('warehouses');return false;">المستودعات</a>`:''}، ثم ابدأ تسجيل <a href="#" onclick="App.go('returns');return false;">المرتجعات</a>.
      </div>` : ''}

      <div class="grid grid-4">
        <div class="stat accent"><div class="n">${fmtNum(totalQtyMonth)}</div><div class="l">إجمالي الكمية المرتجعة هذا الشهر</div></div>
        <div class="stat"><div class="n">${fmtNum(totalRecordsMonth)}</div><div class="l">عدد عمليات الترجيع هذا الشهر</div></div>
        <div class="stat warn"><div class="n">${topReason?esc(topReason[0]):'—'}</div><div class="l">الأكثر تكرارًا كسبب ترجيع هذا الشهر</div></div>
        <div class="stat bad"><div class="n">${fmtNum(expiryAlerts.length)}</div><div class="l">أصناف قربت أو انتهت صلاحيتها</div></div>
      </div>

      <div class="grid grid-2" style="margin-top:14px;align-items:start;">
        <div class="card">
          <div class="section-head"><h3>توزيع أسباب المرتجعات <span class="muted small">(هذا الشهر، بالكمية)</span></h3></div>
          ${reasonBars.length? `
          <div class="bar-chart">
            ${reasonBars.map(([reason,q])=>{
              const pct = maxReasonQty? Math.max(4, Math.round(q/maxReasonQty*100)) : 0;
              return `<div class="bar-row">
                <div class="bar-label" title="${esc(reason)}">${esc(reason)}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
                <div class="bar-value">${fmtNum(q)}</div>
              </div>`;
            }).join('')}
          </div>` : `<div class="empty small">لا توجد بيانات مرتجعات هذا الشهر بعد</div>`}
        </div>
        <div class="card">
          <div class="section-head"><h3>آخر الحركات</h3></div>
          ${recentActivity.length? `
          <div class="activity-feed">
            ${recentActivity.map(a=>`<div class="activity-row">
              <div class="dot"></div>
              <div class="body">
                <div class="label">${esc(a.label)}</div>
                ${a.meta?`<div class="meta">${esc(a.meta)}</div>`:''}
              </div>
            </div>`).join('')}
          </div>` : `<div class="empty small">لا توجد حركات مسجّلة بعد</div>`}
        </div>
      </div>

      <div class="grid grid-2" style="margin-top:14px;align-items:start;">
        <div class="card">
          <div class="section-head"><h3>الأكثر ترجيعًا (كل الأوقات)</h3></div>
          ${topItems.length? `
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>إجمالي الكمية المرتجعة</th></tr></thead><tbody>
            ${topItems.map(([iid,q])=>`<tr><td>${esc(this.itemName(iid))||'<span class=\"muted\">صنف محذوف</span>'}</td><td>${fmtNum(q)} ${esc(this.itemUnit(iid))}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="empty small">لا توجد بيانات مرتجعات بعد</div>`}
        </div>
        <div class="card">
          <div class="section-head"><h3>تنبيهات الصلاحية القريبة</h3></div>
          ${expiryAlerts.length? `
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>المحل</th><th>تاريخ الصلاحية</th><th>الحالة</th></tr></thead><tbody>
            ${expiryAlerts.map(r=>{
              const expired = r.exp < new Date(new Date().setHours(0,0,0,0));
              return `<tr><td>${esc(this.itemName(r.itemId))}</td><td>${esc(this.storeName(r.storeId)||'—')}</td><td>${esc(r.expiry)}</td><td>${expired?'<span class="tag bad">منتهية</span>':'<span class="tag warn">قريبة</span>'}</td></tr>`;
            }).join('')}
          </tbody></table></div>` : `<div class="empty small">لا توجد تنبيهات صلاحية حاليًا</div>`}
        </div>
      </div>
    `;
  },

  /* =====================================================================
     RETURNS
  ===================================================================== */
  returnsFilter: {store:'', item:'', from:'', to:'', reason:'', q:''},

  renderReturns(){
    const d = this.db;
    const u = this.currentUser();
    const f = this.returnsFilter;
    let rows = this.isAdmin() ? d.returns.slice() : d.returns.filter(r=>r.storeId===u.storeId);
    if(f.store) rows = rows.filter(r=>r.storeId===f.store);
    if(f.item) rows = rows.filter(r=>r.itemId===f.item);
    if(f.reason) rows = rows.filter(r=>r.reason===f.reason);
    if(f.from) rows = rows.filter(r=>r.date>=f.from);
    if(f.to) rows = rows.filter(r=>r.date<=f.to);
    if(f.q){
      const q = f.q.trim().toLowerCase();
      rows = rows.filter(r=>{
        const it = d.items.find(i=>i.id===r.itemId);
        return (r.transferNo||'').toLowerCase().includes(q)
          || (it && (it.barcode||'').toLowerCase().includes(q))
          || (it && (it.code||'').toLowerCase().includes(q))
          || (it && (it.name||'').toLowerCase().includes(q));
      });
    }
    rows.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const canPickStore = this.isAdmin();

    return `
      <div class="section-head">
        <h3>سجل المرتجعات <span class="muted small">(${fmtNum(rows.length)} عملية — إجمالي الكمية ${fmtNum(totalQty)})</span></h3>
        <div class="actions">
          <button class="btn btn-sm" onclick="App.exportCSV(App.buildReturnsExportRows(),'المرتجعات')">تصدير CSV</button>
          ${this.can('returns.add')? `<button class="btn btn-sm" onclick="App.openImportReturns()">📥 استيراد من إكسيل</button>`:''}
          ${this.can('returns.add')? `<button class="btn btn-accent btn-sm" onclick="App.openReturnForm()">+ تسجيل مرتجع جديد</button>`:''}
        </div>
      </div>

      <div class="filters card" style="margin-bottom:14px;">
        <div class="field" style="flex:2;min-width:220px;">
          <label>بحث بالباركود أو رقم المرتجع/التحويل أو اسم الصنف</label>
          <input type="text" id="returnsSearchInput" placeholder="اكتب للبحث..." value="${esc(f.q)}" oninput="App.returnsFilter.q=this.value;App.render()">
        </div>
        ${canPickStore? `<div class="field"><label>المحل</label><select onchange="App.returnsFilter.store=this.value;App.render()">
          <option value="">كل المحلات</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${f.store===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>`:''}
        <div class="field"><label>الصنف</label><select onchange="App.returnsFilter.item=this.value;App.render()">
          <option value="">كل الأصناف</option>
          ${d.items.map(s=>`<option value="${s.id}" ${f.item===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>السبب</label><select onchange="App.returnsFilter.reason=this.value;App.render()">
          <option value="">كل الأسباب</option>
          ${this.reasons().map(r=>`<option ${f.reason===r?'selected':''}>${esc(r)}</option>`).join('')}
        </select></div>
        <div class="field"><label>من تاريخ</label><input type="date" value="${f.from}" onchange="App.returnsFilter.from=this.value;App.render()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${f.to}" onchange="App.returnsFilter.to=this.value;App.render()"></div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.returnsFilter={store:'',item:'',from:'',to:'',reason:'',q:''};App.render()">تصفية جديدة</button></div>
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>التاريخ</th><th>الوقت</th><th>المحل</th><th>اسم الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>شد الصنف</th><th>الكمية</th><th>رقم تحويل المرتجع</th><th>السبب</th><th>طريقة العلاج</th><th>تاريخ الصلاحية</th><th>المستودع</th><th></th>
          </tr></thead>
          <tbody>
          ${rows.length===0? `<tr><td colspan="14"><div class="empty">لا توجد مرتجعات مطابقة<br><span class="small">استخدم زر "تسجيل مرتجع جديد" لإضافة أول عملية</span></div></td></tr>` :
          rows.map(r=>{
            const it = d.items.find(i=>i.id===r.itemId);
            return `
            <tr>
              <td>${esc(r.date)}</td>
              <td>${esc(r.time||'—')}</td>
              <td>${esc(this.storeName(r.storeId)||'—')}</td>
              <td>${esc(it?it.name:'—')}</td>
              <td>${esc((it&&it.code)||'—')}</td>
              <td>${esc((it&&it.barcode)||'—')}</td>
              <td>${esc((it&&it.packSize)||'—')}</td>
              <td>${fmtNum(r.qty)} ${esc(this.returnUnit(r))}</td>
              <td>${esc(r.transferNo||'—')}</td>
              <td><span class="tag">${esc(r.reason)}</span></td>
              <td>${this.can('returns.edit')?`<select onchange="App.quickSetResolution('${r.id}',this.value)" style="min-width:150px;">${this.resolutions().map(res=>`<option ${(r.resolution||'معلّق')===res?'selected':''}>${esc(res)}</option>`).join('')}</select>`:`<span class="tag">${esc(r.resolution||'معلّق')}</span>`}</td>
              <td>${r.expiry? esc(r.expiry) : '<span class="muted">—</span>'}</td>
              <td>${esc(this.whName(r.warehouseId))}</td>
              <td>
                ${this.can('returns.edit')? `<button class="icon-btn" title="تعديل" onclick="App.openReturnForm('${r.id}')">✎</button>`:''}
                ${this.can('returns.delete')? `<button class="icon-btn" title="حذف" onclick="App.deleteReturn('${r.id}')">✕</button>`:''}
              </td>
            </tr>
          `;}).join('')}
          </tbody>
        </table>
      </div>
    `;
  },

  buildReturnsExportRows(){
    const rows = this.isAdmin() ? this.db.returns : this.db.returns.filter(r=>r.storeId===this.currentUser().storeId);
    return [
      ['التاريخ','الوقت','المحل','اسم الصنف','رمز الصنف','الباركود','الكمية','الوحدة','رقم تحويل المرتجع','السبب','تاريخ الصلاحية','المستودع'],
      ...rows.map(r=>{
        const it = this.db.items.find(i=>i.id===r.itemId);
        return [r.date,r.time,this.storeName(r.storeId),it?it.name:'—',(it&&it.code)||'',(it&&it.barcode)||'',r.qty,this.returnUnit(r),r.transferNo,r.reason,r.expiry,this.whName(r.warehouseId)];
      })
    ];
  },

          </select>

      <div class="form-row">

          <label>اسم الصنف</label>
          <select id="f_item" onchange="App.onReturnItemSelect()">

          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${UNITS.map(un=>`<button type="button" class="pill-tab unit-pill ${initialUnit===un?'active':''}" data-unit="${esc(un)}" onclick="App.selectReturnUnit('${esc(un)}')">${esc(un)}</button>`).join('')}
          </div>
        </div>
      </div>

  onReturnItemSelect(){

  selectReturnUnit(val){

    document.querySelectorAll('.unit-pill').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.unit===val);

  onReturnReasonChange(){

  saveReturn(id){
    const storeId = document.getElementById('f_store').value;
    const itemId = document.getElementById('f_item').value;
    const unit = document.getElementById('f_unit').value;
    const qty = parseFloat(document.getElementById('f_qty').value);
    const transferNo = document.getElementById('f_transfer').value.trim();
    const date = document.getElementById('f_date').value;
    const time = document.getElementById('f_time').value;
    let reason = document.getElementById('f_reason').value;
    const expiry = document.getElementById('f_expiry').value;
    const warehouseId = document.getElementById('f_wh').value || null;
    const resolutionEl = document.getElementById('f_resolution');
    const resolution = resolutionEl ? resolutionEl.value : 'معلّق';

    if(reason === 'أخرى'){
      const otherReason = document.getElementById('f_reason_other').value.trim();
      if(!otherReason){
        this.notify('من فضلك اكتب سبب الترجيع في الخانة اللي ظهرت بعد اختيار "أخرى".');
        return;
      }
      reason = otherReason;
    }

    if(!storeId || !itemId || !qty || qty<=0 || !date){
      this.notify('من فضلك أكمل الحقول المطلوبة: المحل، الصنف، الكمية، التاريخ.');
      return;
    }
    const itName = this.itemName(itemId);
    if(id){
      const r = this.db.returns.find(x=>x.id===id);
      // reverse this return's old stock effect before applying the edited values
      this.adjustStock(r.itemId,'store',r.storeId, r.qty);
      if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, -r.qty);
      Object.assign(r, {storeId,itemId,unit,qty,transferNo,date,time,reason,expiry,warehouseId,resolution});
      this.adjustStock(itemId,'store',storeId, -qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, qty);
      this.logActivity(`عدّل مرتجع: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    } else {
      this.db.returns.push({id:uid(), storeId,itemId,unit,qty,transferNo,date,time,reason,expiry,warehouseId,resolution});
      // a return moves stock from the store back to the warehouse
      this.adjustStock(itemId,'store',storeId, -qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, qty);
      this.logActivity(`سجّل مرتجع جديد: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }
    this.closeModal();
    this.refresh();
  },
  quickSetResolution(id, value){
    const r = this.db.returns.find(x=>x.id===id);
    if(!r) return;
    r.resolution = value;
    this.logActivity(`غيّر طريقة علاج مرتجع (${this.itemName(r.itemId)}) إلى: ${value}`);
    this.refresh();
  },
  deleteReturn(id){
    this.confirmAction('تأكيد حذف سجل المرتجع؟', ()=>{
      const r = this.db.returns.find(x=>x.id===id);
      if(r){
        this.adjustStock(r.itemId,'store',r.storeId, r.qty);
        if(r.warehouseId) this.adjustStock(r.itemId,'warehouse',r.warehouseId, -r.qty);
        this.logActivity(`حذف مرتجع: ${this.itemName(r.itemId)} (${fmtNum(r.qty)}) — ${this.storeName(r.storeId)||''}`);
      }
      this.db.returns = this.db.returns.filter(r=>r.id!==id);
      this.refresh();
    });
  },

  /* ---------------- BULK IMPORT RETURNS FROM EXCEL ---------------- */
  async downloadReturnsTemplate(){
    const wsData = [
      ['التاريخ (YYYY-MM-DD)','الوقت (HH:MM)','المحل','الباركود','رمز الصنف','اسم الصنف','شد الصنف','الوحدة (اختر من القائمة)','الكمية','رقم تحويل المرتجع','السبب','تاريخ الصلاحية (اختياري)','المستودع (اختياري)'],
      ['2026-09-20','14:30','فرع المعادي','6221234567890','IT-1001','بسكويت شوكولاتة 200جم','24 قطعة','كرتون',12,'TRF-1001','منتهي الصلاحية','2026-09-10','المستودع الرئيسي'],
      ['2026-09-21','10:15','فرع مدينة نصر','','','عصير مانجو 1 لتر','','حبة',5,'TRF-1002','تالف','','' ],
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:16},{wch:12},{wch:18},{wch:18},{wch:14},{wch:30},{wch:14},{wch:20},{wch:10},{wch:16},{wch:18},{wch:16},{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المرتجعات');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});

    // Column H = "الوحدة" (8th column). Inject a real Excel dropdown (data
    // validation) into that column, since the free XLSX library can't
    // write data validations through its normal API.
    try{
      const zip = await JSZip.loadAsync(out);
      const sheetPath = 'xl/worksheets/sheet1.xml';
      const sheetFile = zip.file(sheetPath);
      if(!sheetFile) throw new Error('sheet xml not found');
      let xml = await sheetFile.async('string');
      const dv = `<dataValidations count="1"><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="H2:H1000"><formula1>"${UNITS.join(',')}"</formula1></dataValidation></dataValidations>`;
      xml = xml.includes('</sheetData>')
        ? xml.replace('</sheetData>', '</sheetData>'+dv)
        : xml.replace('</worksheet>', dv+'</worksheet>');
      zip.file(sheetPath, xml);
      const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      this.saveFile('نموذج_استيراد_المرتجعات.xlsx', blob);
    }catch(err){
      console.error('data validation injection failed, saving plain file', err);
      const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      this.saveFile('نموذج_استيراد_المرتجعات.xlsx', blob);
    }
  },
