      <div class="pill-tabs" style="margin-top:12px;margin-bottom:0;">
        <button class="pill-tab ${st.view==='top'?'active':''}" onclick="App.rp_movers.view='top';App.reReport()">🔥 الأكثر ترجيعًا</button>
        <button class="pill-tab ${st.view==='slow'?'active':''}" onclick="App.rp_movers.view='slow';App.reReport()">🐌 الأقل / الراكدة</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>${st.view==='top'?'أكثر 20 صنف ترجيعًا':'أقل 20 صنف ترجيعًا (تشمل الراكدة تمامًا)'}</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportMoversRows(),'تقرير_${st.view==='top'?'الأكثر':'الأقل'}_ترجيعًا')">تصدير CSV</button></div></div>
      ${list.length===0? `<div class="empty small">لا توجد بيانات</div>` : `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>الصنف</th><th>عدد مرات الترجيع</th><th>إجمالي الكمية</th></tr></thead><tbody>
        ${list.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(this.itemName(x.itemId)||'—')}</td><td>${fmtNum(x.count)}</td><td>${fmtNum(x.qty)} ${esc(this.itemUnit(x.itemId))}</td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
    `;
  },
  computeMoversList(){
    const d=this.db, u=this.currentUser(); const st=this.rp_movers; const admin=this.isAdmin();
    const scoped = admin ? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
    const periodRows = scoped.filter(r=> (!st.storeId || r.storeId===st.storeId) && r.date>=st.from && r.date<=st.to);
    const byItem = {};
    periodRows.forEach(r=>{
      byItem[r.itemId] = byItem[r.itemId] || {qty:0, count:0};
      byItem[r.itemId].qty += Number(r.qty||0);
      byItem[r.itemId].count++;
    });
    let list = d.items.map(it=>({itemId:it.id, qty:(byItem[it.id]?byItem[it.id].qty:0), count:(byItem[it.id]?byItem[it.id].count:0)}));
    if(st.view==='top') list = list.filter(x=>x.count>0).sort((a,b)=>b.qty-a.qty).slice(0,20);
    else list = list.sort((a,b)=>a.qty-b.qty).slice(0,20);
    return list;
  },
  exportMoversRows(){
    const list = this.computeMoversList();
    return [['الصنف','عدد مرات الترجيع','إجمالي الكمية'], ...list.map(x=>[this.itemName(x.itemId), x.count, x.qty])];
  },

  /* ---------------- BRANCH PERFORMANCE (ranking with trend vs previous equal period) ---------------- */
  rp_branch:{from:'', to:''},
  reportBranchPerformance(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_branch;
    const admin=this.isAdmin();
    if(!st.from){ st.from = todayStr().slice(0,8)+'01'; st.to = todayStr(); }

    const ranking = this.computeBranchPerfRanking();
    const fromD = new Date(st.from), toD = new Date(st.to);
    const lenDays = Math.max(1, Math.round((toD-fromD)/86400000)+1);

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1fr 1fr;align-items:end;">
        <div class="field"><label>من تاريخ</label><input type="date" value="${st.from}" onchange="App.rp_branch.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${st.to}" onchange="App.rp_branch.to=this.value;App.reReport()"></div>
      </div>
      <div class="small muted" style="margin-top:8px;">المقارنة تلقائيًا مع فترة سابقة بنفس عدد الأيام (${fmtNum(lenDays)} يوم)</div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>${admin?'ترتيب الفروع حسب الكمية المرتجعة':'أداء فرعك'}</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportBranchPerfRows(),'أداء_الفروع')">تصدير CSV</button></div></div>
      ${ranking.length===0? `<div class="empty small">لا توجد فروع</div>` : `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>الفرع</th><th>عدد العمليات</th><th>إجمالي الكمية</th><th>أكثر سبب</th><th>التغيّر عن الفترة السابقة</th></tr></thead><tbody>
        ${ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.store.name)}</td><td>${fmtNum(r.count)}</td><td>${fmtNum(r.qty)}</td><td>${esc(r.topReason)}</td><td>${r.delta>0?`<span class="tag bad">▲ ${fmtNum(r.delta)}%</span>`:(r.delta<0?`<span class="tag good">▼ ${fmtNum(Math.abs(r.delta))}%</span>`:'<span class="tag">—</span>')}</td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
    `;
  },
  computeBranchPerfRanking(){
    const d=this.db, u=this.currentUser(); const st=this.rp_branch; const admin=this.isAdmin();
    const stores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const fromD = new Date(st.from), toD = new Date(st.to);
    const lenDays = Math.max(1, Math.round((toD-fromD)/86400000)+1);
    const prevTo = new Date(fromD.getTime()-86400000);
    const prevFrom = new Date(prevTo.getTime()-(lenDays-1)*86400000);
    const fmtD = (dt)=>dt.toISOString().slice(0,10);
    const calc=(storeId, from, to)=>{
      const rows = d.returns.filter(r=>r.storeId===storeId && r.date>=from && r.date<=to);
      const qty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
      const reasonCount={};
      rows.forEach(r=>{ reasonCount[r.reason]=(reasonCount[r.reason]||0)+1; });
      const topReason = Object.entries(reasonCount).sort((a,b)=>b[1]-a[1])[0];
      return {count:rows.length, qty, topReason: topReason?topReason[0]:'—'};
    };
    return stores.map(s=>{
      const cur = calc(s.id, st.from, st.to);
      const prev = calc(s.id, fmtD(prevFrom), fmtD(prevTo));
      const delta = prev.qty>0 ? Math.round(((cur.qty-prev.qty)/prev.qty)*100) : (cur.qty>0?100:0);
      return {store:s, ...cur, delta};
    }).sort((a,b)=>b.qty-a.qty);
  },
  exportBranchPerfRows(){
    const ranking = this.computeBranchPerfRanking();
    return [['الفرع','عدد العمليات','إجمالي الكمية','أكثر سبب','التغيّر %'], ...ranking.map(r=>[r.store.name, r.count, r.qty, r.topReason, r.delta])];
  },

  /* ---------------- SINGLE RECORD LOOKUP (find one return/transfer by its number) ---------------- */
  rp_record:{query:''},
  reportRecordLookup(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_record;
    const scoped = this.isAdmin()? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
    const q=(st.query||'').trim().toLowerCase();
    const rec = q ? scoped.find(r=>(r.transferNo||'').toLowerCase()===q || (r.id||'').toLowerCase()===q) : null;

    let detailHtml = '';
    if(q && !rec){
      detailHtml = `<div class="empty" style="margin-top:14px;">لا توجد عملية بهذا الرقم${this.isAdmin()?'':' (في نطاق فرعك)'}</div>`;
    } else if(rec){
      const it = d.items.find(i=>i.id===rec.itemId);
      detailHtml = `
      <div class="card" style="margin-top:14px;">
        <div class="section-head"><h3>تفاصيل العملية</h3></div>
        <div class="grid grid-2">
          <div><b class="small muted">رقم المرتجع/التحويل</b><div>${esc(rec.transferNo||'—')}</div></div>
          <div><b class="small muted">التاريخ والوقت</b><div>${esc(rec.date)} ${esc(rec.time||'')}</div></div>
          <div><b class="small muted">الفرع</b><div>${esc(this.storeName(rec.storeId)||'—')}</div></div>
          <div><b class="small muted">المستودع</b><div>${esc(this.whName(rec.warehouseId))}</div></div>
          <div><b class="small muted">الصنف</b><div>${esc(it?it.name:'—')}</div></div>
          <div><b class="small muted">الكود / الباركود</b><div>${esc((it&&it.code)||'—')} / ${esc((it&&it.barcode)||'—')}</div></div>
          <div><b class="small muted">الكمية</b><div>${fmtNum(rec.qty)} ${esc(rec.unit||this.itemUnit(rec.itemId))}</div></div>
          <div><b class="small muted">السبب</b><div>${esc(rec.reason||'—')}</div></div>
          <div><b class="small muted">تاريخ الصلاحية</b><div>${rec.expiry?esc(rec.expiry):'—'}</div></div>
          <div><b class="small muted">القرار / الحل</b><div>${esc(rec.resolution||'—')}</div></div>
        </div>
      </div>`;
    }

    return `
    <div class="card">
      <div class="field" style="max-width:420px;">
        <label>رقم المرتجع/التحويل</label>
        <input type="text" id="recordLookupInput" placeholder="اكتب أو امسح الباركود..." value="${esc(st.query)}" oninput="App.rp_record.query=this.value;App.reReport()">
      </div>
    </div>
    ${detailHtml}
    `;
  },

  reReport(){ this.renderInto('reportBody', ()=> this.renderReportBody()); },

  /* ---------------- FILE SAVING ---------------- */
  _downloadsCapPromise: null,
  getDownloadsCap(){
    if(!this._downloadsCapPromise){
      this._downloadsCapPromise = (async ()=>{
        try{
          if(!window.claude || !window.claude.use) return null;
          return await window.claude.use('downloads');
        }catch(e){ return null; }
      })();
    }
    return this._downloadsCapPromise;
  },
  saveFileViaBrowser(filename, data){
    try{
      const blob = (data instanceof Blob) ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      return true;
    }catch(err){
      console.error(err);
      return false;
    }
  },
  async saveFile(filename, data){
    const cap = await this.getDownloadsCap();
    if(cap){
      try{
        await cap.save({filename, data});
        this.logActivity(`نزّل تقرير/ملف: ${filename}`);
        saveData(this.db);
      }catch(err){
        if(err && err.code==='declined') return;
        console.error(err);
        this.notify('تعذّر حفظ الملف. جرّب مرة أخرى.');
      }
      return;
    }
    const ok = this.saveFileViaBrowser(filename, data);
    if(ok){
      this.logActivity(`نزّل تقرير/ملف: ${filename}`);
      saveData(this.db);
    }else{
      this.notify('تعذّر حفظ الملف. جرّب مرة أخرى.');
    }
  },

  /* ---------------- CSV EXPORT ---------------- */
  /* every export (any report/table pulled from the app) is stamped with
     who pulled it and exactly when, so it's always traceable later */
  reportPullStampRows(title){
    const u = this.currentUser();
    const now = new Date();
    const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    return [
      [title||'تقرير'],
      ['تم سحب هذا التقرير بواسطة', u?(u.name||u.username):'—'],
      ['تاريخ ووقت السحب', stamp],
      [],
    ];
  },
  exportCSV(rows, filename){
    rows = this.reportPullStampRows(filename).concat(rows);
    const csv = rows.map(row=>row.map(cell=>{
      const s = String(cell==null?'':cell);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    this.saveFile((filename||'تقرير')+'.csv', blob);
  },
};

/* =====================================================================
   FIREBASE (shared Firestore backend, cross-device)
   App.db already holds the local-cache value from loadData() above, so the
   very first paint (App.init() below) has something to show. Once we sign
   in anonymously and get the first snapshot from Firestore, App.db is
   replaced (or Firestore is seeded from it, if it doesn't exist yet), and
   every following snapshot keeps App.db - and the visible screen, if the
   app is showing - live-synced across every connected device.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCZ2b4wrlxhLpP534ddyLsAlrgNWIeGeMU",
  authDomain: "returns---manager.firebaseapp.com",
  projectId: "returns---manager",
  storageBucket: "returns---manager.firebasestorage.app",
  messagingSenderId: "37786380250",
  appId: "1:37786380250:web:19a37e42370eafc54f82e3",
  measurementId: "G-Y908J0K9TS"
};
window.__fsReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const fsdb = firebase.firestore();
  const mainDocRef = fsdb.collection('appdata').doc('main');
  window.__mainDocRef = mainDocRef;

  let firstSnapshot = true;
  // tracks the newest activity-log timestamp we've already seen, so we only
  // fire a desktop notification for entries that arrive AFTER this device
  // started watching (never for the log's existing history on first load)
  let lastKnownActivityTs = 0;
  auth.onAuthStateChanged(user=>{
    if(!user){ auth.signInAnonymously().catch(e=>console.error('firebase anonymous sign-in failed', e)); return; }

    mainDocRef.onSnapshot(snap=>{
      if(firstSnapshot){
        firstSnapshot = false;
        if(!snap.exists){
          // nothing in Firestore yet: seed it with whatever we have locally
          mainDocRef.set(App.db).catch(e=>console.error('firestore seed failed', e));
        } else {
          App.db = migrateData(snap.data());
        }
        const log0 = App.db.activityLog||[];
        lastKnownActivityTs = log0.length? Math.max(...log0.map(e=>e.ts)) : 0;
        window.__fsReady = true;
        App.applyTheme();
      } else if(snap.exists){
        App.db = migrateData(snap.data());
        App.checkNewActivityForNotifications(lastKnownActivityTs);
        const log1 = App.db.activityLog||[];
        if(log1.length) lastKnownActivityTs = Math.max(lastKnownActivityTs, ...log1.map(e=>e.ts));
        App.applyTheme();
      }
      // keep every connected device's screen live-synced, without touching
      // an open modal (it isn't part of App.render()'s target)
      if(document.getElementById('app').style.display !== 'none'){
        App.buildNav();
        App.render();
      }
    }, err=>{ console.error('firestore snapshot listener failed', err); });
  });
}catch(e){ console.error('firebase init failed', e); }

App.init();
</script>
