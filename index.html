  excelCellToDateStr(cell){
    if(cell instanceof Date){
      return `${cell.getFullYear()}-${String(cell.getMonth()+1).padStart(2,'0')}-${String(cell.getDate()).padStart(2,'0')}`;
    }
    const s = String(cell==null?'':cell).trim();
    if(!s) return '';
    if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
      const [y,m,dd] = s.split('-');
      return `${y}-${m.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    }
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    return s;
  },
  excelCellToTimeStr(cell){
    if(cell instanceof Date){
      return `${String(cell.getHours()).padStart(2,'0')}:${String(cell.getMinutes()).padStart(2,'0')}`;
    }
    const s = String(cell==null?'':cell).trim();
    if(/^\d{1,2}:\d{2}$/.test(s)) return s.length===4? '0'+s : s;
    return s;
  },
  processReturnsFile(){
    const input = document.getElementById('returnsFile');
    const resultBox = document.getElementById('importReturnsResult');
    if(!input.files || !input.files[0]){ resultBox.textContent = 'اختر ملف أولًا.'; return; }
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});

        const headerWords = ['التاريخ','date'];
        let startIdx = 0;
        if(rows.length && String(rows[0][0]||'').trim() && headerWords.some(w=>String(rows[0][0]).trim().toLowerCase().includes(w))){
          startIdx = 1;
        }

        const d = this.db, u = this.currentUser();
        const storesByName = new Map(d.stores.map(s=>[s.name.trim().toLowerCase(), s]));
        const whByName = new Map(d.warehouses.map(w=>[w.name.trim().toLowerCase(), w]));
        const itemsByBarcode = new Map(d.items.filter(i=>i.barcode).map(i=>[String(i.barcode).trim(), i]));
        const itemsByCode = new Map(d.items.filter(i=>i.code).map(i=>[i.code.trim().toLowerCase(), i]));
        const itemsByName = new Map(d.items.map(i=>[i.name.trim().toLowerCase(), i]));

        let added=0, skippedEmpty=0, skippedNoStore=0, skippedNoItem=0, skippedBadRow=0, skippedWrongStore=0;
        for(let i=startIdx;i<rows.length;i++){
          const row = rows[i];
          if(!row || row.every(c=>String(c||'').trim()==='')) continue;

          const date = this.excelCellToDateStr(row[0]);
          const time = this.excelCellToTimeStr(row[1]) || nowTime();
          const storeRaw = String(row[2]||'').trim();
          const barcodeRaw = String(row[3]||'').trim();
          const codeRaw = String(row[4]||'').trim();
          const nameRaw = String(row[5]||'').trim();
          // row[6] = شد الصنف — display-only, not used for matching
          const unitRaw = String(row[7]||'').trim();
          const qty = parseFloat(row[8]);
          const transferNo = String(row[9]||'').trim();
          const reason = String(row[10]||'').trim() || 'أخرى';
          const expiry = row[11] ? this.excelCellToDateStr(row[11]) : '';
          const whRaw = String(row[12]||'').trim();

          if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !storeRaw || (!barcodeRaw && !codeRaw && !nameRaw) || !qty || qty<=0){
            skippedBadRow++; continue;
          }
          const store = storesByName.get(storeRaw.toLowerCase());
          if(!store){ skippedNoStore++; continue; }
          if(!this.isAdmin() && store.id!==u.storeId){ skippedWrongStore++; continue; }
          const item = (barcodeRaw && itemsByBarcode.get(barcodeRaw))
            || (codeRaw && itemsByCode.get(codeRaw.toLowerCase()))
            || (nameRaw && itemsByName.get(nameRaw.toLowerCase()));
          if(!item){ skippedNoItem++; continue; }
          const wh = whRaw ? whByName.get(whRaw.toLowerCase()) : null;
          const unit = UNITS.find(un=>un===unitRaw) || (UNITS.includes(item.unit)? item.unit : '') || unitRaw;

          this.db.returns.push({
            id: uid(), storeId: store.id, itemId: item.id,
            warehouseId: wh? wh.id : null,
            unit, qty, transferNo, date, time, reason, expiry
          });
          this.adjustStock(item.id,'store',store.id, -qty);
          if(wh) this.adjustStock(item.id,'warehouse',wh.id, qty);
          added++;
        }
        saveData(this.db);
        let msg = `تم استيراد <b>${fmtNum(added)}</b> مرتجع جديد.`;
        const skippedParts = [];
        if(skippedNoStore) skippedParts.push(`${fmtNum(skippedNoStore)} لعدم تطابق اسم المحل`);
        if(skippedNoItem) skippedParts.push(`${fmtNum(skippedNoItem)} لعدم تطابق الصنف`);
        if(skippedWrongStore) skippedParts.push(`${fmtNum(skippedWrongStore)} لأنها لمحل غير محلك`);
        if(skippedBadRow) skippedParts.push(`${fmtNum(skippedBadRow)} لبيانات ناقصة أو غير صحيحة`);
        if(skippedParts.length) msg += ' — تم تجاهل: ' + skippedParts.join('، ') + '.';
        resultBox.innerHTML = msg;
        this.render();
        if(added>0 && skippedParts.length===0){ setTimeout(()=>{ this.closeModal(); }, 1800); }
      }catch(err){
        console.error(err);
        resultBox.textContent = 'تعذّرت قراءة الملف. تأكد أنه بصيغة xlsx أو xls أو csv صحيحة وبنفس ترتيب الأعمدة المطلوب.';
      }
    };
    reader.readAsArrayBuffer(file);
  },

        <div class="field"><label>المحل</label>
          <select id="o_store" ${lockedStore?'disabled':''}>
            ${d.stores.map(s=>`<option value="${s.id}" ${(editing?editing.storeId:lockedStore)===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>الصنف</label>
          <select id="o_item">${d.items.map(s=>`<option value="${s.id}" ${editing&&editing.itemId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>الكمية المطلوبة</label><input type="number" min="0" step="any" id="o_qty" value="${editing?editing.qty:''}"></div>
        <div class="field"><label>تاريخ الطلب</label><input type="date" id="o_date" value="${editing?editing.date:todayStr()}"></div>
      </div>
      <div class="field"><label>المستودع المورّد (اختياري — لتحديث أرصدة المخزون تلقائيًا)</label>
        <select id="o_wh">
          <option value="">— بدون تحديد —</option>
          ${d.warehouses.map(w=>`<option value="${w.id}" ${editing&&editing.warehouseId===w.id?'selected':''}>${w.code?'['+esc(w.code)+'] ':''}${esc(w.name)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveOrder('${editing?editing.id:''}')">${editing?'حفظ التعديل':'حفظ الطلبية'}</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
  },
  saveOrder(id){
    const storeId = document.getElementById('o_store').value;
    const itemId = document.getElementById('o_item').value;
    const qty = parseFloat(document.getElementById('o_qty').value);
    const date = document.getElementById('o_date').value;
    const warehouseId = document.getElementById('o_wh').value || null;
    if(!storeId||!itemId||!qty||qty<=0||!date){ this.notify('أكمل جميع الحقول.'); return; }
    const itName = this.itemName(itemId);
    if(id){
      const o = this.db.orders.find(x=>x.id===id);
      // reverse this order's old stock effect before applying the edited values
      this.adjustStock(o.itemId,'store',o.storeId, -o.qty);
      if(o.warehouseId) this.adjustStock(o.itemId,'warehouse',o.warehouseId, o.qty);
      Object.assign(o, {storeId,itemId,qty,date,warehouseId});
      this.adjustStock(itemId,'store',storeId, qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, -qty);
      this.logActivity(`عدّل طلبية: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }else{
      this.db.orders.push({id:uid(),storeId,itemId,qty,date,warehouseId});
      // an order moves stock from the warehouse to the store
      this.adjustStock(itemId,'store',storeId, qty);
      if(warehouseId) this.adjustStock(itemId,'warehouse',warehouseId, -qty);
      this.logActivity(`سجّل طلبية جديدة: ${itName} (${fmtNum(qty)}) — ${this.storeName(storeId)||''}`);
    }
    this.closeModal(); this.refresh();
  },
  deleteOrder(id){
    this.confirmAction('تأكيد حذف الطلبية؟', ()=>{
      const o = this.db.orders.find(x=>x.id===id);
      if(o){
        this.adjustStock(o.itemId,'store',o.storeId, -o.qty);
        if(o.warehouseId) this.adjustStock(o.itemId,'warehouse',o.warehouseId, o.qty);
        this.logActivity(`حذف طلبية: ${this.itemName(o.itemId)} (${fmtNum(o.qty)}) — ${this.storeName(o.storeId)||''}`);
      }
      this.db.orders = this.db.orders.filter(o=>o.id!==id);
      this.refresh();
    });
  },

  /* =====================================================================
     ITEMS / STORES / WAREHOUSES / USERS  (simple master data CRUD)
  ===================================================================== */
  itemsFilter:{q:'', unit:''},
  inventoryFilter:{locType:'store', locId:'', q:''},
  itemsSelected: new Set(),
  toggleItemSelect(id, checked){
    if(checked) this.itemsSelected.add(id); else this.itemsSelected.delete(id);
    this.render();
  },
  toggleItemSelectAll(checked, visibleIds){
    if(checked) visibleIds.forEach(id=>this.itemsSelected.add(id));
    else visibleIds.forEach(id=>this.itemsSelected.delete(id));
    this.render();
  },
  deleteSelectedItems(){
    const n = this.itemsSelected.size;
    if(n===0) return;
    this.confirmAction(`تأكيد حذف ${n} صنف؟ لن يتم حذف المرتجعات أو الطلبيات المسجلة بها.`, ()=>{
      this.db.items = this.db.items.filter(i=>!this.itemsSelected.has(i.id));
      this.db.stock = this.db.stock.filter(s=>!this.itemsSelected.has(s.itemId));
      this.itemsSelected.clear();
      this.refresh();
    });
  },
  renderItems(){
    const d=this.db;
    const f=this.itemsFilter;
    let rows = d.items.slice();
    if(f.q){
      const q=f.q.trim().toLowerCase();
      rows = rows.filter(it=>
        (it.name||'').toLowerCase().includes(q) ||
        (it.code||'').toLowerCase().includes(q) ||
        (it.barcode||'').toLowerCase().includes(q)
      );
    }
    if(f.unit) rows = rows.filter(it=>(it.unit||'')===f.unit);
    const units = [...new Set(d.items.map(it=>it.unit).filter(Boolean))].sort();
    const visibleIds = rows.map(it=>it.id);
    const allVisibleSelected = visibleIds.length>0 && visibleIds.every(id=>this.itemsSelected.has(id));
    const selCount = this.itemsSelected.size;

    return `
      <div class="section-head"><h3>الأصناف (${fmtNum(rows.length)}${rows.length!==d.items.length?' من '+fmtNum(d.items.length):''})</h3>
        <div class="actions">
          ${(selCount>0 && this.can('items.edit'))? `<button class="btn btn-danger btn-sm" onclick="App.deleteSelectedItems()">✕ حذف المحدد (${fmtNum(selCount)})</button>`:''}
          <button class="btn btn-sm" onclick="App.exportItemsExcel()">⬇ تصدير الأصناف Excel</button>
          ${this.can('items.edit')? `<button class="btn btn-sm" onclick="App.openImportItems()">📥 استيراد من إكسيل</button>`:''}
          ${this.can('items.edit')? `<button class="btn btn-accent btn-sm" onclick="App.openItemForm()">+ إضافة صنف</button>`:''}
        </div></div>

      <div class="filters card" style="margin-bottom:14px;">
        <div class="field" style="flex:2;min-width:220px;">
          <label>بحث بالاسم أو رمز الصنف أو الباركود</label>
          <input type="text" id="itemsSearchInput" placeholder="اكتب للبحث..." value="${esc(f.q)}" oninput="App.itemsFilter.q=this.value;App.render()">
        </div>
        <div class="field">
          <label>الوحدة</label>
          <select onchange="App.itemsFilter.unit=this.value;App.render()">
            <option value="">كل الوحدات</option>
            ${units.map(u=>`<option value="${esc(u)}" ${f.unit===u?'selected':''}>${esc(u)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.itemsFilter={q:'',unit:''};App.render()">إلغاء الفلترة</button></div>
      </div>

      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th style="width:34px;"><input type="checkbox" ${allVisibleSelected?'checked':''} data-ids='${JSON.stringify(visibleIds)}' onchange="App.toggleItemSelectAll(this.checked, JSON.parse(this.dataset.ids))"></th>
        <th>اسم الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>شد الصنف</th><th>الوحدة</th>${this.can('finance.view')?'<th>تكلفة الوحدة</th>':''}<th></th>
      </tr></thead><tbody>
      ${rows.length===0?`<tr><td colspan="8"><div class="empty">${d.items.length===0?'لا توجد أصناف بعد':'لا توجد نتائج مطابقة للبحث/الفلترة'}</div></td></tr>`:
      rows.map(it=>`<tr>
        <td><input type="checkbox" ${this.itemsSelected.has(it.id)?'checked':''} onchange="App.toggleItemSelect('${it.id}', this.checked)"></td>
        <td>${esc(it.name)}</td>
        <td>${esc(it.code||'—')}</td>
        <td>${esc(it.barcode||'—')}</td>
        <td>${esc(it.packSize||'—')}</td>
        <td>${esc(it.unit||'—')}</td>
        ${this.can('finance.view')?`<td>${it.cost?fmtNum(it.cost):'—'}</td>`:''}
        <td>
          ${this.can('items.edit')?`<button class="icon-btn" onclick="App.openItemForm('${it.id}')">✎</button>
          <button class="icon-btn" onclick="App.deleteItem('${it.id}')">✕</button>`:''}
        </td>
      </tr>`).join('')}
      </tbody></table></div>
    `;

  openItemForm(id){
    const editing = id? this.db.items.find(i=>i.id===id):null;
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>${editing?'تعديل صنف':'إضافة صنف جديد'}</h3>
      <div class="field"><label>اسم الصنف</label><input type="text" id="it_name" placeholder="مثال: بسكويت شوكولاتة 200 جم" value="${editing?esc(editing.name):''}"></div>
      <div class="form-row">
        <div class="field"><label>رمز الصنف</label><input type="text" id="it_code" placeholder="مثال: IT-1042" value="${editing?esc(editing.code||''):''}"></div>
        <div class="field"><label>الباركود</label><input type="text" id="it_barcode" placeholder="مثال: 6221234567890" value="${editing?esc(editing.barcode||''):''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>شد الصنف (عدد القطع بالكرتونة/الشِد)</label><input type="text" id="it_pack" placeholder="مثال: 24 قطعة" value="${editing?esc(editing.packSize||''):''}"></div>
        <div class="field"><label>وحدة القياس</label><input type="text" id="it_unit" placeholder="مثال: كرتونة" value="${editing?esc(editing.unit||''):''}"></div>
      </div>
      ${this.can('finance.edit')? `<div class="field"><label>تكلفة الوحدة (اختياري — تُستخدم في تقارير التكاليف والخسائر)</label><input type="number" min="0" step="any" id="it_cost" value="${editing&&editing.cost?editing.cost:''}"></div>`
        : (this.can('finance.view') ? `<div class="field"><label>تكلفة الوحدة</label><input type="text" value="${editing&&editing.cost?fmtNum(editing.cost):'—'}" disabled></div>` : '')}

        <button class="btn" onclick="App.closeModal()">إلغاء</button>

  },
  saveItem(id){
    const name=document.getElementById('it_name').value.trim();
    const code=document.getElementById('it_code').value.trim();
    const barcode=document.getElementById('it_barcode').value.trim();
    const packSize=document.getElementById('it_pack').value.trim();
    const unit=document.getElementById('it_unit').value.trim();
    const costEl = document.getElementById('it_cost');
    if(!name){this.notify('اكتب اسم الصنف.');return;}
    if(id){
      const it = this.db.items.find(i=>i.id===id);
      Object.assign(it,{name,code,barcode,packSize,unit});
      if(costEl) it.cost = parseFloat(costEl.value)||0;
      this.logActivity(`عدّل صنف: ${name}`);
    } else {
      this.db.items.push({id:uid(),name,code,barcode,packSize,unit,cost: costEl?(parseFloat(costEl.value)||0):0});
      this.logActivity(`أضاف صنف جديد: ${name}`);
    }
    this.closeModal(); this.refresh();
  },
  deleteItem(id){
    this.confirmAction('حذف هذا الصنف؟ لن يتم حذف المرتجعات المسجلة به.', ()=>{
      const it = this.db.items.find(i=>i.id===id);
      this.db.items=this.db.items.filter(i=>i.id!==id);
      this.db.stock=this.db.stock.filter(s=>s.itemId!==id);
      this.logActivity(`حذف صنف: ${it?it.name:id}`);
      this.refresh();
    });
  },

  /* ---------------- INVENTORY (current stock quantity per item per location) ---------------- */
  renderInventory(){
    const d = this.db;
    const u = this.currentUser();
    const admin = this.isAdmin();
    const f = this.inventoryFilter;

    let locType = f.locType;
    if(!admin && locType==='warehouse' && !u.warehouseId) locType = 'store';

    const availableStores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const availableWarehouses = admin ? d.warehouses : (u.warehouseId ? d.warehouses.filter(w=>w.id===u.warehouseId) : []);
    const locOptions = locType==='store' ? availableStores : availableWarehouses;

    let locId = f.locId;
    if(!locId || !locOptions.find(o=>o.id===locId)) locId = locOptions[0] ? locOptions[0].id : '';
    f.locType = locType; f.locId = locId;

    let items = d.items.slice();
    if(f.q){
      const q = f.q.trim().toLowerCase();
      items = items.filter(it=>(it.name||'').toLowerCase().includes(q) || (it.code||'').toLowerCase().includes(q) || (it.barcode||'').toLowerCase().includes(q));
    }

    return `
      <div class="section-head"><h3>المخزون</h3></div>
      <div class="filters card" style="margin-bottom:14px;">
        <div class="field">
          <label>نوع الموقع</label>
          <select onchange="App.inventoryFilter.locType=this.value;App.inventoryFilter.locId='';App.render()">
            <option value="store" ${locType==='store'?'selected':''}>محل</option>
            ${(admin || u.warehouseId) ? `<option value="warehouse" ${locType==='warehouse'?'selected':''}>مستودع</option>` : ''}
          </select>
        </div>
        <div class="field">
          <label>${locType==='store'?'المحل':'المستودع'}</label>
          <select onchange="App.inventoryFilter.locId=this.value;App.render()">
            ${locOptions.length===0? `<option value="">لا يوجد</option>` : locOptions.map(o=>`<option value="${o.id}" ${locId===o.id?'selected':''}>${o.code?'['+esc(o.code)+'] ':''}${esc(o.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:2;min-width:220px;">
          <label>بحث بالاسم أو الكود أو الباركود</label>
          <input type="text" value="${esc(f.q)}" oninput="App.inventoryFilter.q=this.value;App.render()">
        </div>
      </div>
      ${!locId ? `<div class="empty">${locType==='store'?'أضف محل واحد على الأقل أولًا':'لا يوجد مستودع مرتبط بحسابك'}</div>` : `
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>اسم الصنف</th><th>الكود</th><th>الوحدة</th><th>الكمية الحالية</th>${this.can('inventory.edit')?'<th></th>':''}
      </tr></thead><tbody>
      ${items.length===0? `<tr><td colspan="5"><div class="empty small">لا توجد أصناف</div></td></tr>` :
      items.map(it=>{
        const qty = this.getStock(it.id, locType, locId);
        return `<tr>
          <td>${esc(it.name)}</td>
          <td>${esc(it.code||'—')}</td>
          <td>${esc(it.unit||'—')}</td>
          <td>${qty<0?'<span style="color:var(--bad);">'+fmtNum(qty)+'</span>':fmtNum(qty)}</td>
          ${this.can('inventory.edit')?`<td><button class="icon-btn" onclick="App.openStockAdjustForm('${it.id}','${locType}','${locId}')">✎ تعديل الرصيد</button></td>`:''}
        </tr>`;
      }).join('')}
      </tbody></table></div>
      <div class="help-box" style="margin-top:14px;">الأرصدة بتتحدث تلقائيًا مع كل مرتجع (بينقص من المحل ويزيد في المستودع) وكل طلبية (بيزيد في المحل وينقص من المستودع). لو صنف جديد أو الرصيد مش مطابق للواقع، استخدم "تعديل الرصيد" لضبطه يدويًا.</div>
      `}
    `;
  },
  openStockAdjustForm(itemId, locType, locId){
    const it = this.db.items.find(i=>i.id===itemId);
    const current = this.getStock(itemId, locType, locId);
    const locName = locType==='store' ? this.storeName(locId) : this.whName(locId);
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>تعديل رصيد المخزون</h3>
      <div class="help-box" style="margin-bottom:14px;">الصنف: <b>${esc(it?it.name:'')}</b> — الموقع: <b>${esc(locName||'—')}</b></div>
      <div class="field"><label>الكمية الحالية الصحيحة</label><input type="number" step="any" id="stk_qty" value="${current}"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.saveStockAdjust('${itemId}','${locType}','${locId}')">حفظ</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>`);
  },
  saveStockAdjust(itemId, locType, locId){
    const val = parseFloat(document.getElementById('stk_qty').value);
    if(isNaN(val)){ this.notify('اكتب رقمًا صحيحًا.'); return; }
    this.setStock(itemId, locType, locId, val);
    const locName = locType==='store' ? this.storeName(locId) : this.whName(locId);
    this.logActivity(`عدّل رصيد مخزون: ${this.itemName(itemId)} في ${locName||'—'} إلى ${fmtNum(val)}`);
    this.closeModal();
    this.refresh();
  },

  /* ---------------- EXPORT REGISTERED ITEMS TO EXCEL ---------------- */
  exportItemsExcel(){
    const d = this.db;
    const f = this.itemsFilter;
    let rows = d.items.slice();
    if(f.q){
      const q=f.q.trim().toLowerCase();
      rows = rows.filter(it=>
        (it.name||'').toLowerCase().includes(q) ||
        (it.code||'').toLowerCase().includes(q) ||
        (it.barcode||'').toLowerCase().includes(q)
      );
    }
    if(f.unit) rows = rows.filter(it=>(it.unit||'')===f.unit);
    const wsData = [
      ['اسم الصنف','رمز الصنف','الباركود','شد الصنف','الوحدة'],

    ];
    this.exportXLSXMultiSheet([
      {name:'معلومات السحب', rows: this.reportPullStampRows('قائمة الأصناف المسجلة')},
      {name:'الأصناف', rows: wsData},
    ], 'الأصناف_المسجلة.xlsx');
  },

  /* ---------------- BULK IMPORT ITEMS FROM EXCEL ---------------- */
  downloadItemsTemplate(){
    const wsData = [
      ['اسم الصنف','رمز الصنف','الباركود','شد الصنف','الوحدة'],
      ['بسكويت شوكولاتة 200جم','IT-1001','6221234567890','24 قطعة','كرتونة'],
      ['عصير مانجو 1 لتر','IT-1002','6229876543210','12 قطعة','كرتونة'],
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:32},{wch:14},{wch:18},{wch:16},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الأصناف');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    this.saveFile('نموذج_استيراد_الأصناف.xlsx', blob);
  },

  openImportItems(){
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>استيراد الأصناف من إكسيل</h3>
      <div class="help-box" style="margin-bottom:14px;">
        رتّب الملف بالأعمدة دي بالترتيب: <b>اسم الصنف</b> — <b>رمز الصنف</b> — <b>الباركود</b> — <b>شد الصنف</b> — <b>الوحدة</b>.
        الاسم فقط إجباري والباقي اختياري. أول صف عناوين هيتجاهله البرنامج تلقائيًا.
        لو الصنف موجود بنفس الباركود أو نفس الاسم هيتم تجاهله عشان منكررش الأصناف.
      </div>
      <button class="btn btn-sm" onclick="App.downloadItemsTemplate()" style="margin-bottom:14px;">⬇ تنزيل نموذج إكسيل فارغ</button>
      <div class="field">
        <label>اختر ملف إكسيل (xlsx / xls / csv)</label>
        <input type="file" id="itemsFile" accept=".xlsx,.xls,.csv">
      </div>
      <div id="importResult" class="small muted"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.processItemsFile()">استيراد الأصناف</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
  },

  processItemsFile(){
    const input = document.getElementById('itemsFile');
    const resultBox = document.getElementById('importResult');
    if(!input.files || !input.files[0]){ resultBox.textContent = 'اختر ملف أولًا.'; return; }
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});

        const headerWords = ['اسم الصنف','الصنف','item','name','اسم المنتج'];
        let startIdx = 0;
        if(rows.length && String(rows[0][0]||'').trim() && headerWords.some(w=>String(rows[0][0]).trim().toLowerCase().includes(w))){
          startIdx = 1;
        }

        const existingNames = new Set(this.db.items.map(i=>i.name.trim().toLowerCase()));
        const existingBarcodes = new Set(this.db.items.map(i=>(i.barcode||'').trim()).filter(Boolean));
        let added=0, skippedDup=0, skippedEmpty=0;
        for(let i=startIdx;i<rows.length;i++){
          const row = rows[i];
          if(!row) continue;
          const name = String(row[0]||'').trim();
          const code = String(row[1]||'').trim();
          const barcode = String(row[2]||'').trim();
          const packSize = String(row[3]||'').trim();
          const unit = String(row[4]||'').trim();
          if(!name){ skippedEmpty++; continue; }
          const key = name.toLowerCase();
          if(existingNames.has(key) || (barcode && existingBarcodes.has(barcode))){ skippedDup++; continue; }
          this.db.items.push({id:uid(), name, code, barcode, packSize, unit});
          existingNames.add(key);
          if(barcode) existingBarcodes.add(barcode);
          added++;
        }
        saveData(this.db);
        resultBox.innerHTML = `تم استيراد <b>${fmtNum(added)}</b> صنف جديد.` +
          (skippedDup? ` — تم تجاهل ${fmtNum(skippedDup)} لأنه مكرر (بالاسم أو الباركود).`:'') +
          (skippedEmpty? ` — تم تجاهل ${fmtNum(skippedEmpty)} صف فارغ.`:'');
        this.render();
        setTimeout(()=>{ this.closeModal(); }, 1800);
      }catch(err){
        console.error(err);
        resultBox.textContent = 'تعذّرت قراءة الملف. تأكد أنه بصيغة xlsx أو xls أو csv صحيحة.';
      }
    };
    reader.readAsArrayBuffer(file);
  },

  /* short readable summary chips of an actual permissions object — used on
     both the job-titles table and the users table, so admins can see at a
     glance exactly what a job template OR a specific user is allowed to do,
     instead of a generic "مستخدم محل" label */
  permsSummaryHtml(perms){
    if(!perms) return '<span class="muted small">لا يوجد</span>';
    const chips=[];
    if(perms.returns && perms.returns.view) chips.push('مرتجعات: '+['عرض',perms.returns.add&&'إضافة',perms.returns.edit&&'تعديل',perms.returns.delete&&'حذف'].filter(Boolean).join('/'));
    if(perms.orders && perms.orders.view) chips.push('طلبيات: '+['عرض',perms.orders.add&&'إضافة',perms.orders.edit&&'تعديل',perms.orders.delete&&'حذف'].filter(Boolean).join('/'));
    if(perms.reports && perms.reports.view) chips.push('التقارير');
    if(perms.items && perms.items.edit) chips.push('إدارة الأصناف');
    else if(perms.items && perms.items.view) chips.push('عرض الأصناف');
    if(perms.inventory && perms.inventory.edit) chips.push('تعديل المخزون');
    else if(perms.inventory && perms.inventory.view) chips.push('عرض المخزون');
    if(perms.stores && perms.stores.edit) chips.push('إدارة المحلات');
    else if(perms.stores && perms.stores.view) chips.push('عرض المحلات');
    if(perms.warehouses && perms.warehouses.edit) chips.push('إدارة المستودعات');
    else if(perms.warehouses && perms.warehouses.view) chips.push('عرض المستودعات');
    if(perms.links && perms.links.edit) chips.push('ربط محل/مستودع');
    else if(perms.links && perms.links.view) chips.push('عرض الربط');
    if(perms.finance && perms.finance.edit) chips.push('التكاليف والمالية');
    else if(perms.finance && perms.finance.view) chips.push('عرض المالية');
    return chips.length? chips.map(c=>`<span class="tag" style="margin-inline-end:4px;">${esc(c)}</span>`).join('') : '<span class="muted small">عرض المرتجعات فقط</span>';

  saveUser(id){
    const name=document.getElementById('u_name').value.trim();
    const username=document.getElementById('u_username').value.trim();
    const pass=document.getElementById('u_pass').value;
    const roleVal=document.getElementById('u_role').value;
    const role = roleVal==='admin' ? 'admin' : 'store';
    const email=document.getElementById('u_email').value.trim();
    const phone=document.getElementById('u_phone').value.trim();
    const storeId=role==='admin'?null:(document.getElementById('u_store').value||null);
    const warehouseId=role==='admin'?null:(document.getElementById('u_warehouse').value||null);
    if(!username){this.notify('اكتب اسم مستخدم.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){this.notify('البريد الإلكتروني إلزامي ولازم يكون بصيغة صحيحة — بيُستخدم لإرسال رمز التحقق عند تسجيل الدخول.');return;}
    if(role==='store' && !storeId && !warehouseId){this.notify('اختر المحل أو المستودع المرتبط بهذا المستخدم (لازم واحد منهم على الأقل).');return;}
    const dupe = this.db.users.find(u=>u.username===username && u.id!==id);
    if(dupe){this.notify('اسم المستخدم موجود بالفعل، اختر اسمًا آخر.');return;}
    if(pass && !this.passwordMeetsPolicy(pass)){
      this.notify('كلمة المرور لازم تحقق كل شروط الأمان الموضّحة بالعلامات تحت الحقل (لازم تبقى كلها ✓).');
      return;
    }
    // never allow removing the last remaining admin account — that would lock everyone out
    if(id && role!=='admin'){
      const existing = this.db.users.find(x=>x.id===id);
      if(existing && existing.role==='admin'){
        const otherAdmins = this.db.users.filter(x=>x.role==='admin' && x.id!==id).length;
        if(otherAdmins===0){
          this.notify('لا يمكن تحويل هذا الحساب لمستخدم محل لأنه المدير العام الوحيد المتبقي في النظام. أضف مديرًا آخر أولًا.');
          return;
        }
      }
    }

    let jobId=null, jobTitle='', permissions=null;
    if(role==='store'){
      jobId = document.getElementById('u_job').value || null;
      jobTitle = jobId ? this.jobName(jobId) : '';
      permissions = this.readPermsCheckboxes();
    }

    if(id){
      const u = this.db.users.find(x=>x.id===id);
      Object.assign(u,{name,username,role,storeId,warehouseId,jobId,jobTitle,email,phone,permissions:role==='store'?permissions:null});
      if(pass) u.password=pass;
      this.logActivity(`عدّل بيانات مستخدم "${username}"${pass?' (وغيّر كلمة المرور)':''}`);
    }else{
      if(!pass){this.notify('اكتب كلمة مرور للمستخدم الجديد.');return;}
      this.db.users.push({id:uid(),name,username,password:pass,role,storeId,warehouseId,jobId,jobTitle,email,phone,permissions});
      this.logActivity(`أضاف مستخدم جديد "${username}"`);
    }
    this.closeModal(); this.refresh(); this.buildNav();
  },
  deleteUser(id){
    const target = this.db.users.find(u=>u.id===id);
    if(target && target.role==='admin'){
      const otherAdmins = this.db.users.filter(x=>x.role==='admin' && x.id!==id).length;
      if(otherAdmins===0){
        this.notify('لا يمكن حذف هذا الحساب لأنه المدير العام الوحيد المتبقي في النظام. أضف مديرًا آخر أولًا.');
        return;
      }
    }
    this.confirmAction('حذف هذا المستخدم؟', ()=>{
      this.db.users=this.db.users.filter(u=>u.id!==id);
      this.logActivity(`حذف مستخدم "${target?target.username:''}"`);
      this.refresh();
    });
  },

  /* ---------------- SELF-SERVICE: change my own username / password ---------------- */
  /* ---------------- PASSWORD STRENGTH POLICY ----------------
     Configurable by the owner from الإعدادات (db.settings.passwordPolicy);
     falls back to DEFAULT_PASSWORD_POLICY when nothing's been customized. */
  passwordRules(){
    const p = (this.db.settings && this.db.settings.passwordPolicy) || DEFAULT_PASSWORD_POLICY;
    const rules = [{key:'length', label:`${p.minLength||8} أحرف على الأقل`, test: v=>v.length>=(p.minLength||8)}];
    if(p.requireUpper) rules.push({key:'upper', label:'حرف كبير واحد على الأقل (A-Z)', test: v=>/[A-Z]/.test(v)});
    if(p.requireLower) rules.push({key:'lower', label:'حرف صغير واحد على الأقل (a-z)', test: v=>/[a-z]/.test(v)});
    if(p.requireNumber) rules.push({key:'number', label:'رقم واحد على الأقل (0-9)', test: v=>/[0-9]/.test(v)});
    if(p.requireSymbol) rules.push({key:'symbol', label:'رمز خاص واحد على الأقل (!@#$%^&* ...)', test: v=>/[^A-Za-z0-9]/.test(v)});
    return rules;
  },
  passwordChecklistHtml(prefix){
    return `<div class="help-box" id="${prefix}_checklist" style="margin-top:6px;line-height:1.9;">
      ${this.passwordRules().map(r=>`<div data-rule="${r.key}" style="color:var(--bad);">✗ ${esc(r.label)}</div>`).join('')}
    </div>`;
  },
  updatePasswordChecklist(prefix, value){
    const box = document.getElementById(prefix+'_checklist');
    if(!box) return;
    value = value || '';
    this.passwordRules().forEach(r=>{
      const el = box.querySelector(`[data-rule="${r.key}"]`);
      if(!el) return;
      const ok = r.test(value);
      el.style.color = ok ? 'var(--good)' : 'var(--bad)';
      el.textContent = (ok?'✓ ':'✗ ') + r.label;
    });
  },
  passwordMeetsPolicy(value){
    return this.passwordRules().every(r=>r.test(value||''));
  },

  saveMyAccount(){
    const u = this.currentUser();
    const resultBox = document.getElementById('myAccountResult');
    const current = document.getElementById('ma_current').value;
    const newUsername = document.getElementById('ma_username').value.trim();
    const email = document.getElementById('ma_email').value.trim();
    const phone = document.getElementById('ma_phone').value.trim();
    const pass1 = document.getElementById('ma_pass1').value;
    const pass2 = document.getElementById('ma_pass2').value;

    if(!current || current !== u.password){
      resultBox.textContent = 'كلمة المرور الحالية غير صحيحة.';
      return;
    }
    if(!newUsername){
      resultBox.textContent = 'اكتب اسم مستخدم.';
      return;
    }
    const dupe = this.db.users.find(x=>x.username===newUsername && x.id!==u.id);
    if(dupe){ resultBox.textContent = 'اسم المستخدم ده مستخدم بالفعل من حد تاني، اختار اسم مختلف.'; return; }
    if(pass1 || pass2){
      if(pass1 !== pass2){ resultBox.textContent = 'كلمة المرور الجديدة وتأكيدها غير متطابقين.'; return; }
      if(!this.passwordMeetsPolicy(pass1)){ resultBox.textContent = 'كلمة المرور الجديدة لازم تحقق كل شروط الأمان الموضّحة بالعلامات فوق (لازم تبقى كلها ✓ باللون الأخضر).'; return; }
    }

    u.username = newUsername;
    u.email = email;
    u.phone = phone;
    if(pass1) u.password = pass1;

    this.closeModal();
    this.refresh();
    this.buildNav();
    this.notify('تم تحديث بياناتك بنجاح.');
  },

  verifyForgotPassword(){
    const username = document.getElementById('fp_username').value.trim();
    const contact = document.getElementById('fp_contact').value.trim().toLowerCase();
    const resultBox = document.getElementById('fpStep1Result');
    if(!username || !contact){ resultBox.textContent = 'اكتب اسم المستخدم والبريد/الجوال المسجّل.'; return; }
    const user = this.db.users.find(u=>u.username===username);
    if(!user){ resultBox.textContent = 'اسم المستخدم غير موجود.'; return; }
    const email = (user.email||'').trim().toLowerCase();
    const phone = (user.phone||'').trim().toLowerCase();
    if(!email && !phone){
      resultBox.textContent = 'لا يوجد بريد إلكتروني أو رقم جوال مسجّل على هذا الحساب. تواصل مع مدير النظام لإعادة تعيين كلمة المرور يدويًا من صفحة المستخدمين.';
      return;
    }
    if(contact!==email && contact!==phone){
      resultBox.textContent = 'البيانات غير متطابقة مع البريد/الجوال المسجّل على هذا الحساب.';
      return;
    }
    this.openResetPasswordForm(user.id);
  },

          <input type="password" id="fp_pass1" autocomplete="new-password" oninput="App.updatePasswordChecklist('fp_pass1', this.value)">
        </div>
        <div class="field"><label>تأكيد كلمة المرور</label><input type="password" id="fp_pass2" autocomplete="new-password"></div>
      </div>
      ${this.passwordChecklistHtml('fp_pass1')}
      <div id="fpStep2Result" class="small" style="color:var(--bad);margin-top:8px;"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" onclick="App.finishResetPassword('${userId}')">حفظ كلمة المرور</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>`);
  },
  finishResetPassword(userId){
    const pass1 = document.getElementById('fp_pass1').value;
    const pass2 = document.getElementById('fp_pass2').value;
    const resultBox = document.getElementById('fpStep2Result');
    if(pass1 !== pass2){ resultBox.textContent = 'كلمتا المرور غير متطابقتين.'; return; }
    if(!this.passwordMeetsPolicy(pass1)){ resultBox.textContent = 'كلمة المرور لازم تحقق كل شروط الأمان الموضّحة فوق (لازم تبقى كلها ✓ باللون الأخضر).'; return; }
    const user = this.db.users.find(u=>u.id===userId);
    if(!user){ this.closeModal(); return; }
    user.password = pass1;
    saveData(this.db);
    this.closeModal();
    this.notify('تم تغيير كلمة المرور بنجاح. سجّل الدخول بكلمة المرور الجديدة.');
  },

  /* ---------------- COSTS & LOSSES (financial value of returns by reason / resolution) ---------------- */
  rp_costs:{storeId:'', from:'', to:''},
  resetCostsFilter(){
    const u = this.currentUser();
    this.rp_costs = { storeId: this.isAdmin() ? '' : (u.storeId||''), from:'', to:'' };
    this.reReport();
  },
  reportCostsAndLosses(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_costs;
    if(!this.isAdmin() && !st.storeId) st.storeId = u.storeId;

    let rows = this.isAdmin() ? d.returns.slice() : d.returns.filter(r=>r.storeId===u.storeId);
    if(st.storeId) rows = rows.filter(r=>r.storeId===st.storeId);
    if(st.from) rows = rows.filter(r=>r.date>=st.from);
    if(st.to) rows = rows.filter(r=>r.date<=st.to);

    const withValue = rows.map(r=>{
      const it = d.items.find(i=>i.id===r.itemId);
      const cost = it ? Number(it.cost||0) : 0;
      return { ...r, value: Number(r.qty||0) * cost };
    });
    const totalQty = withValue.reduce((a,r)=>a+Number(r.qty||0),0);
    const totalValue = withValue.reduce((a,r)=>a+r.value,0);
    const pct = v => totalValue>0 ? (v/totalValue*100) : 0;

    const groupBy = (keyFn) => {
      const g = {};
      withValue.forEach(r=>{
        const k = keyFn(r) || '—';
        if(!g[k]) g[k] = {qty:0, value:0};
        g[k].qty += Number(r.qty||0);
        g[k].value += r.value;
      });
      return Object.entries(g).sort((a,b)=>b[1].value-a[1].value);
    };
    const byReason = groupBy(r=>r.reason);
    const byResolution = groupBy(r=>r.resolution||'معلّق');

    const tableHtml = (title, entries) => `
      <h4 style="margin-bottom:8px;">${title}</h4>
      <div class="tbl-wrap" style="margin-bottom:20px;"><table class="tbl"><thead><tr>
        <th>البند</th><th>الكمية</th><th>القيمة المالية</th><th>% من إجمالي الخسارة</th>
      </tr></thead><tbody>
      ${entries.length===0? `<tr><td colspan="4"><div class="empty small">لا توجد بيانات في هذه الفترة</div></td></tr>` :
      entries.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v.qty)}</td><td>${fmtNum(v.value.toFixed(2))}</td><td>${pct(v.value).toFixed(1)}%</td></tr>`).join('')}
      </tbody></table></div>
    `;

    return `
      <div class="filters card" style="margin-bottom:14px;">
        ${this.isAdmin()? `<div class="field"><label>المحل</label><select onchange="App.rp_costs.storeId=this.value;App.reReport()">
          <option value="">كل المحلات</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : ''}
        <div class="field"><label>من تاريخ</label><input type="date" value="${st.from}" onchange="App.rp_costs.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${st.to}" onchange="App.rp_costs.to=this.value;App.reReport()"></div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.resetCostsFilter()">تصفية جديدة</button></div>
      </div>

      <div class="grid grid-2" style="margin-bottom:16px;">
        <div class="card" style="padding:14px;"><div class="muted small">إجمالي كمية المرتجعات في الفترة</div><div style="font-size:22px;font-weight:700;">${fmtNum(totalQty)}</div></div>
        <div class="card" style="padding:14px;"><div class="muted small">إجمالي القيمة المالية (التكلفة × الكمية)</div><div style="font-size:22px;font-weight:700;">${fmtNum(totalValue.toFixed(2))}</div></div>
      </div>

      ${tableHtml('حسب سبب المرتجع', byReason)}
      ${tableHtml('حسب طريقة العلاج', byResolution)}

      <div class="help-box">القيم المالية محسوبة من تكلفة الوحدة المسجّلة لكل صنف في صفحة "الأصناف". أي صنف بدون تكلفة مسجّلة (أو تكلفته صفر) هتظهر قيمته المالية هنا صفر حتى لو له كمية مرتجعة.</div>
    `;
  },

  /* ---------------- ITEM LOOKUP (search by barcode / code / name / transfer no.) ---------------- */
  rp_lookup:{query:'', itemId:''},
  reportItemLookup(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_lookup;
    const q = st.query.trim().toLowerCase();

    // if the query matches a transfer number, jump straight to that return's item
    if(q && !st.itemId){
      const scopedAll = this.isAdmin()? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
      const byTransfer = scopedAll.find(r=>(r.transferNo||'').toLowerCase()===q);
      if(byTransfer){ st.itemId = byTransfer.itemId; }
    }

    let matches = [];
    if(q && !st.itemId){
      matches = d.items.filter(it=>
        (it.barcode||'').toLowerCase().includes(q) ||
        (it.code||'').toLowerCase().includes(q) ||
        (it.name||'').toLowerCase().includes(q)
      ).slice(0,8);
    }

    let historyHtml = '';
    if(st.itemId){
      const it = d.items.find(i=>i.id===st.itemId);
      const scoped = this.isAdmin()? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
      const rows = scoped.filter(r=>r.itemId===st.itemId).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
      const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);

      const byStoreMap={}, byMonthMap={}, byReasonMap={};
      rows.forEach(r=>{
        const sKey=r.storeId;
        byStoreMap[sKey] = byStoreMap[sKey] || {count:0, qty:0};
        byStoreMap[sKey].count++; byStoreMap[sKey].qty += Number(r.qty||0);

        const mKey = r.date.slice(0,7);
        byMonthMap[mKey] = byMonthMap[mKey] || {count:0, qty:0};
        byMonthMap[mKey].count++; byMonthMap[mKey].qty += Number(r.qty||0);

        byReasonMap[r.reason] = (byReasonMap[r.reason]||0) + Number(r.qty||0);
      });
      const byStore = Object.entries(byStoreMap).sort((a,b)=>b[1].count-a[1].count);
      const byMonth = Object.entries(byMonthMap).sort((a,b)=>b[0].localeCompare(a[0]));
      const byReason = Object.entries(byReasonMap).sort((a,b)=>b[1]-a[1]);

      historyHtml = `
        <div class="card" style="margin-top:14px;">
          <div class="section-head">
            <h3>${esc(it?it.name:'—')} <span class="muted small">${it&&it.code?`— رمز: ${esc(it.code)}`:''} ${it&&it.barcode?`— باركود: ${esc(it.barcode)}`:''}</span></h3>
            <div class="actions"><button class="btn btn-sm" onclick="App.rp_lookup={query:'',itemId:''};App.reReport()">🔎 بحث عن صنف تاني</button></div>
          </div>
          <div class="grid grid-4">
            <div class="stat accent"><div class="n">${fmtNum(rows.length)}</div><div class="l">إجمالي عدد مرات الترجيع</div></div>
            <div class="stat"><div class="n">${fmtNum(totalQty)}</div><div class="l">إجمالي الكمية المرتجعة</div></div>
            <div class="stat"><div class="n">${fmtNum(byStore.length)}</div><div class="l">عدد الفروع التي رجّعت الصنف</div></div>
            <div class="stat"><div class="n">${esc((it&&it.packSize)||'—')}</div><div class="l">شد الصنف</div></div>
          </div>

          <div class="grid grid-2" style="margin-top:14px;align-items:start;">
            <div class="card">
              <div class="section-head"><h3>حسب الفرع</h3></div>
              <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفرع</th><th>عدد المرات</th><th>الكمية</th></tr></thead><tbody>
                ${byStore.map(([sid,info])=>`<tr><td>${esc(this.storeName(sid)||'—')}</td><td>${fmtNum(info.count)}</td><td>${fmtNum(info.qty)}</td></tr>`).join('')}
              </tbody></table></div>
            </div>
            <div class="card">
              <div class="section-head"><h3>حسب السبب</h3></div>
              <div class="tbl-wrap"><table class="tbl"><thead><tr><th>السبب</th><th>الكمية</th></tr></thead><tbody>
                ${byReason.map(([r,q2])=>`<tr><td>${esc(r)}</td><td>${fmtNum(q2)}</td></tr>`).join('')}
              </tbody></table></div>
            </div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="section-head"><h3>عدد مرات الترجيع شهريًا</h3></div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th>عدد المرات</th><th>الكمية</th></tr></thead><tbody>
              ${byMonth.map(([m,info])=>`<tr><td>${esc(m)}</td><td>${fmtNum(info.count)}</td><td>${fmtNum(info.qty)}</td></tr>`).join('')}
            </tbody></table></div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="section-head"><h3>كل عملية ترجيع لهذا الصنف منذ أول تسجيل (${fmtNum(rows.length)})</h3>
              <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportItemLookupRows(),'سجل_صنف_'+App.itemName('${st.itemId}'))">تصدير CSV</button></div>
            </div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr>
              <th>التاريخ</th><th>الوقت</th><th>الفرع</th><th>الكمية</th><th>رقم تحويل المرتجع</th><th>السبب</th><th>تاريخ الصلاحية</th><th>المستودع</th>
            </tr></thead><tbody>
              ${rows.length===0? `<tr><td colspan="8"><div class="empty">لا توجد مرتجعات مسجلة لهذا الصنف</div></td></tr>` :
              rows.map(r=>`<tr>
                <td>${esc(r.date)}</td><td>${esc(r.time||'—')}</td><td>${esc(this.storeName(r.storeId)||'—')}</td>
                <td>${fmtNum(r.qty)} ${esc(this.returnUnit(r))}</td><td><b>${esc(r.transferNo||'—')}</b></td>
                <td>${esc(r.reason)}</td><td>${r.expiry?esc(r.expiry):'—'}</td><td>${esc(this.whName(r.warehouseId))}</td>
              </tr>`).join('')}
            </tbody></table></div>
          </div>
        </div>
      `;
    }

    return `
      <div class="card">
        <div class="field">
          <label>ابحث بالباركود، رمز الصنف، اسم الصنف، أو رقم المرتجع/التحويل</label>
          <input type="text" id="lookupSearchInput" placeholder="امسح الباركود أو اكتب هنا..." value="${esc(st.query)}" oninput="App.rp_lookup.query=this.value;App.rp_lookup.itemId='';App.reReport()">
        </div>
        ${matches.length? `
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
          ${matches.map(it=>`
            <button type="button" class="btn" style="justify-content:space-between;text-align:right;" onclick="App.rp_lookup.itemId='${it.id}';App.reReport()">
              <span>${esc(it.name)}</span>
              <span class="muted small">${it.code?`رمز: ${esc(it.code)} `:''}${it.barcode?`— باركود: ${esc(it.barcode)}`:''}</span>
            </button>
          `).join('')}
        </div>` : (q && !st.itemId ? `<div class="empty small" style="margin-top:10px;">لا توجد أصناف أو مرتجعات مطابقة</div>` : '')}
      </div>
      ${historyHtml}
    `;
  },
  exportItemLookupRows(){
    const d=this.db, u=this.currentUser();
    const scoped = this.isAdmin()? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
    const rows = scoped.filter(r=>r.itemId===this.rp_lookup.itemId).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
    return [['التاريخ','الوقت','الفرع','الكمية','الوحدة','رقم تحويل المرتجع','السبب','تاريخ الصلاحية','المستودع'],
      ...rows.map(r=>[r.date,r.time,this.storeName(r.storeId),r.qty,this.returnUnit(r),r.transferNo,r.reason,r.expiry,this.whName(r.warehouseId)])];
  },

  /* ---------------- CUSTOM FULL REPORT (period + branch, PDF/Excel) ---------------- */
  rp_custom:{storeId:'', itemId:'', from:'', to:''},
  computeCustomReportData(){
    const d=this.db; const u=this.currentUser();
    const st=this.rp_custom;
    const scoped = this.isAdmin()? d.returns.slice() : d.returns.filter(r=>r.storeId===u.storeId);
    let rows = scoped.filter(r=> r.date>=st.from && r.date<=st.to);
    if(st.storeId) rows = rows.filter(r=>r.storeId===st.storeId);
    if(st.itemId) rows = rows.filter(r=>r.itemId===st.itemId);
    rows.sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const byItemMap={}, byReasonMap={}, byStoreMap={};
    rows.forEach(r=>{
      byItemMap[r.itemId]=(byItemMap[r.itemId]||0)+Number(r.qty||0);
      byReasonMap[r.reason]=(byReasonMap[r.reason]||0)+Number(r.qty||0);
      byStoreMap[r.storeId]=(byStoreMap[r.storeId]||0)+Number(r.qty||0);
    });
    const byItem = Object.entries(byItemMap).sort((a,b)=>b[1]-a[1]);
    const byReason = Object.entries(byReasonMap).sort((a,b)=>b[1]-a[1]);
    const byStoreEntries = Object.entries(byStoreMap).sort((a,b)=>b[1]-a[1]);
    const showByStore = !st.storeId && byStoreEntries.length>1;

    return {
      rows,
      kpis:{ totalQty, totalOps: rows.length, itemCount: byItem.length },
      byItem, byReason,
      byStore: showByStore? byStoreEntries : null,
      meta:{
        storeLabel: st.storeId? (this.storeName(st.storeId)||'—') : 'كل الفروع',
        from: st.from, to: st.to,
      }
    };
  },
  reportMeta(data){
    const d=this.db, u=this.currentUser();
    const st=this.rp_custom;
    const settings = d.settings || {companyName:'', logo:''};
    const preparedBy = u.name || u.username;
    const now = new Date();
    const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const scopeText = st.storeId ? `لفرع "${esc(data.meta.storeLabel)}"` : 'على مستوى كل الفروع';
    const itemScopeText = st.itemId ? ` — مقتصر على صنف "${esc(this.itemName(st.itemId)||'')}"` : '';
    return {settings, preparedBy, stamp, scopeText, itemScopeText};
  },

            ${data.byItem.map(([iid,q])=>`<tr><td>${esc(this.itemName(iid)||'—')}</td><td>${fmtNum(q)}</td></tr>`).join('')}

            ${data.byReason.map(([r,q])=>`<tr><td>${esc(r)}</td><td>${fmtNum(q)}</td></tr>`).join('')}
          </tbody></table></div>`:`<div class="empty small">لا توجد بيانات</div>`}

    try{ sizeBytes = new Blob([JSON.stringify(this.db)]).size; }catch(e){ sizeBytes = JSON.stringify(this.db).length; }

            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="pw_requireLower" ${policy.requireLower?'checked':''} onchange="App.savePasswordPolicy()"> حرف صغير إلزامي (a-z)</label>

          <div class="field"><label>Template ID</label><input type="text" id="ej_templateId" value="${esc((settings.emailjs&&settings.emailjs.templateId)||'')}" readonly disabled style="opacity:.65;cursor:not-allowed;"></div>

        ${!this.isEmailJSConfigured()? `<div class="help-box" style="margin-top:10px;">لحد ما تظبط الإعدادات دي، تسجيل الدخول وحذف البيانات هيشتغلوا عادي من غير رمز تحقق — الميزة بس معطّلة مؤقتًا.</div>` : ''}

        <div class="small muted" style="margin-bottom:12px;">تصفير كل بيانات النظام والبدء من جديد. الإجراء ده نهائي ومش هيترجع فيه — نزّل نسخة احتياطية الأول.</div>

  saveReportSettings(){
    if(!this.isOwner()) return;
    const name = document.getElementById('rc_companyName').value.trim();
    this.db.settings = this.db.settings || {companyName:'', logo:''};
    this.db.settings.companyName = name;
    this.logActivity(`عدّل اسم الشركة إلى "${name}"`);
    this.refresh();
  },
  handleLogoUpload(input){
    if(!this.isOwner()) return;
    if(!input.files || !input.files[0]) return;
    const file = input.files[0];
    if(file.size > 800*1024){
      this.notify('الصورة كبيرة، من فضلك اختر شعار أصغر من 800 كيلوبايت.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      this.db.settings = this.db.settings || {companyName:'', logo:''};
      this.db.settings.logo = e.target.result;
      this.logActivity('غيّر شعار الشركة');
      this.refresh();
    };
    reader.readAsDataURL(file);
  },
  clearLogo(){
    if(!this.isOwner()) return;
    this.db.settings = this.db.settings || {companyName:'', logo:''};
    this.db.settings.logo = '';
    this.logActivity('أزال شعار الشركة');
    this.refresh();
  },

  /* ---------------- THEME PICKER ---------------- */
  setTheme(themeId){
    if(!this.isOwner()) return;
    const theme = THEMES.find(t=>t.id===themeId);
    if(!theme) return;
    this.db.settings = this.db.settings || {};
    this.db.settings.themeId = themeId;
    this.applyTheme(themeId);
    this.logActivity(`غيّر ثيم البرنامج إلى "${theme.name}"`);
    this.refresh();
  },

  /* ---------------- CUSTOM REASONS / RESOLUTIONS ---------------- */
  addReason(){
    if(!this.isOwner()) return;
    const input = document.getElementById('newReasonInput');
    const val = (input.value||'').trim();
    if(!val) return;
    const list = this.reasons().slice();
    if(list.includes(val)){ this.notify('السبب ده موجود بالفعل.'); return; }
    list.push(val);
    this.db.settings.reasons = list;
    this.logActivity(`أضاف سبب ترجيع جديد: "${val}"`);
    this.refresh();
  },
  removeReason(i){
    if(!this.isOwner()) return;
    const list = this.reasons().slice();
    const removed = list[i];
    if(list.length<=1){ this.notify('لازم يفضل سبب واحد على الأقل.'); return; }
    list.splice(i,1);
    this.db.settings.reasons = list;
    this.logActivity(`حذف سبب ترجيع: "${removed}"`);
    this.refresh();
  },
  addResolution(){
    if(!this.isOwner()) return;
    const input = document.getElementById('newResolutionInput');
    const val = (input.value||'').trim();
    if(!val) return;
    const list = this.resolutions().slice();
    if(list.includes(val)){ this.notify('طريقة العلاج دي موجودة بالفعل.'); return; }
    list.push(val);
    this.db.settings.resolutions = list;
    this.logActivity(`أضاف طريقة علاج جديدة: "${val}"`);
    this.refresh();
  },
  removeResolution(i){
    if(!this.isOwner()) return;
    const list = this.resolutions().slice();
    const removed = list[i];
    if(list.length<=1){ this.notify('لازم تفضل طريقة علاج واحدة على الأقل.'); return; }
    list.splice(i,1);
    this.db.settings.resolutions = list;
    this.logActivity(`حذف طريقة علاج: "${removed}"`);
    this.refresh();
  },

  /* ---------------- EXPIRY ALERT THRESHOLD ---------------- */
  saveExpiryAlertDays(value){
    if(!this.isOwner()) return;
    let n = parseInt(value,10);
    if(!n || n<1) n = DEFAULT_EXPIRY_ALERT_DAYS;
    this.db.settings.expiryAlertDays = n;
    this.logActivity(`عدّل مدة تنبيه الصلاحية إلى ${n} يوم`);
    this.refresh();
  },

  /* ---------------- PASSWORD POLICY ---------------- */
  savePasswordPolicy(){
    if(!this.isOwner()) return;
    let minLength = parseInt(document.getElementById('pw_minLength').value,10);
    if(!minLength || minLength<4) minLength = 4;
    this.db.settings.passwordPolicy = {
      minLength,
      requireUpper: document.getElementById('pw_requireUpper').checked,
      requireLower: document.getElementById('pw_requireLower').checked,
      requireNumber: document.getElementById('pw_requireNumber').checked,
      requireSymbol: document.getElementById('pw_requireSymbol').checked,
    };

  /* ---------------- BACKUP / RESTORE ---------------- */
  downloadBackup(){
    if(!this.isOwner()) return;
    const stamp = todayStr();
    const blob = new Blob([JSON.stringify(this.db, null, 2)], {type:'application/json'});
    this.saveFile(`نسخة-احتياطية-مرتجعات-${stamp}.json`, blob);
  },
  restoreBackup(input){
    if(!this.isOwner()) return;
    if(!input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ this.notify('الملف مش نسخة احتياطية صالحة (JSON غير صحيح).'); input.value=''; return; }
      if(!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.returns)){
        this.notify('الملف ده مش نسخة احتياطية من نظام المرتجعات.');
        input.value=''; return;
      }
      this.confirmAction('هيتم استبدال كل البيانات الحالية بمحتوى النسخة الاحتياطية دي. متأكد؟', ()=>{
        const prevUsername = (this.currentUser()||{}).username;
        this.db = migrateData(parsed);
        // the logged-in session points at a user id from BEFORE the restore;
        // that id may not exist in the restored data (e.g. right after a
        // full reset, which mints a fresh random id), so re-anchor the
        // session to the same username in the restored data, falling back
        // to the first user rather than leaving a dangling, permission-less session.
        const matched = this.db.users.find(u=>u.username===prevUsername);
        this.session = { userId: (matched||this.db.users[0]).id };
        localStorage.setItem(SESSION_KEY, JSON.stringify(this.session));
        this.applyTheme();
        this.logActivity('استرجع نسخة احتياطية كاملة للبيانات');
        this.refresh();
        this.buildNav();
        this.notify('تم استرجاع النسخة الاحتياطية بنجاح.');
      }, 'استبدال البيانات');
      input.value='';
    };
    reader.readAsText(file);
  },

  /* ---------------- DANGER ZONE: full reset ---------------- */
  openResetConfirm(){
    if(!this.isOwner()) return;
    const me = this.currentUser();
    if(!me.email){ this.notify('لازم يكون عندك بريد إلكتروني مسجّل على حسابك الأول (من "تغيير اسم المستخدم / كلمة المرور") قبل استخدام الحذف.'); return; }
    if(!this.isEmailJSConfigured()){ this.notify('لسه ما ظبطتش إعدادات البريد الإلكتروني (EmailJS) في صفحة الإعدادات — ظبطها الأول عشان تقدر تستخدم الحذف.'); return; }
    this.sendResetCode();
  },
  sendResetCode(){
    // generate a fresh random one-time code each time and email it to the
    // owner's own address — never shown on screen — so deleting everything
    // requires actually reading a real email, not just a fast click-through.
    const me = this.currentUser();
    this._resetCode = String(Math.floor(100000 + Math.random()*900000));
    const masked = me.email.replace(/^(.{2}).*(@.*)$/, (m,a,b)=>a+'***'+b);
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3 style="color:var(--bad);">حذف كل البيانات؟</h3>
      <p>ده هيمسح كل المرتجعات والطلبيات والمخزون والمستخدمين (غير حسابك) نهائيًا، من غير رجعة. نزّل نسخة احتياطية الأول لو مش متأكد.</p>
      <p>بعتنا رمز تحقق من 6 أرقام على بريدك (${esc(masked)}). اكتبه هنا للتأكيد.</p>
      <div class="field"><label>اكتب كود التحقق</label><input type="text" id="resetConfirmInput" placeholder="——————" autocomplete="off" inputmode="numeric"></div>
      <div id="resetConfirmResult" class="small" style="color:var(--bad);"></div>
      <div class="modal-actions">
        <button class="btn" style="background:var(--bad);color:#fff;border-color:var(--bad);" onclick="App.resetAllData()">تأكيد الحذف النهائي</button>
        <button class="btn btn-sm" onclick="App.sendResetCode()">إعادة إرسال الرمز</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
    this.sendVerificationEmail(me.email, this._resetCode, me.name).catch(err=>{
      console.error('reset code email failed', err);
      const resultBox = document.getElementById('resetConfirmResult');
      if(resultBox) resultBox.textContent = 'تعذّر إرسال البريد. تأكد من إعدادات EmailJS في صفحة الإعدادات، أو جرّب "إعادة إرسال الرمز".';
    });
  },
  resetAllData(){
    if(!this.isOwner()) return;
    const val = (document.getElementById('resetConfirmInput').value||'').trim();
    const resultBox = document.getElementById('resetConfirmResult');
    if(!this._resetCode || val!==this._resetCode){ if(resultBox) resultBox.textContent = 'كود التحقق غلط. اكتب الكود اللي اتبعت على بريدك.'; return; }
    this._resetCode = null;
    const me = this.currentUser();
    const fresh = defaultData();
    // keep the owner able to log back in with their current username/password
    // instead of silently switching them to the factory admin/admin123
    fresh.users = [{...fresh.users[0], username: me.username, password: me.password, name: me.name||fresh.users[0].name}];
    fresh.settings.themeId = (this.db.settings&&this.db.settings.themeId) || 'cyan';
    this.db = fresh;
    this.applyTheme();
    this.closeModal();
    this.logActivity('صفّر كل بيانات النظام');

    this.buildNav();
    this.go('dashboard');
    this.notify('تم تصفير كل البيانات والبدء من جديد.');

  exportXLSXMultiSheet(sheets, filename){
    const wb = XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws = XLSX.utils.aoa_to_sheet(s.rows);
      XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31));
    });
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  async exportCustomPDF(mode){
    const statusEl = document.getElementById('customReportStatus');
    if(statusEl) statusEl.textContent = 'جاري تجهيز ملف PDF...';
    const data = this.computeCustomReportData();
    const meta = this.reportMeta(data);
    const sectionHtml = this.buildHeaderHtml(data, meta) + (mode==='detail'? this.buildDetailHtml(data) : this.buildSummaryHtml(data));

    const wrap = document.createElement('div');
    wrap.style.position = 'fixed';
    wrap.style.left = '-10000px';
    wrap.style.top = '0';
    wrap.style.width = '860px';
    wrap.style.background = '#ffffff';
    wrap.style.padding = '20px';
    wrap.innerHTML = sectionHtml;
    document.body.appendChild(wrap);

    try{
      const canvas = await html2canvas(wrap, {scale:2, backgroundColor:'#ffffff', useCORS:true});
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','pt','a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while(heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
      const blob = pdf.output('blob');
      await this.saveFile(this.buildReportFilename(mode, data, 'pdf'), blob);
    }catch(err){
      console.error(err);
      this.notify('تعذّر إنشاء ملف PDF. جرّب مرة أخرى.');
    }finally{
      document.body.removeChild(wrap);
      if(statusEl) statusEl.textContent = '';
    }
  },

  rp_item:{itemId:'', p1from:'', p1to:'', p2from:'', p2to:''},
  reportItemPeriod(){
    const d=this.db; const u=this.currentUser(); const scoped = this.isAdmin()? d.returns : d.returns.filter(r=>r.storeId===u.storeId);
    const st = this.rp_item;
    // default period1 = current month, period2 = previous month, same length
    if(!st.p1from){ st.p1from = todayStr().slice(0,8)+'01'; st.p1to = todayStr(); }
    if(!st.itemId && d.items.length) st.itemId = d.items[0].id;

    let p2from=st.p2from, p2to=st.p2to;
    if(!p2from || !p2to){
      const f=new Date(st.p1from), t=new Date(st.p1to);
      const lenDays = Math.round((t-f)/86400000)+1;
      const prevTo = new Date(f); prevTo.setDate(prevTo.getDate()-1);
      const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(lenDays-1));
      p2from = prevFrom.toISOString().slice(0,10);
      p2to = prevTo.toISOString().slice(0,10);
    }

    const inRange=(r,from,to)=> r.date>=from && r.date<=to;
    const p1rows = scoped.filter(r=>r.itemId===st.itemId && inRange(r,st.p1from,st.p1to));
    const p2rows = scoped.filter(r=>r.itemId===st.itemId && inRange(r,p2from,p2to));
    const sum = rows=>rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const q1=sum(p1rows), q2=sum(p2rows);
    const diff = q1-q2;
    const pct = q2>0 ? ((diff/q2)*100) : (q1>0?100:0);

    const reasonBreak = (rows)=>{
      const m={}; rows.forEach(r=>m[r.reason]=(m[r.reason]||0)+Number(r.qty||0));
      return Object.entries(m).sort((a,b)=>b[1]-a[1]);
    };
    const r1 = reasonBreak(p1rows);

    const storeBreak = (rows)=>{
      const m={}; rows.forEach(r=>m[r.storeId]=(m[r.storeId]||0)+Number(r.qty||0));
      return Object.entries(m).sort((a,b)=>b[1]-a[1]);
    };
    const s1 = storeBreak(p1rows);

    const expiries = [...new Set(p1rows.filter(r=>r.expiry).map(r=>r.expiry))].sort();

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr;align-items:end;">

        <div class="field"><label>إلى</label><input type="date" value="${p2to}" onchange="App.rp_item.p2to=this.value;App.reReport()"></div>
      </div>
      <div class="small muted" style="margin-top:6px;">الفترة الثانية افتراضيًا هي نفس عدد أيام الفترة الأولى قبلها مباشرة، ويمكنك تغييرها يدويًا.</div>
    </div>

    ${!st.itemId ? `<div class="empty">أضف صنفًا أولًا لعرض التقرير</div>` : `
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat accent"><div class="n">${fmtNum(q1)}</div><div class="l">الكمية المرتجعة — الفترة الأولى</div></div>
      <div class="stat"><div class="n">${fmtNum(q2)}</div><div class="l">الكمية المرتجعة — الفترة الثانية</div></div>
      <div class="stat ${diff>0?'bad':'warn'}"><div class="n">${diff>0?'+':''}${fmtNum(diff)} ${q2>0?`(${diff>0?'+':''}${pct.toFixed(0)}%)`:''}</div><div class="l">الفرق بين الفترتين</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;align-items:start;">
      <div class="card">
        <div class="section-head"><h3>أسباب الترجيع — الفترة الأولى</h3></div>
        ${r1.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>السبب</th><th>الكمية</th></tr></thead><tbody>
          ${r1.map(([reason,q])=>`<tr><td>${esc(reason)}</td><td>${fmtNum(q)}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات في هذه الفترة</div>`}
      </div>
      <div class="card">
        <div class="section-head"><h3>حسب المحل — الفترة الأولى</h3></div>
        ${s1.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>المحل</th><th>الكمية</th></tr></thead><tbody>
          ${s1.map(([sid,q])=>`<tr><td>${esc(this.storeName(sid)||'—')}</td><td>${fmtNum(q)}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات في هذه الفترة</div>`}
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>تواريخ الصلاحية المسجّلة لهذا الصنف في الفترة الأولى</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportItemPeriodRows(),'تقرير_${esc(this.itemName(st.itemId))}')">تصدير CSV</button></div>
      </div>
      ${expiries.length? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${expiries.map(e=>`<span class="tag ${new Date(e)<new Date()?'bad':'warn'}">${esc(e)}</span>`).join('')}</div>`
        : `<div class="empty small">لا توجد تواريخ صلاحية مسجّلة</div>`}
    </div>
    `}
    `;

          <td>${fmtNum(info.qty)}</td>
          <td>${Object.entries(info.reasons).sort((a,b)=>b[1]-a[1]).map(([r,q])=>`<span class="tag" style="margin-inline-end:4px;">${esc(r)}: ${fmtNum(q)}</span>`).join(' ')}</td>

      ...rows.map(r=>[r.date,this.itemName(r.itemId),r.qty,r.reason,r.expiry,r.transferNo])];

  rp_ovr:{storeId:'', itemId:'', from:'', to:''},
  reportOrdersVsReturns(){
    const d=this.db; const u=this.currentUser();
    const st=this.rp_ovr;
    if(!st.storeId) st.storeId = this.isAdmin() ? (d.stores[0]?d.stores[0].id:'') : u.storeId;
    if(!st.itemId) st.itemId = d.items[0]?d.items[0].id:'';
    if(!st.from){ st.from = todayStr().slice(0,8)+'01'; st.to = todayStr(); }

    const orders = d.orders.filter(o=>o.storeId===st.storeId && o.itemId===st.itemId && o.date>=st.from && o.date<=st.to);
    const returns = d.returns.filter(r=>r.storeId===st.storeId && r.itemId===st.itemId && r.date>=st.from && r.date<=st.to);
    const qOrdered = orders.reduce((a,o)=>a+Number(o.qty||0),0);
    const qReturned = returns.reduce((a,r)=>a+Number(r.qty||0),0);
    const pct = qOrdered>0 ? (qReturned/qOrdered*100) : null;

    const reasonBreak={};
    returns.forEach(r=>reasonBreak[r.reason]=(reasonBreak[r.reason]||0)+Number(r.qty||0));
    const reasonRows = Object.entries(reasonBreak).sort((a,b)=>b[1]-a[1]);

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1fr 1fr 0.8fr 0.8fr;align-items:end;">
        ${this.isAdmin()? `<div class="field"><label>المحل</label><select onchange="App.rp_ovr.storeId=this.value;App.reReport()">
          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : `<div class="field"><label>المحل</label><input type="text" value="${esc(this.storeName(st.storeId)||'')}" disabled></div>`}
        <div class="field"><label>الصنف</label><select onchange="App.rp_ovr.itemId=this.value;App.reReport()">
          ${d.items.map(it=>`<option value="${it.id}" ${st.itemId===it.id?'selected':''}>${esc(it.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>من</label><input type="date" value="${st.from}" onchange="App.rp_ovr.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى</label><input type="date" value="${st.to}" onchange="App.rp_ovr.to=this.value;App.reReport()"></div>
      </div>
    </div>
    ${(!st.storeId||!st.itemId)? `<div class="empty" style="margin-top:14px;">أضف محلًا وصنفًا أولًا</div>` : `
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat"><div class="n">${fmtNum(qOrdered)}</div><div class="l">إجمالي الكمية المطلوبة</div></div>
      <div class="stat accent"><div class="n">${fmtNum(qReturned)}</div><div class="l">إجمالي الكمية المرتجعة</div></div>
      <div class="stat ${pct===null?'':(pct>=20?'bad':pct>=8?'warn':'')}"><div class="n">${pct===null?'—':pct.toFixed(1)+'%'}</div><div class="l">نسبة الترجيع من إجمالي الطلبيات</div></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>أسباب الترجيع خلال نفس الفترة</h3></div>
      ${reasonRows.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>السبب</th><th>الكمية</th></tr></thead><tbody>
        ${reasonRows.map(([r,q])=>`<tr><td>${esc(r)}</td><td>${fmtNum(q)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات لهذا الصنف في هذه الفترة</div>`}
      ${qOrdered===0 && qReturned>0 ? `<div class="help-box" style="margin-top:12px;">لا توجد طلبيات مسجلة لهذا الصنف في نفس الفترة، رغم وجود مرتجعات — تأكد من تسجيل الطلبيات من تبويب "الطلبيات" لحساب نسبة دقيقة.</div>`:''}
    </div>`}
    `;
  },

  reportExpiry(){
    const d=this.db; const u=this.currentUser();
    let rows = this.isAdmin()? d.returns.slice() : d.returns.filter(r=>r.storeId===u.storeId);
    rows = rows.filter(r=>r.expiry);
    rows.sort((a,b)=>a.expiry.localeCompare(b.expiry));
    const now = new Date(new Date().setHours(0,0,0,0));
    const in30 = new Date(now); in30.setDate(in30.getDate()+this.expiryAlertDays());

    return `
    <div class="section-head"><h3>كل المرتجعات المسجّل لها تاريخ صلاحية</h3>
      <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportExpiryRows(),'تقرير_الصلاحية')">تصدير CSV</button></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>المحل</th><th>تاريخ الترجيع</th><th>تاريخ الصلاحية</th><th>السبب</th><th>الحالة</th></tr></thead><tbody>
    ${rows.length===0? `<tr><td colspan="6"><div class="empty">لا توجد بيانات صلاحية مسجّلة</div></td></tr>` :
    rows.map(r=>{
      const exp = new Date(r.expiry);
      let status = '<span class="tag good">سليمة</span>';
      if(exp<now) status='<span class="tag bad">منتهية</span>';
      else if(exp<=in30) status='<span class="tag warn">قريبة الانتهاء</span>';
      return `<tr><td>${esc(this.itemName(r.itemId))}</td><td>${esc(this.storeName(r.storeId)||'—')}</td><td>${esc(r.date)}</td><td>${esc(r.expiry)}</td><td>${esc(r.reason)}</td><td>${status}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    `;
  },
  exportExpiryRows(){
    const d=this.db; const u=this.currentUser();
    let rows = this.isAdmin()? d.returns.slice() : d.returns.filter(r=>r.storeId===u.storeId);

    return [['الصنف','المحل','تاريخ الترجيع','تاريخ الصلاحية','السبب'],
      ...rows.map(r=>[this.itemName(r.itemId),this.storeName(r.storeId),r.date,r.expiry,r.reason])];
  },

  /* ---------------- STOCK & SHORTAGES REPORT (current stock across branches, low/zero highlighted) ---------------- */
  rp_stock:{storeId:'', view:'all', threshold:5},
  reportStock(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_stock;
    const admin=this.isAdmin();
    if(!admin && !st.storeId) st.storeId = u.storeId;
    const availStores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const scopeStores = st.storeId ? availStores.filter(s=>s.id===st.storeId) : availStores;

    let rows = [];
    scopeStores.forEach(s=>{
      d.items.forEach(it=>{
        rows.push({storeId:s.id, itemId:it.id, qty:this.getStock(it.id,'store',s.id)});
      });
    });
    rows.sort((a,b)=>a.qty-b.qty);

    const zeroCount = rows.filter(r=>r.qty<=0).length;
    const lowCount = rows.filter(r=>r.qty>0 && r.qty<=st.threshold).length;

    let shown = rows;
    if(st.view==='zero') shown = rows.filter(r=>r.qty<=0);
    else if(st.view==='low') shown = rows.filter(r=>r.qty>0 && r.qty<=st.threshold);

    const multiStore = scopeStores.length>1;

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1.4fr 1fr;align-items:end;">
        ${admin? `<div class="field"><label>الفرع</label><select onchange="App.rp_stock.storeId=this.value;App.reReport()">
          <option value="">كل الفروع</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : `<div class="field"><label>الفرع</label><input type="text" value="${esc(this.storeName(st.storeId)||'')}" disabled></div>`}
        <div class="field"><label>حد التنبيه (منخفض لو الرصيد ≤ الرقم ده)</label><input type="number" min="0" value="${st.threshold}" onchange="App.rp_stock.threshold=parseFloat(this.value)||0;App.reReport()"></div>
      </div>
      <div class="pill-tabs" style="margin-top:12px;margin-bottom:0;">
        <button class="pill-tab ${st.view==='all'?'active':''}" onclick="App.rp_stock.view='all';App.reReport()">الكل</button>
        <button class="pill-tab ${st.view==='low'?'active':''}" onclick="App.rp_stock.view='low';App.reReport()">منخفض المخزون</button>
        <button class="pill-tab ${st.view==='zero'?'active':''}" onclick="App.rp_stock.view='zero';App.reReport()">نفد تمامًا</button>
      </div>
    </div>
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat bad"><div class="n">${fmtNum(zeroCount)}</div><div class="l">أصناف نفدت تمامًا</div></div>
      <div class="stat warn"><div class="n">${fmtNum(lowCount)}</div><div class="l">أصناف منخفضة المخزون</div></div>
      <div class="stat accent"><div class="n">${fmtNum(rows.length)}</div><div class="l">إجمالي صنف × فرع معروض</div></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>تفاصيل المخزون</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportStockRows(),'تقرير_المخزون')">تصدير CSV</button></div></div>
      ${shown.length===0? `<div class="empty small">لا توجد أصناف مطابقة</div>` : `
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${multiStore?'<th>الفرع</th>':''}<th>الصنف</th><th>الكود</th><th>الباركود</th><th>الرصيد الحالي</th><th>الحالة</th></tr></thead><tbody>
        ${shown.map(r=>{
          const it=d.items.find(i=>i.id===r.itemId);
          const tag = r.qty<=0? '<span class="tag bad">نفد</span>' : (r.qty<=st.threshold? '<span class="tag warn">منخفض</span>' : '<span class="tag good">متاح</span>');
          return `<tr>${multiStore?`<td>${esc(this.storeName(r.storeId)||'—')}</td>`:''}<td>${esc(it?it.name:'—')}</td><td>${esc((it&&it.code)||'—')}</td><td>${esc((it&&it.barcode)||'—')}</td><td>${fmtNum(r.qty)}</td><td>${tag}</td></tr>`;
        }).join('')}
      </tbody></table></div>`}
    </div>
    `;
  },
  exportStockRows(){
    const d=this.db, u=this.currentUser(); const st=this.rp_stock; const admin=this.isAdmin();
    const availStores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const scopeStores = st.storeId ? availStores.filter(s=>s.id===st.storeId) : availStores;
    const rows=[];
    scopeStores.forEach(s=>{ d.items.forEach(it=>{ rows.push([s.name, it.name, it.code||'', this.getStock(it.id,'store',s.id)]); }); });
    return [['الفرع','الصنف','الكود','الرصيد الحالي'], ...rows];
  },
