        الموقع: <b>${esc(locName||'—')}</b> (${f.locType==='store'?'محل':'مستودع'})${this.allStores()?' — ولو الشيت فيه عمود باسم الفرع/المستودع، كل صف هيروح لمكانه تلقائيًا.':'.'}
      </div>
      <div class="field">
        <label>الكمية اللي في الملف تعمل إيه؟</label>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;">
          <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;"><input type="radio" name="stkMode" value="replace" checked style="width:auto;flex:none;margin-top:5px;" onchange="App._stockImport.mode='replace';App.renderStockImportPreview()">
            <span><b>استبدال الرصيد (جرد)</b><br><span class="small muted">الرقم في الملف يبقى هو الرصيد الجديد بالظبط</span></span></label>
          <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;"><input type="radio" name="stkMode" value="add" style="width:auto;flex:none;margin-top:5px;" onchange="App._stockImport.mode='add';App.renderStockImportPreview()">
            <span><b>إضافة على الرصيد (استلام بضاعة)</b><br><span class="small muted">الرقم في الملف يتجمع على الرصيد الموجود</span></span></label>
        </div>
      </div>
      <div class="field"><label>ملف الإكسيل (xlsx / xls / csv)</label><input type="file" id="stockFile" accept=".xlsx,.xls,.xlsm,.csv" onchange="App.readStockImportFile()"></div>
      <div id="stockImportPreview"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" id="stockImportApply" disabled onclick="App.applyStockImport()">تأكيد وتحديث الأرصدة</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `, true);
  },

  /* ---- smart matching helpers (any sheet layout) ---- */
  _arNorm(v){
    return String(v==null?'':v)
      .replace(/[ً-ٰٟـ]/g,'')          // diacritics + tatweel
      .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
      .replace(/[٠-٩]/g, dg=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(dg)))
      .replace(/[۰-۹]/g, dg=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(dg)))
      .toLowerCase().replace(/[\s‏‎؜ ]+/g,' ').trim();
  },
  _cellStr(v){
    if(typeof v==='number') return Number.isInteger(v) ? v.toFixed(0) : String(v);
    return String(v==null?'':v);
  },
  _idKey(v){
    let s = this._arNorm(this._cellStr(v));
    if(/^\d+(\.0+)?$/.test(s)) s = s.replace(/\.0+$/,'').replace(/^0+(?=\d)/,'');
    return s;
  },
  _parseQty(v){
    if(typeof v==='number') return v;
    const s = this._arNorm(v).replace(/[٬,]/g,'').replace(/٫/g,'.');
    const m = s.match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : NaN;
  },
  _stockMaps(){
    const byId = new Map(), byName = new Map(), byNameNS = new Map();
    this.db.items.forEach(it=>{
      if(it.code) byId.set(this._idKey(it.code), it);
      if(it.barcode) byId.set(this._idKey(it.barcode), it);
      if(it.name){ byName.set(this._arNorm(it.name), it); byNameNS.set(this._arNorm(it.name).replace(/\s/g,''), it); }
    });
    const locs = new Map();
    this.db.stores.forEach(s=>{ [s.name,s.code].filter(Boolean).forEach(k=>locs.set(this._idKey(k), {locType:'store', locId:s.id})); });
    this.db.warehouses.forEach(w=>{ [w.name,w.code].filter(Boolean).forEach(k=>locs.set(this._idKey(k), {locType:'warehouse', locId:w.id})); });
    return {byId, byName, byNameNS, locs};
  },
  _matchItem(v, maps){
    const k = this._idKey(v);
    if(!k) return null;
    return maps.byId.get(k) || maps.byName.get(k) || maps.byNameNS.get(k.replace(/\s/g,'')) || null;
  },
  /* figure out which row is the header and which columns hold item / qty / location */
  _analyzeStockSheet(aoa, maps){
    const KW = {
      qty:['كميه','الكميه','رصيد','الرصيد','العدد','عدد','المتاح','الموجود','المخزون','جرد','الجرد','فعلي','qty','quantity','stock','balance','on hand','count'],
      bad:['سعر','تكلفه','قيمه','مبلغ','price','cost','amount','value','تاريخ','date','وزن','weight','شد','عبوه'],
      id:['كود','رمز','باركود','بار كود','رقم الصنف','item no','code','sku','barcode','ean'],
      name:['اسم','صنف','الصنف','بيان','وصف','منتج','ماده','name','item','description','product'],
      loc:['فرع','الفرع','محل','المحل','مستودع','المستودع','موقع','branch','store','warehouse','location'],
    };
    const has = (cell, words)=>{ const c=this._arNorm(cell); return !!c && words.some(w=>c.includes(this._arNorm(w))); };
    // header row = the row (in the first 30) with the most keyword hits
    let hdrIdx = -1, best = 0;
    for(let r=0; r<Math.min(aoa.length,30); r++){
      const row = aoa[r]||[];
      let sc = 0; row.forEach(c=>{ if(typeof c==='string' && (has(c,KW.qty)||has(c,KW.id)||has(c,KW.name)||has(c,KW.loc))) sc++; });
      if(sc>best){ best=sc; hdrIdx=r; }
    }
    const header = hdrIdx>=0 ? (aoa[hdrIdx]||[]).map(c=>this._cellStr(c).trim()) : [];
    const data = aoa.slice(hdrIdx+1).filter(r=>r && r.some(c=>String(c).trim()!==''));
    const nCols = Math.max(header.length, ...data.slice(0,500).map(r=>r.length), 0);
    const sample = data.slice(0,800);
    const cols = [];
    for(let c=0;c<nCols;c++){
      let nonEmpty=0, idHits=0, locHits=0, locNameHits=0, nums=0, longDigits=0;
      sample.forEach(r=>{
        const v = r[c]; const sv = this._cellStr(v).trim();
        if(sv==='') return;
        nonEmpty++;
        if(this._matchItem(v, maps)) idHits++;
        if(maps.locs.get(this._idKey(v))){ locHits++; if(!/^\d+$/.test(this._idKey(v))) locNameHits++; }
        const q = this._parseQty(v);
        if(!isNaN(q) && /^[\s\d٠-٩.,٬٫\-]+(\s*[؀-ۿa-zA-Z]{0,8})?$/.test(sv)) nums++;
        if(/^\d{6,}$/.test(this._idKey(v))) longDigits++;
      });
      const h = header[c]||'';
      cols.push({c, h, nonEmpty, idHits, locHits, locNameHits, nums, longDigits,
        hQty: has(h,KW.qty) && !has(h,KW.bad), hBad: has(h,KW.bad), hId: has(h,KW.id)||has(h,KW.name), hLoc: has(h,KW.loc)});
    }
    const idCols = cols.filter(x=>x.idHits>0).sort((a,b)=>b.idHits-a.idHits).map(x=>x.c);
    // a branch/warehouse column must match branch NAMES, or be headed like "الفرع" (plain numbers alone are too ambiguous)
    const locCol = (cols.filter(x=>x.nonEmpty && !idCols.slice(0,1).includes(x.c) && ((x.hLoc && x.locHits/x.nonEmpty>=0.5) || x.locNameHits/x.nonEmpty>=0.5)).sort((a,b)=>b.locHits-a.locHits)[0]||{}).c;
    const qtyCands = cols.filter(x=>x.nonEmpty && x.nums/x.nonEmpty>=0.6 && x.c!==locCol && !(x.idHits/x.nonEmpty>0.3) && !x.hBad);
    const scoreQ = x=> (x.hQty?1000:0) + (x.hId?-500:0) + (x.longDigits/x.nonEmpty>0.5?-300:0) + x.nums;
    qtyCands.sort((a,b)=>scoreQ(b)-scoreQ(a));
    return {hdrIdx, header, data, cols, idCols, locCol, qtyCol: qtyCands.length? qtyCands[0].c : null, qtyCands: qtyCands.map(x=>x.c)};
  },
  readStockImportFile(){
    const input = document.getElementById('stockFile');
    const box = document.getElementById('stockImportPreview');
    if(!input.files || !input.files[0]) return;
    box.innerHTML = '<div class="small muted">جاري قراءة الملف…</div>';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const maps = this._stockMaps();
        const sheets = wb.SheetNames.map(n=>{
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''});
          const a = this._analyzeStockSheet(aoa, maps);
          const matched = a.data.filter(r=>a.idCols.some(c=>this._matchItem(r[c], maps))).length;
          return {name:n, aoa, a, matched};
        });
        // start on the sheet that matches the most registered items
        let bestIdx = 0; sheets.forEach((s,i)=>{ if(s.matched>sheets[bestIdx].matched) bestIdx=i; });
        const st = this._stockImport;
        st.book = sheets; st.sheetIdx = bestIdx; st.qtyCol = sheets[bestIdx].a.qtyCol;
        this.renderStockImportPreview();
      }catch(err){
        console.error(err);
        box.innerHTML = `<div class="help-box" style="color:var(--bad);">تعذّرت قراءة الملف. تأكد إنه ملف إكسيل (xlsx / xls) أو csv.</div>`;
      }
    };
    reader.readAsArrayBuffer(input.files[0]);
  },
  _computeStockImport(){
    const st = this._stockImport;
    const sh = st.book[st.sheetIdx], a = sh.a;
    const maps = this._stockMaps();
    const admin = this.allStores();
    const useLoc = admin && st.useLocCol && a.locCol!=null;
    const agg = new Map(); const unmatched = new Map(); let emptyQty = 0, unmatchedLoc = 0;
    if(st.qtyCol==null) return {rows:[], unmatched:[], emptyQty:0, unmatchedLoc:0, useLoc};
    a.data.forEach(r=>{
      let it = null;
      for(const c of a.idCols){ it = this._matchItem(r[c], maps); if(it) break; }
      const q = this._parseQty(r[st.qtyCol]);
      if(!it){
        // only report rows that actually look like item rows (have some text and a quantity)
        const label = (a.idCols.length? r[a.idCols[0]] : '') || r.find(v=>typeof v==='string' && v.trim() && isNaN(this._parseQty(v))) || '';
        if(String(label).trim() && !isNaN(q) && !/اجمال|مجموع|total|sum/i.test(this._arNorm(label))) unmatched.set(String(label).trim(), true);
        return;
      }
      if(isNaN(q)){ emptyQty++; return; }
      let loc = {locType:st.locType, locId:st.locId};
      if(useLoc){
        const l = maps.locs.get(this._idKey(r[a.locCol]));
        if(!l){ unmatchedLoc++; return; }
        loc = l;
      }
      const key = loc.locType+'|'+loc.locId+'|'+it.id;
      const prev = agg.get(key);
      agg.set(key, {locType:loc.locType, locId:loc.locId, itemId:it.id, qty:(prev?prev.qty:0)+q});
    });
    return {rows:Array.from(agg.values()), unmatched:Array.from(unmatched.keys()), emptyQty, unmatchedLoc, useLoc};
  },
  renderStockImportPreview(){
    const st = this._stockImport;
    const box = document.getElementById('stockImportPreview');
    const btn = document.getElementById('stockImportApply');
    if(!box || !st || !st.book) return;
    const sh = st.book[st.sheetIdx], a = sh.a;
    const colName = c=> (a.header[c] && String(a.header[c]).trim()) || ('عمود ' + XLSX_colLetter(c));
    const res = this._computeStockImport();
    st.result = res;
    const add = st.mode==='add';
    btn.disabled = res.rows.length===0;
    const locLabel = r=> r.locType==='store' ? (this.storeName(r.locId)||'—') : this.whName(r.locId);
    box.innerHTML = `
      <div class="card" style="padding:10px 12px;margin-bottom:10px;">
        <div class="form-row" style="grid-template-columns:${st.book.length>1?'1fr ':''}1fr;align-items:end;">
          ${st.book.length>1? `<div class="field" style="margin-bottom:0;"><label>الشيت</label><select onchange="App._stockImport.sheetIdx=+this.value;App._stockImport.qtyCol=App._stockImport.book[+this.value].a.qtyCol;App.renderStockImportPreview()">
            ${st.book.map((s,i)=>`<option value="${i}" ${i===st.sheetIdx?'selected':''}>${esc(s.name)} (${fmtNum(s.matched)} صنف متعرف)</option>`).join('')}</select></div>`:''}
          <div class="field" style="margin-bottom:0;"><label>عمود الكمية (اتحدد تلقائيًا — غيّره لو مش صح)</label><select onchange="App._stockImport.qtyCol=this.value===''?null:+this.value;App.renderStockImportPreview()">
            ${a.qtyCol==null && st.qtyCol==null? '<option value="">— اختار عمود الكمية —</option>':''}
            ${a.cols.filter(x=>x.nonEmpty).map(x=>`<option value="${x.c}" ${x.c===st.qtyCol?'selected':''}>${esc(colName(x.c))}${a.qtyCands.includes(x.c)?'':' (مش أرقام)'}</option>`).join('')}
          </select></div>
        </div>
        <div class="small muted" style="margin-top:8px;">
          عمود الصنف: <b>${a.idCols.length? a.idCols.slice(0,2).map(c=>esc(colName(c))).join(' / ') : '<span style="color:var(--bad)">مش لاقي أصناف مسجلة في الشيت ده</span>'}</b>
          ${a.locCol!=null && this.allStores()? ` — عمود الموقع: <b>${esc(colName(a.locCol))}</b> <label style="display:inline-flex;gap:4px;align-items:center;margin-inline-start:8px;"><input type="checkbox" style="width:auto;" ${st.useLocCol?'checked':''} onchange="App._stockImport.useLocCol=this.checked;App.renderStockImportPreview()"> وزّع حسب العمود ده</label>`:''}
        </div>
      </div>
      <div class="grid grid-3" style="margin:6px 0 12px;">
        <div class="stat accent"><div class="n">${fmtNum(res.rows.length)}</div><div class="l">صنف هيتحدث رصيده</div></div>
        <div class="stat ${res.unmatched.length?'bad':''}"><div class="n">${fmtNum(res.unmatched.length)}</div><div class="l">صنف في الملف مش مسجل عندك</div></div>
        <div class="stat"><div class="n">${fmtNum(res.emptyQty + res.unmatchedLoc)}</div><div class="l">صف اتساب (كمية فاضية${res.useLoc?' أو موقع مش معروف':''})</div></div>
      </div>
      ${res.unmatched.length? `<div class="help-box" style="margin-bottom:10px;">مش مسجلين في الأصناف (هيتسابوا): ${res.unmatched.slice(0,15).map(x=>`<span class="tag bad" style="margin:2px;">${esc(x)}</span>`).join('')}${res.unmatched.length>15?` و${fmtNum(res.unmatched.length-15)} غيرهم`:''}</div>`:''}
      ${res.rows.length? `<div class="tbl-wrap" style="max-height:260px;overflow:auto;"><table class="tbl"><thead><tr>${res.useLoc?'<th>الموقع</th>':''}<th>الصنف</th><th>الكود</th><th>الشد</th><th>الوحدة</th><th>الرصيد الحالي</th><th>${add?'هيتضاف':'من الملف'}</th><th>الرصيد بعد التحديث</th></tr></thead><tbody>
        ${res.rows.map(r=>{
          const cur = this.getStock(r.itemId, r.locType, r.locId);
          const next = add ? cur + r.qty : r.qty;
          return `<tr>${res.useLoc?`<td>${esc(locLabel(r))}</td>`:''}<td>${esc(this.itemName(r.itemId))}</td><td>${esc((this.db.items.find(i=>i.id===r.itemId)||{}).code||'—')}</td><td>${esc((this.db.items.find(i=>i.id===r.itemId)||{}).packSize||'—')}</td><td>${esc(this.itemUnit(r.itemId)||'—')}</td><td>${fmtNum(cur)}</td><td>${add&&r.qty>0?'+':''}${fmtNum(r.qty)}</td><td><b>${fmtNum(next)}</b></td></tr>`;
        }).join('')}
      </tbody></table></div>`: (st.qtyCol==null? `<div class="help-box">مش لاقي عمود فيه كميات — اختاره من القائمة فوق.</div>`:'')}
    `;
  },
  applyStockImport(){
    const st = this._stockImport;
    const res = st && st.result;
    if(!res || !res.rows.length) return;
    const add = st.mode==='add';
    res.rows.forEach(r=>{
      if(add) this.adjustStock(r.itemId, r.locType, r.locId, r.qty);
      else this.setStock(r.itemId, r.locType, r.locId, r.qty);
    });
    const locs = new Set(res.rows.map(r=> r.locType==='store' ? this.storeName(r.locId) : this.whName(r.locId)));
    const locTxt = Array.from(locs).join('، ');
    this.logActivity(`رفع أرصدة مخزون من إكسيل (${add?'إضافة على الرصيد':'استبدال/جرد'}) لعدد ${fmtNum(res.rows.length)} صنف في ${locTxt||'—'}`);
    this._stockImport = null;
    this.closeModal();
    this.refresh();
    this.notify(`تم تحديث أرصدة ${fmtNum(res.rows.length)} صنف في ${locTxt||'—'} ✅`);
  },

  /* ---------------- EXPORT REGISTERED ITEMS TO EXCEL ---------------- */
  exportItemsExcel(){

  downloadItemsTemplate(){

  /* ---------------- ITEMS IMPORT (any sheet layout — every column goes to its own field) ---------------- */
  _itemsImport: null,
  ITEM_FIELDS: [
    {k:'name',     label:'اسم الصنف', required:true},
    {k:'code',     label:'رمز الصنف (الكود)'},
    {k:'barcode',  label:'الباركود'},
    {k:'packSize', label:'شد الصنف'},
    {k:'unit',     label:'الوحدة'},
    {k:'cost',     label:'تكلفة الوحدة'},
  ],
  /* which item field a header cell belongs to (order matters: "باركود" contains "كود") */
  _itemFieldOf(h){
    const n = this._arNorm(h);
    if(!n) return null;
    const any = (ws)=> ws.some(w=>n.includes(this._arNorm(w)));
    if(any(['تصنيف','فئه','مجموعه','قسم','category','group','class'])) return null;
    if(any(['باركود','بار كود','barcode','bar code','ean','upc'])) return 'barcode';
    if(any(['كود','رمز','رقم الصنف','رقم المنتج','رقم الماده','code','sku','item no','item number','article'])) return 'code';
    if(any(['وحده','unit','uom'])) return 'unit';
    if(any(['شد','عبوه','تعبئه','pack','حجم','عدد في','قطع','pcs'])) return 'packSize';
    if(any(['تكلفه','cost','سعر','price'])) return 'cost';
    if(any(['اسم','صنف','بيان','وصف','منتج','ماده','name','item','description','product'])) return 'name';
    return null;
  },
  _analyzeItemsSheet(aoa){
    let hdrIdx=-1, best=0, bestMap=null;
    for(let r=0; r<Math.min(aoa.length,30); r++){
      const row = aoa[r]||[];
      const map = {}; let sc=0;
      row.forEach((c,ci)=>{
        if(typeof c!=='string') return;
        const f = this._itemFieldOf(c);
        if(f && map[f]==null){ map[f]=ci; sc++; }
      });
      if(sc>best && map.name!=null){ best=sc; hdrIdx=r; bestMap=map; }
    }
    const header = hdrIdx>=0 ? (aoa[hdrIdx]||[]).map(c=>this._cellStr(c).trim()) : [];
    const data = aoa.slice(hdrIdx+1).filter(r=>r && r.some(c=>String(c).trim()!==''));
    const nCols = Math.max(header.length, ...data.slice(0,300).map(r=>r.length), 0);
    let map = bestMap;
    if(!map){ // no recognizable header: fall back to the classic order name, code, barcode, pack, unit
      map = {name:0, code:1, barcode:2, packSize:3, unit:4};
      Object.keys(map).forEach(k=>{ if(map[k]>=nCols) delete map[k]; });
    }
    return {hdrIdx, header, data, nCols, map, score: hdrIdx>=0? best : 0};
  },
  openImportItems(){
    if(!this.can('items.import')){ this.notify('مش مسموح لحسابك بالاستيراد — كلّم المدير.'); return; }
    this._itemsImport = {book:null, sheetIdx:0, map:{}, existing:'fill'};
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>📥 استيراد الأصناف من إكسيل</h3>
      <div class="help-box" style="margin-bottom:14px;">
        ارفع <b>أي شيت أصناف عندك زي ما هو</b> — مش لازم ترتيب معيّن للأعمدة. البرنامج بيقرا عناوين الأعمدة
        (زي "إسم الصنف" / "كود الصنف" / "BarCode" / "الشد" / "الوحدة") ويحط كل عمود في مكانه، وتقدر تراجع وتعدّل قبل الحفظ.
        الأعمدة الزيادة زي "التصنيف" أو "#" بتتساب.
      </div>
      <div class="field"><label>ملف الإكسيل (xlsx / xls / csv)</label>
        <input type="file" id="itemsFile" accept=".xlsx,.xls,.xlsm,.csv" onchange="App.readItemsFile()"></div>
      <div id="importResult"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" id="itemsImportApply" disabled onclick="App.applyItemsImport()">استيراد الأصناف</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `, true);
  },
  readItemsFile(){
    const input = document.getElementById('itemsFile');
    const box = document.getElementById('importResult');
    if(!input.files || !input.files[0]) return;
    box.innerHTML = '<div class="small muted">جاري قراءة الملف…</div>';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const sheets = wb.SheetNames.map(n=>{
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''});
          return {name:n, a:this._analyzeItemsSheet(aoa)};
        });
        let bestIdx = 0; sheets.forEach((s,i)=>{ const b=sheets[bestIdx].a; if(s.a.score>b.score || (s.a.score===b.score && s.a.data.length>b.data.length)) bestIdx=i; });
        const st = this._itemsImport;
        st.book = sheets; st.sheetIdx = bestIdx; st.map = Object.assign({}, sheets[bestIdx].a.map);
        this.renderItemsImportPreview();
      }catch(err){
        console.error(err);
        box.innerHTML = `<div class="help-box" style="color:var(--bad);">تعذّرت قراءة الملف. تأكد إنه ملف إكسيل (xlsx / xls) أو csv.</div>`;
      }
    };
    reader.readAsArrayBuffer(input.files[0]);
  },
  _computeItemsImport(){
    const st = this._itemsImport;
    const a = st.book[st.sheetIdx].a, m = st.map;
    const get = (r,k)=> m[k]==null ? '' : this._cellStr(r[m[k]]).trim();
    const byKey = new Map(), byName = new Map();
    this.db.items.forEach(it=>{
      if(it.barcode) byKey.set('b:'+this._idKey(it.barcode), it);
      if(it.code) byKey.set('c:'+this._idKey(it.code), it);
      if(it.name) byName.set(this._arNorm(it.name), it);
    });
    const out = {add:[], update:[], skipped:0, bad:0};
    const seen = new Set();
    a.data.forEach(r=>{
      const rec = {name:get(r,'name'), code:get(r,'code'), barcode:get(r,'barcode'), packSize:get(r,'packSize'), unit:get(r,'unit')};
      const costTxt = get(r,'cost'); const cost = costTxt===''? null : this._parseQty(costTxt);
      if(!rec.name){ out.skipped++; return; }
      // a "name" that is only a number / "#" means the columns are misplaced — never save it as an item
      if(/^[#\d\s.,٠-٩]+$/.test(rec.name) || /^(اجمالي|الاجمالي|المجموع|total)$/.test(this._arNorm(rec.name))){ out.bad++; return; }
      const nk = this._arNorm(rec.name);
      const dupKey = (rec.barcode&&'b:'+this._idKey(rec.barcode)) || (rec.code&&'c:'+this._idKey(rec.code)) || 'n:'+nk;
      if(seen.has(dupKey)){ out.skipped++; return; }
      seen.add(dupKey);
      const ex = (rec.barcode && byKey.get('b:'+this._idKey(rec.barcode))) || (rec.code && byKey.get('c:'+this._idKey(rec.code))) || byName.get(nk);
      if(ex) out.update.push({item:ex, rec, cost});
      else out.add.push({rec, cost});
    });
    return out;
  },
  renderItemsImportPreview(){
    const st = this._itemsImport;
    const box = document.getElementById('importResult');
    const btn = document.getElementById('itemsImportApply');
    if(!box || !st || !st.book) return;
    const a = st.book[st.sheetIdx].a;
    const colName = c=> (a.header[c] && String(a.header[c]).trim()) || ('عمود ' + XLSX_colLetter(c));
    const res = this._computeItemsImport();
    st.result = res;
    btn.disabled = (res.add.length + res.update.length)===0 || st.map.name==null;
    const colOpts = (k)=> `<option value="">— مش موجود في الملف —</option>` +
      Array.from({length:a.nCols},(_,c)=>c).map(c=>`<option value="${c}" ${st.map[k]===c?'selected':''}>${esc(colName(c))}</option>`).join('');
    const sample = res.add.concat(res.update).slice(0,6).map(x=>x.rec);
    box.innerHTML = `
      <div class="card" style="padding:10px 12px;margin:6px 0 10px;">
        ${st.book.length>1? `<div class="field"><label>الشيت</label><select onchange="App._itemsImport.sheetIdx=+this.value;App._itemsImport.map=Object.assign({},App._itemsImport.book[+this.value].a.map);App.renderItemsImportPreview()">
          ${st.book.map((s,i)=>`<option value="${i}" ${i===st.sheetIdx?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`:''}
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;">كل خانة في البرنامج هتتملى من أنهي عمود (اتحدد تلقائيًا — غيّر لو في حاجة غلط):</div>
        <div class="form-row" style="grid-template-columns:1fr 1fr 1fr;">
          ${this.ITEM_FIELDS.map(f=>`<div class="field" style="margin-bottom:6px;"><label>${f.label}${f.required?' *':''}</label>
            <select onchange="App._itemsImport.map['${f.k}']=this.value===''?null:+this.value;App.renderItemsImportPreview()">${colOpts(f.k)}</select></div>`).join('')}
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;" class="small">
          <span>لو الصنف موجود قبل كده:</span>
          <label style="display:inline-flex;gap:5px;align-items:center;cursor:pointer;"><input type="radio" name="itExisting" style="width:auto;" ${st.existing==='fill'?'checked':''} onchange="App._itemsImport.existing='fill';App.renderItemsImportPreview()"> كمّل البيانات الناقصة بس</label>
          <label style="display:inline-flex;gap:5px;align-items:center;cursor:pointer;"><input type="radio" name="itExisting" style="width:auto;" ${st.existing==='overwrite'?'checked':''} onchange="App._itemsImport.existing='overwrite';App.renderItemsImportPreview()"> حدّث بياناته كلها من الملف</label>
        </div>
      </div>
      ${st.map.name==null? `<div class="help-box" style="color:var(--bad);margin-bottom:10px;">لازم تختار عمود "اسم الصنف".</div>`:''}
      <div class="grid grid-3" style="margin-bottom:10px;">
        <div class="stat accent"><div class="n">${fmtNum(res.add.length)}</div><div class="l">صنف جديد هيتضاف</div></div>
        <div class="stat"><div class="n">${fmtNum(res.update.length)}</div><div class="l">صنف موجود ${st.existing==='fill'?'هتتكمّل بياناته':'هتتحدث بياناته'}</div></div>
        <div class="stat ${res.bad?'warn':''}"><div class="n">${fmtNum(res.bad + res.skipped)}</div><div class="l">صف اتساب (فاضي / مكرر / اسمه رقم)</div></div>
      </div>
      ${sample.length? `<div class="small muted" style="margin-bottom:4px;">معاينة — كده الأصناف هتظهر في البرنامج:</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>اسم الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>شد الصنف</th><th>الوحدة</th></tr></thead><tbody>
        ${sample.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.code||'—')}</td><td>${esc(r.barcode||'—')}</td><td>${esc(r.packSize||'—')}</td><td>${esc(r.unit||'—')}</td></tr>`).join('')}
      </tbody></table></div>`:''}
    `;
  },
  applyItemsImport(){
    const st = this._itemsImport;
    const res = st && st.result;
    if(!res) return;
    res.add.forEach(({rec,cost})=>{
      this.db.items.push({id:uid(), name:rec.name, code:rec.code, barcode:rec.barcode, packSize:rec.packSize, unit:rec.unit, cost: cost!=null&&!isNaN(cost)? cost : 0});
    });
    const over = st.existing==='overwrite';
    let changed = 0;
    res.update.forEach(({item,rec,cost})=>{
      let ch = false;
      ['name','code','barcode','packSize','unit'].forEach(k=>{
        if(st.map[k]==null || !rec[k]) return;
        if(over ? item[k]!==rec[k] : !item[k]){ item[k] = rec[k]; ch = true; }
      });
      if(cost!=null && !isNaN(cost) && (over || !item.cost)){ if(item.cost!==cost){ item.cost = cost; ch = true; } }
      if(ch) changed++;
    });
    this.logActivity(`استورد أصناف من إكسيل: ${fmtNum(res.add.length)} جديد، ${fmtNum(changed)} اتحدّث`);
    this._itemsImport = null;
    this.closeModal();
    this.refresh();
    this.notify(`تم: ${fmtNum(res.add.length)} صنف جديد اتضاف، و${fmtNum(changed)} صنف موجود اتحدّثت بياناته ✅`);
  },

  /* ---------------- CLEANUP: items saved with misplaced columns by the old importer ---------------- */
  badItems(){
    const used = new Set();
    (this.db.returns||[]).forEach(r=>used.add(r.itemId));
    (this.db.orders||[]).forEach(o=>used.add(o.itemId));
    return this.db.items.filter(it=>/^[#\d\s.,٠-٩]*$/.test(String(it.name||'').trim()) && !used.has(it.id));
  },
  deleteBadItems(){
    const bad = this.badItems();
    if(!bad.length) return;
    this.confirmAction(`حذف ${fmtNum(bad.length)} صنف اسمهم رقم بس (اتسجلوا غلط من استيراد قديم)؟ مفيش عليهم أي مرتجعات أو طلبيات.`, ()=>{
      const ids = new Set(bad.map(i=>i.id));
      this.db.items = this.db.items.filter(i=>!ids.has(i.id));
      this.db.stock = this.db.stock.filter(s=>!ids.has(s.itemId));
      ids.forEach(id=>this.itemsSelected.delete(id));
      this.logActivity(`حذف ${fmtNum(ids.size)} صنف متسجلين غلط (اسمهم رقم)`);
      this.refresh();
    });
  },

        <td>${u.role==='admin'?'<span class="muted small">كل الصلاحيات</span>':this.permsSummaryHtml(u.permissions)}</td>
        <td>${u.role==='admin'?'<span class="muted">كل المحلات</span>':(u.storeId?esc(this.storeName(u.storeId)||'لا يوجد'):'<span class="muted small">لا يوجد</span>')}</td>

  openJobForm(id){
    const editing = id? this.db.jobTitles.find(j=>j.id===id):null;
    const p = editing? editing.perms : defaultPermissions();
    const type = editing? (editing.type||'both') : 'both';
    this.openModal(`
      <button class="modal-close" onclick="App.closeModal()">✕</button>
      <h3>${editing?'تعديل وظيفة':'إضافة وظيفة جديدة'}</h3>
      <div class="form-row">
        <div class="field"><label>اسم الوظيفة</label><input type="text" id="j_name" placeholder="مثال: مسؤول مرتجعات، محاسب، أمين مخزن" value="${editing?esc(editing.name):''}"></div>
        <div class="field"><label>هذه الوظيفة خاصة بـ</label>
          <select id="j_type">
            <option value="both" ${type==='both'?'selected':''}>عام (تصلح لمستخدم محل ومستخدم مستودع)</option>
            <option value="store" ${type==='store'?'selected':''}>مستخدمي المحلات فقط</option>
            <option value="warehouse" ${type==='warehouse'?'selected':''}>مستخدمي المستودعات فقط</option>
          </select>
        </div>
      </div>
      ${this.permsCheckboxesHtml(p)}

        <button class="btn btn-accent" onclick="App.saveJob('${editing?editing.id:''}')">حفظ</button>

  saveJob(id){
    const name = document.getElementById('j_name').value.trim();
    if(!name){ this.notify('اكتب اسم الوظيفة.'); return; }
    const type = document.getElementById('j_type').value || 'both';
    const perms = this.readPermsCheckboxes();
    if(id){
      Object.assign(this.db.jobTitles.find(j=>j.id===id), {name, type, perms});
      this.logActivity(`عدّل وظيفة "${name}"`);
    }else{
      this.db.jobTitles.push({id:uid(), name, type, perms});
      this.logActivity(`أضاف وظيفة جديدة "${name}"`);
    }
    this.closeModal(); this.refresh();
  },
  deleteJob(id){
    const j = this.db.jobTitles.find(x=>x.id===id);
    this.confirmAction('حذف هذه الوظيفة؟ لن يتغيّر أي مستخدم مسند إليها حاليًا، لكن هتختفي من قائمة الاختيار.', ()=>{
      this.db.jobTitles = this.db.jobTitles.filter(j=>j.id!==id);
      this.logActivity(`حذف وظيفة "${j?j.name:''}"`);
      this.refresh();
    });
  },

  /* short readable summary chips of an actual permissions object — used on
     both the job-titles table and the users table, so admins can see at a
     glance exactly what a job template OR a specific user is allowed to do,
     instead of a generic "مستخدم محل" label */
  permsSummaryHtml(perms){
    if(!perms) return '<span class="muted small">لا يوجد</span>';
    const chips=[];
    if(perms.returns && perms.returns.view) chips.push('مرتجعات: '+['عرض',perms.returns.add&&'إضافة',perms.returns.edit&&'تعديل',perms.returns.delete&&'حذف'].filter(Boolean).join('/'));
    if(perms.orders && perms.orders.view) chips.push('طلبيات: '+['عرض',perms.orders.add&&'إضافة',perms.orders.edit&&'تعديل',perms.orders.delete&&'حذف'].filter(Boolean).join('/'));
    if(perms.reports && perms.reports.view) chips.push('التقارير');
    if(perms.items && perms.items.edit) chips.push('إدارة الأصناف');
    else if(perms.items && perms.items.view) chips.push('عرض الأصناف');
    if(perms.inventory && perms.inventory.edit) chips.push('تعديل المخزون');
    else if(perms.inventory && perms.inventory.view) chips.push('عرض المخزون');
    if(perms.stores && perms.stores.edit) chips.push('إدارة المحلات');
    else if(perms.stores && perms.stores.view) chips.push('عرض المحلات');
    if(perms.warehouses && perms.warehouses.edit) chips.push('إدارة المستودعات');
    else if(perms.warehouses && perms.warehouses.view) chips.push('عرض المستودعات');
    if(perms.links && perms.links.edit) chips.push('ربط محل/مستودع');
    else if(perms.links && perms.links.view) chips.push('عرض الربط');
    if(perms.finance && perms.finance.edit) chips.push('التكاليف والمالية');
    else if(perms.finance && perms.finance.view) chips.push('عرض المالية');
    return chips.length? chips.map(c=>`<span class="tag" style="margin-inline-end:4px;">${esc(c)}</span>`).join('') : '<span class="muted small">عرض المرتجعات فقط</span>';
  },

  /* shared checkbox block used both on a job template and on a single user's
     custom permissions — built from PERM_SCHEMA, same ids for read/apply */
  permsCheckboxesHtml(p){
    const P = normalizePerms(p);
    const id = (g,k)=>`perm_${g}_${k.replace(/[^a-zA-Z0-9]/g,'_')}`;
    return `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;">
        <button type="button" class="btn btn-sm" onclick="App.setAllPerms(true)">✓ تحديد الكل</button>
        <button type="button" class="btn btn-sm" onclick="App.setAllPerms(false)">✕ إلغاء الكل</button>
      </div>
      <div class="perm-grid">
        ${PERM_SCHEMA.map(grp=>`
        <div class="card perm-card" style="padding:12px 14px;${grp.keys.length>6?'grid-column:1/-1;':''}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <b class="small">${grp.label}</b>
            <span style="display:flex;gap:4px;">
              <button type="button" class="icon-btn" title="تحديد الكل" onclick="App.setGroupPerms('${grp.g}',true)">✓</button>
              <button type="button" class="icon-btn" title="إلغاء الكل" onclick="App.setGroupPerms('${grp.g}',false)">✕</button>
            </span>
          </div>
          <div style="margin-top:8px;display:${grp.keys.length>6?'grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))':'flex;flex-direction:column'};gap:6px;">
            ${grp.keys.map(key=>`<label style="display:flex;gap:6px;align-items:center;cursor:pointer;"><input type="checkbox" style="width:auto;flex:none;" data-perm="${grp.g}.${key.k}" id="${id(grp.g,key.k)}" ${P[grp.g][key.k]?'checked':''}> ${esc(key.label)}</label>`).join('')}
          </div>
        </div>`).join('')}
      </div>
    `;
  },
  setGroupPerms(g, val){
    document.querySelectorAll(`input[data-perm^="${g}."]`).forEach(el=>{ el.checked = val; });
  },
  setAllPerms(val){
    document.querySelectorAll('input[data-perm]').forEach(el=>{ el.checked = val; });
  },
  readPermsCheckboxes(){
    const out = {};
    PERM_SCHEMA.forEach(grp=>{ out[grp.g] = {}; grp.keys.forEach(key=>{ out[grp.g][key.k] = false; }); });
    document.querySelectorAll('input[data-perm]').forEach(el=>{
      const [g,k] = el.getAttribute('data-perm').split('.');
      if(out[g]) out[g][k] = el.checked;
    });
    return out;
  },
  applyPermsToCheckboxes(p){
    const P = normalizePerms(p);
    document.querySelectorAll('input[data-perm]').forEach(el=>{
      const [g,k] = el.getAttribute('data-perm').split('.');
      el.checked = !!(P[g] && P[g][k]);
    });
  },
  onUserJobSelect(){
    const sel = document.getElementById('u_job');
    const jobId = sel.value;
    if(!jobId) return; // "مخصص" — leave checkboxes as they are
    const job = this.db.jobTitles.find(j=>j.id===jobId);
    if(job) this.applyPermsToCheckboxes(job.perms);
  },
  /* the "الصلاحية" dropdown at the top now lists every job title directly
     (value "job:<id>") alongside "مدير عام" and plain "مستخدم محل" — picking
     a job here keeps the "الوظيفة" select further down in sync and applies
     that job's permission checkboxes, so a job can be assigned in one click
     without having to also touch the second dropdown. */
  onUserRoleSelect(){
    const sel = document.getElementById('u_role');
    const val = sel.value;
    const isAdminRole = val==='admin';
    const storeWrap = document.getElementById('u_storeWrap');
    const jobWrap = document.getElementById('u_jobWrap');
    if(storeWrap) storeWrap.style.display = isAdminRole?'none':'block';
    if(jobWrap) jobWrap.style.display = isAdminRole?'none':'block';
    const jobSel = document.getElementById('u_job');
    if(!jobSel) return;
    if(val.startsWith('job:')){
      jobSel.value = val.slice(4);
      this.onUserJobSelect();
    } else {
      jobSel.value = '';
    }
  },

            ${d.jobTitles.filter(j=>j.type==='store').length? `<optgroup label="وظائف المحل">${d.jobTitles.filter(j=>j.type==='store').map(j=>`<option value="job:${j.id}" ${editing&&editing.jobId===j.id?'selected':''}>${esc(j.name)}</option>`).join('')}</optgroup>`:''}
            ${d.jobTitles.filter(j=>j.type==='warehouse').length? `<optgroup label="وظائف المستودع">${d.jobTitles.filter(j=>j.type==='warehouse').map(j=>`<option value="job:${j.id}" ${editing&&editing.jobId===j.id?'selected':''}>${esc(j.name)}</option>`).join('')}</optgroup>`:''}

          </select>

  saveUser(id){
    const name=document.getElementById('u_name').value.trim();
    const username=document.getElementById('u_username').value.trim();
    const pass=document.getElementById('u_pass').value;
    const roleVal=document.getElementById('u_role').value;
    const role = roleVal==='admin' ? 'admin' : 'store';
    const email=document.getElementById('u_email').value.trim();
    const phone=document.getElementById('u_phone').value.trim();
    const storeId=role==='admin'?null:(document.getElementById('u_store').value||null);
    const warehouseId=role==='admin'?null:(document.getElementById('u_warehouse').value||null);
    const avatarNameAr = (document.getElementById('u_avAr')||{value:''}).value.trim();
    const avatarNameEn = (document.getElementById('u_avEn')||{value:''}).value.trim();
    const stEl = document.getElementById('u_showTransfers');
    const existingU = id ? this.db.users.find(x=>x.id===id) : null;
    // these two are owner-controlled: if the form doesn't show them (not the owner) keep what was saved
    const showTransfers = stEl ? stEl.checked : !!(existingU && existingU.showTransfers);
    const caEl = document.getElementById('u_canAppearance');
    const canAppearance = caEl ? caEl.checked : !!(existingU && existingU.canAppearance);
    if(!username){this.notify('اكتب اسم مستخدم.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){this.notify('البريد الإلكتروني إلزامي ولازم يكون بصيغة صحيحة — بيُستخدم لإرسال رمز التحقق عند تسجيل الدخول.');return;}
    if(role==='store' && !storeId && !warehouseId){this.notify('اختر المحل أو المستودع المرتبط بهذا المستخدم (لازم واحد منهم على الأقل).');return;}
    const dupe = this.db.users.find(u=>u.username===username && u.id!==id);
    if(dupe){this.notify('اسم المستخدم موجود بالفعل، اختر اسمًا آخر.');return;}
    if(pass && !this.passwordMeetsPolicy(pass)){
      this.notify('كلمة المرور لازم تحقق كل شروط الأمان الموضّحة بالعلامات تحت الحقل (لازم تبقى كلها ✓).');
      return;
    }
    // never allow removing the last remaining admin account — that would lock everyone out
    if(id && role!=='admin'){
      const existing = this.db.users.find(x=>x.id===id);
      if(existing && existing.role==='admin'){
        const otherAdmins = this.db.users.filter(x=>x.role==='admin' && x.id!==id).length;
        if(otherAdmins===0){
          this.notify('لا يمكن تحويل هذا الحساب لمستخدم محل لأنه المدير العام الوحيد المتبقي في النظام. أضف مديرًا آخر أولًا.');
          return;
        }
      }
    }

    let jobId=null, jobTitle='', permissions=null;
    if(role==='store'){
      jobId = document.getElementById('u_job').value || null;
      jobTitle = jobId ? this.jobName(jobId) : '';
      permissions = this.readPermsCheckboxes();
    }

    if(id){
      const u = this.db.users.find(x=>x.id===id);
      Object.assign(u,{name,username,role,storeId,warehouseId,jobId,jobTitle,email,phone,showTransfers,canAppearance,avatarNameAr,avatarNameEn,permissions:role==='store'?permissions:null});
      if(pass) u.password=pass;
      this.logActivity(`عدّل بيانات مستخدم "${username}"${pass?' (وغيّر كلمة المرور)':''}`);
    }else{
      if(!pass){this.notify('اكتب كلمة مرور للمستخدم الجديد.');return;}
      this.db.users.push({id:uid(),name,username,password:pass,role,storeId,warehouseId,jobId,jobTitle,email,phone,showTransfers,canAppearance,avatarNameAr,avatarNameEn,permissions});
      this.logActivity(`أضاف مستخدم جديد "${username}"`);
    }
    this.closeModal(); this.refresh(); this.buildNav();
  },
  deleteUser(id){
    const target = this.db.users.find(u=>u.id===id);
    if(target && target.role==='admin'){
      const otherAdmins = this.db.users.filter(x=>x.role==='admin' && x.id!==id).length;
      if(otherAdmins===0){
        this.notify('لا يمكن حذف هذا الحساب لأنه المدير العام الوحيد المتبقي في النظام. أضف مديرًا آخر أولًا.');
        return;
      }
    }
    this.confirmAction('حذف هذا المستخدم؟', ()=>{
      this.db.users=this.db.users.filter(u=>u.id!==id);
      this.logActivity(`حذف مستخدم "${target?target.username:''}"`);
      this.refresh();
    });
  },

  /* ---------------- SELF-SERVICE: change my own username / password ---------------- */
  /* ---------------- PASSWORD STRENGTH POLICY ----------------
     Configurable by the owner from الإعدادات (db.settings.passwordPolicy);
     falls back to DEFAULT_PASSWORD_POLICY when nothing's been customized. */
  passwordRules(){
    const p = (this.db.settings && this.db.settings.passwordPolicy) || DEFAULT_PASSWORD_POLICY;
    const rules = [{key:'length', label:`${p.minLength||8} أحرف على الأقل`, test: v=>v.length>=(p.minLength||8)}];
    if(p.requireUpper) rules.push({key:'upper', label:'حرف كبير واحد على الأقل (A-Z)', test: v=>/[A-Z]/.test(v)});
    if(p.requireLower) rules.push({key:'lower', label:'حرف صغير واحد على الأقل (a-z)', test: v=>/[a-z]/.test(v)});
    if(p.requireNumber) rules.push({key:'number', label:'رقم واحد على الأقل (0-9)', test: v=>/[0-9]/.test(v)});
    if(p.requireSymbol) rules.push({key:'symbol', label:'رمز خاص واحد على الأقل (!@#$%^&* ...)', test: v=>/[^A-Za-z0-9]/.test(v)});
    return rules;
  },
  passwordChecklistHtml(prefix){
    return `<div class="help-box" id="${prefix}_checklist" style="margin-top:6px;line-height:1.9;">
      ${this.passwordRules().map(r=>`<div data-rule="${r.key}" style="color:var(--bad);">✗ ${esc(r.label)}</div>`).join('')}
    </div>`;
  },
  updatePasswordChecklist(prefix, value){
    const box = document.getElementById(prefix+'_checklist');
    if(!box) return;
    value = value || '';
    this.passwordRules().forEach(r=>{
      const el = box.querySelector(`[data-rule="${r.key}"]`);
      if(!el) return;
      const ok = r.test(value);
      el.style.color = ok ? 'var(--good)' : 'var(--bad)';
      el.textContent = (ok?'✓ ':'✗ ') + r.label;
    });
  },
  passwordMeetsPolicy(value){
    return this.passwordRules().every(r=>r.test(value||''));
  },

  saveMyAccount(){
    const u = this.currentUser();
    const resultBox = document.getElementById('myAccountResult');
    const current = document.getElementById('ma_current').value;
    const newUsername = document.getElementById('ma_username').value.trim();
    const email = document.getElementById('ma_email').value.trim();
    const phone = document.getElementById('ma_phone').value.trim();
    const pass1 = document.getElementById('ma_pass1').value;
    const pass2 = document.getElementById('ma_pass2').value;

    if(!current || current !== u.password){

      return;
    }
    const dupe = this.db.users.find(x=>x.username===newUsername && x.id!==u.id);
    if(dupe){ resultBox.textContent = 'اسم المستخدم ده مستخدم بالفعل من حد تاني، اختار اسم مختلف.'; return; }

      if(!this.passwordMeetsPolicy(pass1)){ resultBox.textContent = 'كلمة المرور الجديدة لازم تحقق كل شروط الأمان الموضّحة بالعلامات فوق (لازم تبقى كلها ✓ باللون الأخضر).'; return; }

    this.closeModal();

  verifyForgotPassword(){
    const username = document.getElementById('fp_username').value.trim();
    const contact = document.getElementById('fp_contact').value.trim().toLowerCase();
    const resultBox = document.getElementById('fpStep1Result');
    if(!username || !contact){ resultBox.textContent = 'اكتب اسم المستخدم والبريد/الجوال المسجّل.'; return; }
    const user = this.db.users.find(u=>u.username===username);
    if(!user){ resultBox.textContent = 'اسم المستخدم غير موجود.'; return; }
    const email = (user.email||'').trim().toLowerCase();
    const phone = (user.phone||'').trim().toLowerCase();
    if(!email && !phone){
      resultBox.textContent = 'لا يوجد بريد إلكتروني أو رقم جوال مسجّل على هذا الحساب. تواصل مع مدير النظام لإعادة تعيين كلمة المرور يدويًا من صفحة المستخدمين.';
      return;
    }
    if(contact!==email && contact!==phone){
      resultBox.textContent = 'البيانات غير متطابقة مع البريد/الجوال المسجّل على هذا الحساب.';
      return;
    }
    this.openResetPasswordForm(user.id);

  finishResetPassword(userId){
    const pass1 = document.getElementById('fp_pass1').value;
    const pass2 = document.getElementById('fp_pass2').value;
    const resultBox = document.getElementById('fpStep2Result');
    if(pass1 !== pass2){ resultBox.textContent = 'كلمتا المرور غير متطابقتين.'; return; }

  /* ---------------- COSTS & LOSSES (financial value of returns by reason / resolution) ---------------- */
  rp_costs:{storeId:'', from:'', to:''},
  resetCostsFilter(){
    const u = this.currentUser();
    this.rp_costs = { storeId: this.allStores() ? '' : (u.storeId||''), from:'', to:'' };
    this.reReport();
  },
  reportCostsAndLosses(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_costs;
    if(!this.allStores() && !st.storeId) st.storeId = u.storeId;

    let rows = this.allStores() ? d.returns.slice() : d.returns.filter(r=>this.inUserScope(r,u));
    if(st.storeId) rows = rows.filter(r=>r.storeId===st.storeId);
    if(st.from) rows = rows.filter(r=>r.date>=st.from);
    if(st.to) rows = rows.filter(r=>r.date<=st.to);

    const withValue = rows.map(r=>{
      const it = d.items.find(i=>i.id===r.itemId);
      const cost = it ? Number(it.cost||0) : 0;
      return { ...r, value: Number(r.qty||0) * cost };
    });
    const totalQty = withValue.reduce((a,r)=>a+Number(r.qty||0),0);
    const totalValue = withValue.reduce((a,r)=>a+r.value,0);
    const pct = v => totalValue>0 ? (v/totalValue*100) : 0;

    const groupBy = (keyFn) => {
      const g = {};
      withValue.forEach(r=>{
        const k = keyFn(r) || '—';
        if(!g[k]) g[k] = {qty:0, value:0};
        g[k].qty += Number(r.qty||0);
        g[k].value += r.value;
      });
      return Object.entries(g).sort((a,b)=>b[1].value-a[1].value);
    };
    const byReason = groupBy(r=>r.reason);
    const byResolution = groupBy(r=>r.resolution||'معلّق');

    const tableHtml = (title, entries) => `
      <h4 style="margin-bottom:8px;">${title}</h4>
      <div class="tbl-wrap" style="margin-bottom:20px;"><table class="tbl"><thead><tr>
        <th>البند</th><th>الكمية</th><th>القيمة المالية</th><th>% من إجمالي الخسارة</th>
      </tr></thead><tbody>
      ${entries.length===0? `<tr><td colspan="4"><div class="empty small">لا توجد بيانات في هذه الفترة</div></td></tr>` :
      entries.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmtNum(v.qty)}</td><td>${fmtNum(v.value.toFixed(2))}</td><td>${pct(v.value).toFixed(1)}%</td></tr>`).join('')}
      </tbody></table></div>
    `;

    return `
      <div class="filters card" style="margin-bottom:14px;">
        ${this.allStores()? `<div class="field"><label>المحل</label><select onchange="App.rp_costs.storeId=this.value;App.reReport()">
          <option value="">كل المحلات</option>
          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : ''}
        <div class="field"><label>من تاريخ</label><input type="date" value="${st.from}" onchange="App.rp_costs.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${st.to}" onchange="App.rp_costs.to=this.value;App.reReport()"></div>
        <div class="field" style="flex:0;"><button class="btn btn-sm" onclick="App.resetCostsFilter()">تصفية جديدة</button></div>
      </div>

      <div class="grid grid-2" style="margin-bottom:16px;">
        <div class="card" style="padding:14px;"><div class="muted small">إجمالي كمية المرتجعات في الفترة</div><div style="font-size:22px;font-weight:700;">${fmtNum(totalQty)}</div></div>
        <div class="card" style="padding:14px;"><div class="muted small">إجمالي القيمة المالية (التكلفة × الكمية)</div><div style="font-size:22px;font-weight:700;">${fmtNum(totalValue.toFixed(2))}</div></div>
      </div>

      ${tableHtml('حسب سبب المرتجع', byReason)}
      ${tableHtml('حسب طريقة العلاج', byResolution)}

      <div class="help-box">القيم المالية محسوبة من تكلفة الوحدة المسجّلة لكل صنف في صفحة "الأصناف". أي صنف بدون تكلفة مسجّلة (أو تكلفته صفر) هتظهر قيمته المالية هنا صفر حتى لو له كمية مرتجعة.</div>
    `;
  },

  /* ---------------- ITEM LOOKUP (search by barcode / code / name / transfer no.) ---------------- */
  rp_lookup:{query:'', itemId:''},
  reportItemLookup(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_lookup;
    const q = st.query.trim().toLowerCase();

    // if the query matches a transfer number, jump straight to that return's item
    if(q && !st.itemId){
      const scopedAll = this.allStores()? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
      const byTransfer = scopedAll.find(r=>(r.transferNo||'').toLowerCase()===q);
      if(byTransfer){ st.itemId = byTransfer.itemId; }
    }

    let matches = [];
    if(q && !st.itemId){
      matches = d.items.filter(it=>
        (it.barcode||'').toLowerCase().includes(q) ||
        (it.code||'').toLowerCase().includes(q) ||
        (it.name||'').toLowerCase().includes(q)
      ).slice(0,8);
    }

    let historyHtml = '';
    if(st.itemId){
      const it = d.items.find(i=>i.id===st.itemId);
      const scoped = this.allStores()? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
      const rows = scoped.filter(r=>r.itemId===st.itemId).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
      const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);

      const byStoreMap={}, byMonthMap={}, byReasonMap={};
      rows.forEach(r=>{
        const sKey=r.storeId;
        byStoreMap[sKey] = byStoreMap[sKey] || {count:0, qty:0};
        byStoreMap[sKey].count++; byStoreMap[sKey].qty += Number(r.qty||0);

        const mKey = r.date.slice(0,7);
        byMonthMap[mKey] = byMonthMap[mKey] || {count:0, qty:0};
        byMonthMap[mKey].count++; byMonthMap[mKey].qty += Number(r.qty||0);

        byReasonMap[r.reason] = (byReasonMap[r.reason]||0) + Number(r.qty||0);
      });
      const byStore = Object.entries(byStoreMap).sort((a,b)=>b[1].count-a[1].count);
      const byMonth = Object.entries(byMonthMap).sort((a,b)=>b[0].localeCompare(a[0]));
      const byReason = Object.entries(byReasonMap).sort((a,b)=>b[1]-a[1]);

      historyHtml = `
        <div class="card" style="margin-top:14px;">
          <div class="section-head">
            <h3>${esc(it?it.name:'—')} <span class="muted small">${it&&it.code?`— رمز: ${esc(it.code)}`:''} ${it&&it.barcode?`— باركود: ${esc(it.barcode)}`:''}</span></h3>
            <div class="actions"><button class="btn btn-sm" onclick="App.rp_lookup={query:'',itemId:''};App.reReport()">🔎 بحث عن صنف تاني</button></div>
          </div>
          <div class="grid grid-4">
            <div class="stat accent"><div class="n">${fmtNum(rows.length)}</div><div class="l">إجمالي عدد مرات الترجيع</div></div>
            <div class="stat"><div class="n">${fmtNum(totalQty)}</div><div class="l">إجمالي الكمية المرتجعة</div></div>
            <div class="stat"><div class="n">${fmtNum(byStore.length)}</div><div class="l">عدد الفروع التي رجّعت الصنف</div></div>
            <div class="stat"><div class="n">${esc((it&&it.packSize)||'—')}</div><div class="l">شد الصنف</div></div>
          </div>

          <div class="grid grid-2" style="margin-top:14px;align-items:start;">
            <div class="card">
              <div class="section-head"><h3>حسب الفرع</h3></div>
              <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفرع</th><th>عدد المرات</th><th>الكمية</th></tr></thead><tbody>
                ${byStore.map(([sid,info])=>`<tr><td>${esc(this.storeName(sid)||'—')}</td><td>${fmtNum(info.count)}</td><td>${fmtNum(info.qty)}</td></tr>`).join('')}
              </tbody></table></div>
            </div>
            <div class="card">
              <div class="section-head"><h3>حسب السبب</h3></div>
              <div class="tbl-wrap"><table class="tbl"><thead><tr><th>السبب</th><th>الكمية</th></tr></thead><tbody>
                ${byReason.map(([r,q2])=>`<tr><td>${esc(r)}</td><td>${fmtNum(q2)}</td></tr>`).join('')}
              </tbody></table></div>
            </div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="section-head"><h3>عدد مرات الترجيع شهريًا</h3></div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الشهر</th><th>عدد المرات</th><th>الكمية</th></tr></thead><tbody>
              ${byMonth.map(([m,info])=>`<tr><td>${esc(m)}</td><td>${fmtNum(info.count)}</td><td>${fmtNum(info.qty)}</td></tr>`).join('')}
            </tbody></table></div>
          </div>

          <div class="card" style="margin-top:14px;">
            <div class="section-head"><h3>كل عملية ترجيع لهذا الصنف منذ أول تسجيل (${fmtNum(rows.length)})</h3>
              <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportItemLookupRows(),'سجل_صنف_'+App.itemName('${st.itemId}'))">تصدير CSV</button></div>
            </div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr>
              <th>التاريخ</th><th>الوقت</th><th>الفرع</th><th>الكمية</th><th>رقم تحويل المرتجع</th><th>السبب</th><th>تاريخ الصلاحية</th><th>المستودع</th>
            </tr></thead><tbody>
              ${rows.length===0? `<tr><td colspan="8"><div class="empty">لا توجد مرتجعات مسجلة لهذا الصنف</div></td></tr>` :
              rows.map(r=>`<tr>
                <td>${esc(r.date)}</td><td>${esc(r.time||'—')}</td><td>${esc(this.storeName(r.storeId)||'—')}</td>
                <td>${fmtNum(r.qty)} ${esc(this.returnUnit(r))}</td><td><b>${esc(r.transferNo||'—')}</b></td>
                <td>${esc(r.reason)}</td><td>${r.expiry?esc(r.expiry):'—'}</td><td>${esc(this.whName(r.warehouseId))}</td>
              </tr>`).join('')}
            </tbody></table></div>
          </div>
        </div>
      `;
    }

    return `
      <div class="card">
        <div class="field">
          <label>ابحث بالباركود، رمز الصنف، اسم الصنف، أو رقم المرتجع/التحويل</label>
          <input type="text" id="lookupSearchInput" placeholder="امسح الباركود أو اكتب هنا..." value="${esc(st.query)}" oninput="App.rp_lookup.query=this.value;App.rp_lookup.itemId='';App.reReport()">
        </div>
        ${matches.length? `
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
          ${matches.map(it=>`
            <button type="button" class="btn" style="justify-content:space-between;text-align:right;" onclick="App.rp_lookup.itemId='${it.id}';App.reReport()">
              <span>${esc(it.name)}</span>
              <span class="muted small">${it.code?`رمز: ${esc(it.code)} `:''}${it.barcode?`— باركود: ${esc(it.barcode)}`:''}</span>
            </button>
          `).join('')}
        </div>` : (q && !st.itemId ? `<div class="empty small" style="margin-top:10px;">لا توجد أصناف أو مرتجعات مطابقة</div>` : '')}
      </div>
      ${historyHtml}
    `;
  },
  exportItemLookupRows(){
    const d=this.db, u=this.currentUser();
    const scoped = this.allStores()? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
    const rows = scoped.filter(r=>r.itemId===this.rp_lookup.itemId).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
    return [['التاريخ','الوقت','الفرع','الكمية','الوحدة','رقم تحويل المرتجع','السبب','تاريخ الصلاحية','المستودع'],
      ...rows.map(r=>[r.date,r.time,this.storeName(r.storeId),r.qty,this.returnUnit(r),r.transferNo,r.reason,r.expiry,this.whName(r.warehouseId)])];
  },

  /* ---------------- CUSTOM FULL REPORT (period + branch, PDF/Excel) ---------------- */
  rp_custom:{storeId:'', itemId:'', from:'', to:''},
  computeCustomReportData(){
    const d=this.db; const u=this.currentUser();
    const st=this.rp_custom;
    const scoped = this.allStores()? d.returns.slice() : d.returns.filter(r=>this.inUserScope(r,u));
    let rows = scoped.filter(r=> r.date>=st.from && r.date<=st.to);
    if(st.storeId) rows = rows.filter(r=>r.storeId===st.storeId);
    if(st.itemId) rows = rows.filter(r=>r.itemId===st.itemId);
    rows.sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const byItemMap={}, byReasonMap={}, byStoreMap={};
    rows.forEach(r=>{
      byItemMap[r.itemId]=(byItemMap[r.itemId]||0)+Number(r.qty||0);
      byReasonMap[r.reason]=(byReasonMap[r.reason]||0)+Number(r.qty||0);
      byStoreMap[r.storeId]=(byStoreMap[r.storeId]||0)+Number(r.qty||0);
    });
    const byItem = Object.entries(byItemMap).sort((a,b)=>b[1]-a[1]);
    const byReason = Object.entries(byReasonMap).sort((a,b)=>b[1]-a[1]);
    const byStoreEntries = Object.entries(byStoreMap).sort((a,b)=>b[1]-a[1]);
    const showByStore = !st.storeId && byStoreEntries.length>1;

    return {
      rows,
      kpis:{ totalQty, totalOps: rows.length, itemCount: byItem.length },
      byItem, byReason,
      byStore: showByStore? byStoreEntries : null,
      meta:{
        storeLabel: st.storeId? (this.storeName(st.storeId)||'—') : 'كل الفروع',
        from: st.from, to: st.to,
      }
    };
  },
  reportMeta(data){
    const d=this.db, u=this.currentUser();
    const st=this.rp_custom;
    const settings = d.settings || {companyName:'', logo:''};
    const preparedBy = u.name || u.username;
    const now = new Date();
    const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const scopeText = st.storeId ? `لفرع "${esc(data.meta.storeLabel)}"` : 'على مستوى كل الفروع';
    const itemScopeText = st.itemId ? ` — مقتصر على صنف "${esc(this.itemName(st.itemId)||'')}"` : '';
    return {settings, preparedBy, stamp, scopeText, itemScopeText};
  },
  sanitizeFilename(s){
    return String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_').trim();
  },
  buildReportFilename(mode, data, ext){
    const typeLabel = mode==='detail' ? 'تفصيلي' : 'ملخص';
    const storeLabel = this.sanitizeFilename(data.meta.storeLabel) || 'كل_الفروع';
    const from = this.sanitizeFilename(data.meta.from);
    const to = this.sanitizeFilename(data.meta.to);
    return `تقرير_مرتجعات_${typeLabel}_${storeLabel}_${from}_${to}.${ext}`;
  },
  buildHeaderHtml(data, meta){
    return `
      <div class="card print-header-card" style="margin-bottom:0;">

        </div>

          هذا التقرير يوضح تفاصيل المرتجعات المسجلة ${meta.scopeText}${meta.itemScopeText} خلال الفترة من
          <b>${esc(data.meta.from)}</b> إلى <b>${esc(data.meta.to)}</b>، ويشمل رقم تحويل المرتجع الخاص بكل عملية على حدة.

        <div class="stat"><div class="n">${fmtNum(data.kpis.itemCount)}</div><div class="l">عدد الأصناف المتأثرة</div></div>
      </div>

      <div class="grid grid-2" style="margin-top:14px;align-items:start;">
        <div class="card">
          <div class="section-head"><h3>حسب الصنف</h3></div>
          ${data.byItem.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody>
            ${data.byItem.map(([iid,q])=>`<tr><td>${esc(this.itemName(iid)||'—')}</td><td>${fmtNum(q)}</td></tr>`).join('')}

      </div>`:''}`;
  },
  buildDetailHtml(data){
    const d = this.db;
    return `
      <div class="card" style="margin-top:14px;">
        <div class="section-head"><h3>التقرير التفصيلي — كل عملية ترجيع ورقم تحويلها (${fmtNum(data.rows.length)})</h3></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr>
          <th>م</th><th>التاريخ</th><th>الوقت</th><th>الفرع</th><th>الصنف</th><th>رمز الصنف</th><th>الباركود</th><th>الكمية</th><th>رقم تحويل المرتجع</th><th>السبب</th><th>تاريخ الصلاحية</th><th>المستودع</th>
        </tr></thead><tbody>
        ${data.rows.length===0? `<tr><td colspan="12"><div class="empty">لا توجد مرتجعات مطابقة لهذه الفترة/الفرع</div></td></tr>`:

  },
  reportCustom(){

  },
  saveTransfersUrl(){
    if(!this.isOwner()) return;
    let url = document.getElementById('rc_transfersUrl').value.trim();
    if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    this.db.settings = this.db.settings || {companyName:'', logo:''};
    this.db.settings.transfersUrl = url;
    this.logActivity(`عدّل رابط برنامج التحويلات إلى "${url}"`);
    this.refresh();
  },
  saveReportSettings(){
    if(!this.isOwner()) return;
    const name = document.getElementById('rc_companyName').value.trim();
    this.db.settings = this.db.settings || {companyName:'', logo:''};
    this.db.settings.companyName = name;
    this.logActivity(`عدّل اسم الشركة إلى "${name}"`);
    this.refresh();
  },
  handleLogoUpload(input){
    if(!this.isOwner()) return;
    if(!input.files || !input.files[0]) return;
    const file = input.files[0];
    if(file.size > 800*1024){
      this.notify('الصورة كبيرة، من فضلك اختر شعار أصغر من 800 كيلوبايت.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      this.db.settings = this.db.settings || {companyName:'', logo:''};
      this.db.settings.logo = e.target.result;
      this.logActivity('غيّر شعار الشركة');
      this.refresh();
    };
    reader.readAsDataURL(file);
  },
  clearLogo(){
    if(!this.isOwner()) return;
    this.db.settings = this.db.settings || {companyName:'', logo:''};
    this.db.settings.logo = '';
    this.logActivity('أزال شعار الشركة');
    this.refresh();
  },

  /* ---------------- THEME PICKER ---------------- */
  setTheme(themeId){
    if(!this.canAppearance()) return;
    const theme = THEMES.find(t=>t.id===themeId);
    if(!theme) return;
    this.db.settings = this.db.settings || {};
    this.db.settings.themeId = themeId;
    this.applyTheme(themeId);
    this.logActivity(`غيّر ثيم البرنامج إلى "${theme.name}"`);
    this.refresh();
  },

  /* ---------------- CUSTOM REASONS / RESOLUTIONS ---------------- */
  addReason(){
    if(!this.isOwner()) return;
    const input = document.getElementById('newReasonInput');
    const val = (input.value||'').trim();
    if(!val) return;
    const list = this.reasons().slice();
    if(list.includes(val)){ this.notify('السبب ده موجود بالفعل.'); return; }
    list.push(val);
    this.db.settings.reasons = list;
    this.logActivity(`أضاف سبب ترجيع جديد: "${val}"`);
    this.refresh();
  },
  removeReason(i){
    if(!this.isOwner()) return;
    const list = this.reasons().slice();
    const removed = list[i];
    if(list.length<=1){ this.notify('لازم يفضل سبب واحد على الأقل.'); return; }
    list.splice(i,1);
    this.db.settings.reasons = list;
    this.logActivity(`حذف سبب ترجيع: "${removed}"`);
    this.refresh();
  },
  addResolution(){
    if(!this.isOwner()) return;
    const input = document.getElementById('newResolutionInput');
    const val = (input.value||'').trim();
    if(!val) return;
    const list = this.resolutions().slice();
    if(list.includes(val)){ this.notify('طريقة العلاج دي موجودة بالفعل.'); return; }
    list.push(val);
    this.db.settings.resolutions = list;
    this.logActivity(`أضاف طريقة علاج جديدة: "${val}"`);
    this.refresh();
  },
  removeResolution(i){
    if(!this.isOwner()) return;
    const list = this.resolutions().slice();
    const removed = list[i];
    if(list.length<=1){ this.notify('لازم تفضل طريقة علاج واحدة على الأقل.'); return; }
    list.splice(i,1);
    this.db.settings.resolutions = list;
    this.logActivity(`حذف طريقة علاج: "${removed}"`);
    this.refresh();
  },

  /* ---------------- EXPIRY ALERT THRESHOLD ---------------- */
  saveExpiryAlertDays(value){
    if(!this.isOwner()) return;
    let n = parseInt(value,10);
    if(!n || n<1) n = DEFAULT_EXPIRY_ALERT_DAYS;
    this.db.settings.expiryAlertDays = n;
    this.logActivity(`عدّل مدة تنبيه الصلاحية إلى ${n} يوم`);
    this.refresh();
  },

  /* ---------------- PASSWORD POLICY ---------------- */
  savePasswordPolicy(){
    if(!this.isOwner()) return;
    let minLength = parseInt(document.getElementById('pw_minLength').value,10);
    if(!minLength || minLength<4) minLength = 4;
    this.db.settings.passwordPolicy = {
      minLength,
      requireUpper: document.getElementById('pw_requireUpper').checked,
      requireLower: document.getElementById('pw_requireLower').checked,
      requireNumber: document.getElementById('pw_requireNumber').checked,
      requireSymbol: document.getElementById('pw_requireSymbol').checked,
    };
    this.logActivity('عدّل سياسة كلمة المرور');
    this.refresh();
  },

  /* ---------------- EMAILJS SETTINGS (email verification code) ---------------- */
  saveEmailJSSettings(){
    if(!this.isOwner()) return;
    const serviceId = document.getElementById('ej_serviceId').value.trim();
    const templateId = document.getElementById('ej_templateId').value.trim();
    const publicKey = document.getElementById('ej_publicKey').value.trim();
    this.db.settings.emailjs = {serviceId, templateId, publicKey};
    if(publicKey && window.emailjs){ try{ emailjs.init({publicKey}); }catch(e){} }
    this.logActivity('عدّل إعدادات رمز التحقق بالبريد الإلكتروني');
    this.refresh();
    this.notify('تم حفظ إعدادات البريد الإلكتروني.');
  },
  testEmailJSSettings(){
    if(!this.isOwner()) return;
    const resultBox = document.getElementById('emailjsTestResult');
    const me = this.currentUser();
    if(!me.email){ resultBox.textContent = 'سجّل بريدك الإلكتروني الأول من "تغيير اسم المستخدم / كلمة المرور".'; resultBox.style.color='var(--bad)'; return; }
    if(!this.isEmailJSConfigured()){ resultBox.textContent = 'احفظ الإعدادات التلاتة فوق الأول.'; resultBox.style.color='var(--bad)'; return; }
    resultBox.textContent = 'جاري الإرسال...'; resultBox.style.color='var(--muted)';
    const code = String(Math.floor(100000 + Math.random()*900000));
    this.sendVerificationEmail(me.email, code, me.name).then(()=>{
      resultBox.textContent = `تم الإرسال! هتلاقي في بريدك (${esc(me.email)}) رسالة فيها كود تجريبي: ${code}`;
      resultBox.style.color = 'var(--good)';
    }).catch(err=>{
      console.error('test email failed', err);
      const detail = (err && (err.text || err.message)) || String(err);
      resultBox.textContent = `فشل الإرسال — ${detail}`;
      resultBox.style.color = 'var(--bad)';
    });
  },

  /* ---------------- BACKUP / RESTORE ---------------- */
  /* ---------------- STORAGE: status, upgrade, daily backups ---------------- */
  /* ---------------- INSTALL AS AN APP ---------------- */
  isInstalledApp(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true;
  },
  isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); },
  refreshInstallLink(){
    const a = document.getElementById('installAppLink');
    if(!a) return;
    a.style.display = (!this.isInstalledApp() && (window.__installEvt || this.isIOS())) ? '' : 'none';
  },
  installApp(){
    const ev = window.__installEvt;
    if(ev){
      ev.prompt();
      (ev.userChoice||Promise.resolve({})).then(r=>{
        if(r && r.outcome==='accepted'){ window.__installEvt = null; this.notify('تم تثبيت البرنامج ✅ هتلاقي أيقونته على سطح المكتب / الشاشة الرئيسية.'); }
        this.refreshInstallLink();
      });
      return;
    }
    if(this.isIOS()){
      this.notify('على الآيفون: افتح البرنامج من Safari ← دوس زرار المشاركة (المربع اللي فيه سهم لفوق) ← "إضافة إلى الشاشة الرئيسية" ← إضافة.');
      return;
    }
    this.notify('افتح البرنامج من Chrome أو Edge، ودوس على أيقونة التثبيت اللي في آخر شريط العنوان من فوق (شكل شاشة عليها سهم).');
  },
  /* rough server usage vs Firebase's free 1 GB: live data + every kept backup, plus ~15% overhead */
  FREE_QUOTA_BYTES: 1024*1024*1024,
  serverUsage(){
    const I = this.storageInfo();
    const bk = I.backups.reduce((a,b)=>a+(b.bytes||I.bytes),0);
    const used = Math.round((I.bytes + bk) * 1.15);
    const pct = used / this.FREE_QUOTA_BYTES * 100;
    // growth: compare the oldest and newest backups to estimate how fast the data grows per day
    let perDay = 0, daysLeft = null;
    const bs = I.backups.filter(b=>b.ts && b.bytes);
    if(bs.length>=2){
      const a = bs[0], z = bs[bs.length-1], days = (z.ts-a.ts)/86400000;
      if(days>=1 && z.bytes>a.bytes) perDay = (z.bytes-a.bytes)/days;
    }
    if(perDay>0){
      const kept = Math.max(1, I.backups.length) + 1;   // each byte of data is stored ~once per kept copy
      daysLeft = Math.floor((this.FREE_QUOTA_BYTES - used) / (perDay*kept*1.15));
    }
    return {used, pct, bk, data:I.bytes, perDay, daysLeft, copies:I.backups.length};
  },
  fmtBytes(b){
    const f=(n,d)=>Number(n).toLocaleString('ar-EG',{maximumFractionDigits:d});
    if(b>=1073741824) return f(b/1073741824,2)+' جيجا';
    if(b>=1048576) return f(b/1048576,1)+' ميجا';
    return fmtNum(Math.max(1,Math.round(b/1024)))+' ك.ب';
  },
  usageMeterHtml(){
    const U = this.serverUsage();

    const w = Math.max(pct, 0.6);
    let horizon;
    if(U.daysLeft==null) horizon = 'لسه بدري نحسب سرعة الزيادة — بعد كام يوم شغل هيظهر هنا المساحة تكفي لإمتى.';
    else if(U.daysLeft > 3650) horizon = 'بمعدل الشغل الحالي المساحة المجانية تكفي أكتر من ١٠ سنين.';
    else if(U.daysLeft > 365) horizon = `بمعدل الشغل الحالي المساحة المجانية تكفي حوالي ${fmtNum(Math.floor(U.daysLeft/365))} سنة.`;
    else horizon = `بمعدل الشغل الحالي المساحة المجانية تكفي حوالي ${fmtNum(U.daysLeft)} يوم — وقتها نحوّل للباقة بالاستخدام.`;
    return `
      <div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;">

        <div style="height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;" role="progressbar" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
          <div style="height:100%;width:${Math.min(100,w)}%;background:var(--${lvl});border-radius:999px;"></div>

      </div>`;
  },
  storageInfo(){
    const S = window.__store || {};
    const json = JSON.stringify(this.db);
    const bytes = utf8Len(json);
    return {mode:S.mode, supported:S.splitSupported, bytes, pct: Math.min(100, Math.round(bytes/1048576*100)), backups:(S.bkIndex&&S.bkIndex.list)||[]};
  },
  upgradeStorage(){
    if(!this.isOwner()) return;
    const S = window.__store;
    if(S.mode==='split'){ this.notify('التخزين متقسّم بالفعل.'); return; }
    if(S.splitSupported!==true){ this.notify('قواعد الحماية على Firebase لسه مش سامحة بأكتر من ملف. ظبطها الأول (التعليمات تحت الزرار) وبعدين جرّب تاني.'); return; }
    this.confirmAction('هيتم تقسيم البيانات على أكتر من ملف على السيرفر عشان الحجم ميتقفلش. قبلها هتتاخد نسخة احتياطية على السيرفر وهتنزل نسخة على جهازك. اعمل ده في وقت مفيش حد بيسجل فيه، واطلب من باقي المستخدمين يعملوا تحديث للصفحة بعدها. نكمّل؟', ()=>{
      this.downloadBackup(true);
      this.serverBackup(true).then(()=>{
        S.mode = 'split';
        return saveSplit(this.db);
      }).then(()=>{
        this.logActivity('رقّى التخزين على السيرفر لأكتر من ملف');
        saveData(this.db);
        this.render();
        this.notify('تم ✅ البيانات دلوقتي متقسمة على أكتر من ملف، ومفيش حد أقصى للحجم يقلقك. اطلب من كل المستخدمين يعملوا تحديث للصفحة (Ctrl+Shift+R).');
      }).catch(e=>{ console.error(e); S.mode='single'; this.notify('حصل خطأ أثناء الترقية، ومفيش حاجة اتغيرت. جرّب تاني.'); });
    }, 'ترقية التخزين');
  },
  /* a full snapshot on the server at most once an hour (whenever data changes);
     keeps every snapshot from the last 48 hours + the last one of each day for 30 days */
  serverBackup(force){
    const S = window.__store, col = window.__appCol;
    if(!col || S.splitSupported!==true || !S.bkIndex) return Promise.resolve(false);
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const id = `${todayStr()}_${hh}`;
    const list = (S.bkIndex.list||[]).map(b=>b.id? b : Object.assign({}, b, {id:b.date}));
    if(!force && list.some(b=>b.id===id)) return Promise.resolve(false);
    if(this._bkBusy) return Promise.resolve(false);
    this._bkBusy = true;
    const json = JSON.stringify(this.db);
    const pieces = chunkString(json);
    const u = this.session ? this.currentUser() : null;
    const writes = pieces.map((p,i)=>col.doc(`bk_${id}__${i}`).set({kind:'backup', id, idx:i, data:p}));
    return Promise.all(writes).then(()=>{
      const old = list.find(b=>b.id===id);
      const extra = old && old.parts>pieces.length ? Array.from({length:old.parts-pieces.length},(_,k)=>col.doc(`bk_${id}__${pieces.length+k}`).delete()) : [];
      let next = list.filter(b=>b.id!==id).concat([{id, date:todayStr(), hour:hh, parts:pieces.length, bytes:utf8Len(json), ts:Date.now(), by:(u&&(u.name||u.username))||'تلقائي'}]).sort((a,b)=>a.ts-b.ts);
      // retention
      const cutoffH = Date.now() - BACKUP_KEEP_HOURS*3600000;
      const lastOfDay = {}; next.forEach(b=>{ lastOfDay[b.date] = b.id; });
      const days = Object.keys(lastOfDay).sort().slice(-BACKUP_KEEP_DAYS);
      const keep = b => b.ts >= cutoffH || (days.includes(b.date) && lastOfDay[b.date]===b.id);
      const drop = next.filter(b=>!keep(b));
      next = next.filter(keep);
      const dels = drop.flatMap(b=>Array.from({length:b.parts},(_,k)=>col.doc(`bk_${b.id}__${k}`).delete()));
      S.bkIndex = {kind:'bkindex', list:next};
      return Promise.all(extra.concat(dels, [col.doc('__backups').set(S.bkIndex)])).then(()=>true);
    }).catch(e=>{ console.error('server backup failed', e); return false; })
      .finally(()=>{ this._bkBusy = false; });
  },
  /* switch to the split layout on its own (no button) — safe to call repeatedly */
  autoUpgradeStorage(){
    const S = window.__store;
    if(S.mode!=='single' || S.splitSupported!==true || !window.__fsReady || this._upgrading) return;
    this._upgrading = true;
    this.serverBackup(true).then(()=>{
      S.mode = 'split';
      return saveSplit(this.db);
    }).then(()=>{ console.info('storage upgraded to split layout'); })
      .catch(e=>{ console.error('auto upgrade failed', e); S.mode='single'; })
      .finally(()=>{ this._upgrading = false; });
  },
  restoreServerBackup(id){
    if(!this.isOwner()) return;
    const S = window.__store, col = window.__appCol;
    const b = ((S.bkIndex&&S.bkIndex.list)||[]).find(x=>(x.id||x.date)===id);
    if(!b) return;
    const date = b.hour!=null ? `${b.date} الساعة ${b.hour}:00` : b.date;
    this.confirmAction(`هيتم استبدال كل البيانات الحالية بنسخة يوم ${date}. قبلها هتنزل نسخة من البيانات الحالية على جهازك. متأكد؟`, ()=>{
      this.downloadBackup(true);
      Promise.all(Array.from({length:b.parts},(_,k)=>col.doc(`bk_${b.id||b.date}__${k}`).get())).then(snaps=>{
        const json = snaps.map(s=>s.exists? s.data().data : '').join('');
        const parsed = JSON.parse(json);
        if(!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.returns)) throw new Error('bad backup');
        const prevUsername = (this.currentUser()||{}).username;
        this.db = migrateData(parsed);
        const matched = this.db.users.find(u=>u.username===prevUsername);
        this.session = { userId: (matched||this.db.users[0]).id };
        localStorage.setItem(SESSION_KEY, JSON.stringify(this.session));
        this.applyTheme();
        this.logActivity(`استرجع نسخة السيرفر بتاعة يوم ${date}`);
        this.refresh(); this.buildNav();
        this.notify(`تم استرجاع نسخة يوم ${date} بنجاح ✅`);
      }).catch(e=>{ console.error(e); this.notify('تعذّر قراءة النسخة دي من السيرفر.'); });
    }, 'استرجاع النسخة');
  },
  /* after every save: keep the hourly snapshot going */
  afterSave(){
    clearTimeout(this._bkTimer);
    this._bkTimer = setTimeout(()=>this.serverBackup(false), 4000);
  },
  /* runs once the data is loaded: today's server snapshot + the owner's daily file on this device */
  dailyBackups(){
    if(!this.session) return;
    this.autoUpgradeStorage();
    this.serverBackup(false).then(done=>{ if(done && document.getElementById('app').style.display!=='none' && this.view==='settings') this.render(); });
    if(this.isOwner()){
      let on = true, last = '';
      try{ on = localStorage.getItem('rm_autoDl_on')!=='0'; last = localStorage.getItem('rm_autoDl_last')||''; }catch(e){}
      if(on && last!==todayStr()){
        try{ localStorage.setItem('rm_autoDl_last', todayStr()); }catch(e){}
        setTimeout(()=>this.downloadBackup(true), 1500);
      }
    }
  },
  toggleAutoDownload(on){
    try{ localStorage.setItem('rm_autoDl_on', on?'1':'0'); }catch(e){}
    this.render();
  },

  downloadBackup(silent){
    if(!this.isOwner()) return;
    const stamp = todayStr();
    const blob = new Blob([JSON.stringify(this.db, null, 2)], {type:'application/json'});
    this.saveFile(`نسخة-احتياطية-مرتجعات-${stamp}.json`, blob);
  },
  restoreBackup(input){
    if(!this.isOwner()) return;
    if(!input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ this.notify('الملف مش نسخة احتياطية صالحة (JSON غير صحيح).'); input.value=''; return; }
      if(!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.returns)){
        this.notify('الملف ده مش نسخة احتياطية من نظام المرتجعات.');
        input.value=''; return;
      }
      this.confirmAction('هيتم استبدال كل البيانات الحالية بمحتوى النسخة الاحتياطية دي. متأكد؟', ()=>{
        const prevUsername = (this.currentUser()||{}).username;
        this.db = migrateData(parsed);
        // the logged-in session points at a user id from BEFORE the restore;
        // that id may not exist in the restored data (e.g. right after a
        // full reset, which mints a fresh random id), so re-anchor the
        // session to the same username in the restored data, falling back
        // to the first user rather than leaving a dangling, permission-less session.
        const matched = this.db.users.find(u=>u.username===prevUsername);
        this.session = { userId: (matched||this.db.users[0]).id };
        localStorage.setItem(SESSION_KEY, JSON.stringify(this.session));
        this.applyTheme();
        this.logActivity('استرجع نسخة احتياطية كاملة للبيانات');
        this.refresh();
        this.buildNav();
        this.notify('تم استرجاع النسخة الاحتياطية بنجاح.');
      }, 'استبدال البيانات');
      input.value='';
    };
    reader.readAsText(file);
  },

  /* ---------------- DANGER ZONE: full reset ---------------- */
  openResetConfirm(){
    if(!this.isOwner()) return;
    const me = this.currentUser();
    if(!me.email){ this.notify('لازم يكون عندك بريد إلكتروني مسجّل على حسابك الأول (من "تغيير اسم المستخدم / كلمة المرور") قبل استخدام الحذف.'); return; }

  sendResetCode(){
    // generate a fresh random one-time code each time and email it to the

    // requires actually reading a real email, not just a fast click-through.
    const me = this.currentUser();

      <div id="resetConfirmResult" class="small" style="color:var(--bad);"></div>
      <div class="modal-actions">
        <button class="btn" style="background:var(--bad);color:#fff;border-color:var(--bad);" onclick="App.resetAllData()">تأكيد الحذف النهائي</button>
        <button class="btn btn-sm" onclick="App.sendResetCode()">إعادة إرسال الرمز</button>
        <button class="btn" onclick="App.closeModal()">إلغاء</button>
      </div>
    `);
    this.sendVerificationEmail(me.email, this._resetCode, me.name).catch(err=>{
