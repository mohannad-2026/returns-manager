      const resultBox = document.getElementById('resetConfirmResult');
      if(resultBox) resultBox.textContent = 'تعذّر إرسال البريد. تأكد من إعدادات EmailJS في صفحة الإعدادات، أو جرّب "إعادة إرسال الرمز".';
    });
  },
  resetAllData(){
    if(!this.isOwner()) return;
    const val = (document.getElementById('resetConfirmInput').value||'').trim();
    const resultBox = document.getElementById('resetConfirmResult');
    if(!this._resetCode || val!==this._resetCode){ if(resultBox) resultBox.textContent = 'كود التحقق غلط. اكتب الكود اللي اتبعت على بريدك.'; return; }
    this._resetCode = null;
    const me = this.currentUser();
    const fresh = defaultData();
    // keep the owner able to log back in with their current username/password
    // instead of silently switching them to the factory admin/admin123
    fresh.users = [{...fresh.users[0], username: me.username, password: me.password, name: me.name||fresh.users[0].name}];
    fresh.settings.themeId = (this.db.settings&&this.db.settings.themeId) || 'cyan';

    this.go('dashboard');
    this.notify('تم تصفير كل البيانات والبدء من جديد.');
  },

    if(mode==='detail'){
      const detailRows = [
        [settings.companyName || 'تقرير مرتجعات', '', '', 'حُرر بواسطة: '+meta.preparedBy, '', 'بتاريخ: '+meta.stamp],
        ['التقرير التفصيلي — من '+data.meta.from+' إلى '+data.meta.to+' — '+data.meta.storeLabel],
        [],
        ['م','التاريخ','الوقت','الفرع','الصنف','رمز الصنف','الباركود','الكمية','الوحدة','رقم تحويل المرتجع','السبب','تاريخ الصلاحية','المستودع'],
        ...data.rows.map((r,idx)=>{
          const it = d.items.find(i=>i.id===r.itemId);
          return [idx+1, r.date, r.time||'', this.storeName(r.storeId)||'—', it?it.name:'—', (it&&it.code)||'', (it&&it.barcode)||'', r.qty, this.returnUnit(r), r.transferNo||'', r.reason, r.expiry||'', this.whName(r.warehouseId)];
        }),
      ];
      this.exportXLSXMultiSheet([{name:'تفصيلي', rows: detailRows}], this.buildReportFilename('detail', data, 'xlsx'));
      return;
    }

    // mode === 'summary'
    const summaryRows = [
      [settings.companyName || 'تقرير مرتجعات'],
      ['تقرير المرتجعات — ملخص'],
      ['الفرع', data.meta.storeLabel],
      ['من تاريخ', data.meta.from],
      ['إلى تاريخ', data.meta.to],
      ['تاريخ ووقت سحب التقرير', meta.stamp],
      ['حُرر بواسطة', meta.preparedBy],
      [],
      ['إجمالي الكمية المرتجعة', data.kpis.totalQty],
      ['عدد عمليات الترجيع', data.kpis.totalOps],
      ['عدد الأصناف المتأثرة', data.kpis.itemCount],
      [],
      ['حسب الصنف'],
      ['الصنف','الكمية'],
      ...data.byItem.map(([iid,q])=>[this.itemName(iid)||'—', q]),
      [],
      ['حسب السبب'],
      ['السبب','الكمية'],
      ...data.byReason.map(([r,q])=>[r, q]),
    ];
    if(data.byStore){
      summaryRows.push([], ['حسب الفرع'], ['الفرع','الكمية']);
      data.byStore.forEach(([sid,q])=>summaryRows.push([this.storeName(sid)||'—', q]));
    }
    this.exportXLSXMultiSheet([{name:'ملخص', rows: summaryRows}], this.buildReportFilename('summary', data, 'xlsx'));
  },
  exportXLSXMultiSheet(sheets, filename){
    const wb = XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws = XLSX.utils.aoa_to_sheet(s.rows);
      XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31));
    });
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    this.saveFile(filename, blob);
  },
  async exportCustomPDF(mode){
    const statusEl = document.getElementById('customReportStatus');
    if(statusEl) statusEl.textContent = 'جاري تجهيز ملف PDF...';
    const data = this.computeCustomReportData();
    const meta = this.reportMeta(data);
    const sectionHtml = this.buildHeaderHtml(data, meta) + (mode==='detail'? this.buildDetailHtml(data) : this.buildSummaryHtml(data));

    const wrap = document.createElement('div');
    wrap.style.position = 'fixed';
    wrap.style.left = '-10000px';
    wrap.style.top = '0';
    wrap.style.width = '860px';
    wrap.style.background = '#ffffff';
    wrap.style.padding = '20px';
    wrap.innerHTML = sectionHtml;
    document.body.appendChild(wrap);

    try{
      const canvas = await html2canvas(wrap, {scale:2, backgroundColor:'#ffffff', useCORS:true});
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','pt','a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while(heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
      const blob = pdf.output('blob');
      await this.saveFile(this.buildReportFilename(mode, data, 'pdf'), blob);
    }catch(err){
      console.error(err);
      this.notify('تعذّر إنشاء ملف PDF. جرّب مرة أخرى.');
    }finally{
      document.body.removeChild(wrap);
      if(statusEl) statusEl.textContent = '';
    }
  },

  rp_item:{itemId:'', p1from:'', p1to:'', p2from:'', p2to:''},
  reportItemPeriod(){
    const d=this.db; const u=this.currentUser(); const scoped = this.allStores()? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
    const st = this.rp_item;
    // default period1 = current month, period2 = previous month, same length
    if(!st.p1from){ st.p1from = todayStr().slice(0,8)+'01'; st.p1to = todayStr(); }
    if(!st.itemId && d.items.length) st.itemId = d.items[0].id;

    let p2from=st.p2from, p2to=st.p2to;
    if(!p2from || !p2to){
      const f=new Date(st.p1from), t=new Date(st.p1to);
      const lenDays = Math.round((t-f)/86400000)+1;
      const prevTo = new Date(f); prevTo.setDate(prevTo.getDate()-1);
      const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(lenDays-1));
      p2from = prevFrom.toISOString().slice(0,10);
      p2to = prevTo.toISOString().slice(0,10);
    }

    const inRange=(r,from,to)=> r.date>=from && r.date<=to;
    const p1rows = scoped.filter(r=>r.itemId===st.itemId && inRange(r,st.p1from,st.p1to));
    const p2rows = scoped.filter(r=>r.itemId===st.itemId && inRange(r,p2from,p2to));
    const sum = rows=>rows.reduce((a,r)=>a+Number(r.qty||0),0);
    const q1=sum(p1rows), q2=sum(p2rows);
    const diff = q1-q2;
    const pct = q2>0 ? ((diff/q2)*100) : (q1>0?100:0);

    const reasonBreak = (rows)=>{
      const m={}; rows.forEach(r=>m[r.reason]=(m[r.reason]||0)+Number(r.qty||0));
      return Object.entries(m).sort((a,b)=>b[1]-a[1]);
    };
    const r1 = reasonBreak(p1rows);

    const storeBreak = (rows)=>{
      const m={}; rows.forEach(r=>m[r.storeId]=(m[r.storeId]||0)+Number(r.qty||0));
      return Object.entries(m).sort((a,b)=>b[1]-a[1]);
    };
    const s1 = storeBreak(p1rows);

    const expiries = [...new Set(p1rows.filter(r=>r.expiry).map(r=>r.expiry))].sort();

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr;align-items:end;">
        <div class="field"><label>الصنف</label>
          <select onchange="App.rp_item.itemId=this.value;App.reReport()">
            ${d.items.map(it=>`<option value="${it.id}" ${st.itemId===it.id?'selected':''}>${esc(it.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>الفترة الأولى — من</label><input type="date" value="${st.p1from}" onchange="App.rp_item.p1from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى</label><input type="date" value="${st.p1to}" onchange="App.rp_item.p1to=this.value;App.reReport()"></div>
      </div>
      <div class="form-row" style="margin-top:10px;">
        <div class="field"><label>الفترة الثانية (للمقارنة) — من</label><input type="date" value="${p2from}" onchange="App.rp_item.p2from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى</label><input type="date" value="${p2to}" onchange="App.rp_item.p2to=this.value;App.reReport()"></div>
      </div>
      <div class="small muted" style="margin-top:6px;">الفترة الثانية افتراضيًا هي نفس عدد أيام الفترة الأولى قبلها مباشرة، ويمكنك تغييرها يدويًا.</div>
    </div>

    ${!st.itemId ? `<div class="empty">أضف صنفًا أولًا لعرض التقرير</div>` : `
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat accent"><div class="n">${fmtNum(q1)}</div><div class="l">الكمية المرتجعة — الفترة الأولى</div></div>
      <div class="stat"><div class="n">${fmtNum(q2)}</div><div class="l">الكمية المرتجعة — الفترة الثانية</div></div>
      <div class="stat ${diff>0?'bad':'warn'}"><div class="n">${diff>0?'+':''}${fmtNum(diff)} ${q2>0?`(${diff>0?'+':''}${pct.toFixed(0)}%)`:''}</div><div class="l">الفرق بين الفترتين</div></div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;align-items:start;">
      <div class="card">
        <div class="section-head"><h3>أسباب الترجيع — الفترة الأولى</h3></div>
        ${r1.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>السبب</th><th>الكمية</th></tr></thead><tbody>
          ${r1.map(([reason,q])=>`<tr><td>${esc(reason)}</td><td>${fmtNum(q)}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات في هذه الفترة</div>`}
      </div>
      <div class="card">
        <div class="section-head"><h3>حسب المحل — الفترة الأولى</h3></div>
        ${s1.length? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>المحل</th><th>الكمية</th></tr></thead><tbody>
          ${s1.map(([sid,q])=>`<tr><td>${esc(this.storeName(sid)||'—')}</td><td>${fmtNum(q)}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات في هذه الفترة</div>`}
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>تواريخ الصلاحية المسجّلة لهذا الصنف في الفترة الأولى</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportItemPeriodRows(),'تقرير_${esc(this.itemName(st.itemId))}')">تصدير CSV</button></div>
      </div>
      ${expiries.length? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${expiries.map(e=>`<span class="tag ${new Date(e)<new Date()?'bad':'warn'}">${esc(e)}</span>`).join('')}</div>`
        : `<div class="empty small">لا توجد تواريخ صلاحية مسجّلة</div>`}
    </div>
    `}
    `;
  },
  exportItemPeriodRows(){
    const d=this.db; const u=this.currentUser(); const scoped = this.allStores()? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
    const st=this.rp_item;
    const rows = scoped.filter(r=>r.itemId===st.itemId && r.date>=st.p1from && r.date<=st.p1to);
    return [['التاريخ','الوقت','المحل','الكمية','رقم التحويل','السبب','تاريخ الصلاحية'],
      ...rows.map(r=>[r.date,r.time,this.storeName(r.storeId),r.qty,r.transferNo,r.reason,r.expiry])];
  },

  rp_store:{storeId:'', from:'', to:''},
  reportByStore(){
    const d=this.db; const u=this.currentUser();
    const st=this.rp_store;
    if(!st.storeId){ st.storeId = this.allStores() ? (d.stores[0]?d.stores[0].id:'') : u.storeId; }
    if(!st.from){ st.from = todayStr().slice(0,8)+'01'; st.to = todayStr(); }
    const rows = d.returns.filter(r=>r.storeId===st.storeId && r.date>=st.from && r.date<=st.to);
    const totalQty = rows.reduce((a,r)=>a+Number(r.qty||0),0);

    const byItem={};
    rows.forEach(r=>{
      byItem[r.itemId] = byItem[r.itemId] || {qty:0, reasons:{}};
      byItem[r.itemId].qty += Number(r.qty||0);
      byItem[r.itemId].reasons[r.reason] = (byItem[r.itemId].reasons[r.reason]||0)+Number(r.qty||0);
    });
    const itemRows = Object.entries(byItem).sort((a,b)=>b[1].qty-a[1].qty);

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr;align-items:end;">
        ${this.allStores()? `<div class="field"><label>المحل</label><select onchange="App.rp_store.storeId=this.value;App.reReport()">
          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : `<div class="field"><label>المحل</label><input type="text" value="${esc(this.storeName(st.storeId)||'')}" disabled></div>`}
        <div class="field"><label>من تاريخ</label><input type="date" value="${st.from}" onchange="App.rp_store.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${st.to}" onchange="App.rp_store.to=this.value;App.reReport()"></div>
      </div>
    </div>
    ${!st.storeId? `<div class="empty" style="margin-top:14px;">أضف محلًا أولًا</div>` : `

  rp_ovr:{storeId:'', itemId:'', from:'', to:''},

    const reasonBreak={};
    returns.forEach(r=>reasonBreak[r.reason]=(reasonBreak[r.reason]||0)+Number(r.qty||0));

    return `

          ${d.stores.map(s=>`<option value="${s.id}" ${st.storeId===s.id?'selected':''}>${s.code?'['+esc(s.code)+'] ':''}${esc(s.name)}</option>`).join('')}
        </select></div>` : `<div class="field"><label>المحل</label><input type="text" value="${esc(this.storeName(st.storeId)||'')}" disabled></div>`}
        <div class="field"><label>الصنف</label><select onchange="App.rp_ovr.itemId=this.value;App.reReport()">

        </select></div>

      </div>

    ${(!st.storeId||!st.itemId)? `<div class="empty" style="margin-top:14px;">أضف محلًا وصنفًا أولًا</div>` : `
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat"><div class="n">${fmtNum(qOrdered)}</div><div class="l">إجمالي الكمية المطلوبة</div></div>
      <div class="stat accent"><div class="n">${fmtNum(qReturned)}</div><div class="l">إجمالي الكمية المرتجعة</div></div>
      <div class="stat ${pct===null?'':(pct>=20?'bad':pct>=8?'warn':'')}"><div class="n">${pct===null?'—':pct.toFixed(1)+'%'}</div><div class="l">نسبة الترجيع من إجمالي الطلبيات</div></div>
    </div>
    <div class="card" style="margin-top:14px;">

        ${reasonRows.map(([r,q])=>`<tr><td>${esc(r)}</td><td>${fmtNum(q)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty small">لا توجد مرتجعات لهذا الصنف في هذه الفترة</div>`}
      ${qOrdered===0 && qReturned>0 ? `<div class="help-box" style="margin-top:12px;">لا توجد طلبيات مسجلة لهذا الصنف في نفس الفترة، رغم وجود مرتجعات — تأكد من تسجيل الطلبيات من تبويب "الطلبيات" لحساب نسبة دقيقة.</div>`:''}

  computeMoversList(){
    const d=this.db, u=this.currentUser(); const st=this.rp_movers; const admin=this.allStores();
    const scoped = admin ? d.returns : d.returns.filter(r=>this.inUserScope(r,u));
    const periodRows = scoped.filter(r=> (!st.storeId || r.storeId===st.storeId) && r.date>=st.from && r.date<=st.to);

      byItem[r.itemId] = byItem[r.itemId] || {qty:0, count:0};

    });

    if(st.view==='top') list = list.filter(x=>x.count>0).sort((a,b)=>b.qty-a.qty).slice(0,20);

  /* ---------------- BRANCH PERFORMANCE (ranking with trend vs previous equal period) ---------------- */
  rp_branch:{from:'', to:''},
  reportBranchPerformance(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_branch;
    const admin=this.allStores();
    if(!st.from){ st.from = todayStr().slice(0,8)+'01'; st.to = todayStr(); }

    const ranking = this.computeBranchPerfRanking();
    const fromD = new Date(st.from), toD = new Date(st.to);
    const lenDays = Math.max(1, Math.round((toD-fromD)/86400000)+1);

    return `
    <div class="card">
      <div class="form-row" style="grid-template-columns:1fr 1fr;align-items:end;">
        <div class="field"><label>من تاريخ</label><input type="date" value="${st.from}" onchange="App.rp_branch.from=this.value;App.reReport()"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" value="${st.to}" onchange="App.rp_branch.to=this.value;App.reReport()"></div>
      </div>
      <div class="small muted" style="margin-top:8px;">المقارنة تلقائيًا مع فترة سابقة بنفس عدد الأيام (${fmtNum(lenDays)} يوم)</div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-head"><h3>${admin?'ترتيب الفروع حسب الكمية المرتجعة':'أداء فرعك'}</h3>
        <div class="actions"><button class="btn btn-sm" onclick="App.exportCSV(App.exportBranchPerfRows(),'أداء_الفروع')">تصدير CSV</button></div></div>
      ${ranking.length===0? `<div class="empty small">لا توجد فروع</div>` : `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>الفرع</th><th>عدد العمليات</th><th>إجمالي الكمية</th><th>أكثر سبب</th><th>التغيّر عن الفترة السابقة</th></tr></thead><tbody>
        ${ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.store.name)}</td><td>${fmtNum(r.count)}</td><td>${fmtNum(r.qty)}</td><td>${esc(r.topReason)}</td><td>${r.delta>0?`<span class="tag bad">▲ ${fmtNum(r.delta)}%</span>`:(r.delta<0?`<span class="tag good">▼ ${fmtNum(Math.abs(r.delta))}%</span>`:'<span class="tag">—</span>')}</td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
    `;
  },
  computeBranchPerfRanking(){
    const d=this.db, u=this.currentUser(); const st=this.rp_branch; const admin=this.allStores();
    const stores = admin ? d.stores : d.stores.filter(s=>s.id===u.storeId);
    const fromD = new Date(st.from), toD = new Date(st.to);
    const lenDays = Math.max(1, Math.round((toD-fromD)/86400000)+1);
    const prevTo = new Date(fromD.getTime()-86400000);
    const prevFrom = new Date(prevTo.getTime()-(lenDays-1)*86400000);
    const fmtD = (dt)=>dt.toISOString().slice(0,10);
    const calc=(storeId, from, to)=>{
      const rows = d.returns.filter(r=>r.storeId===storeId && r.date>=from && r.date<=to);
      const qty = rows.reduce((a,r)=>a+Number(r.qty||0),0);
      const reasonCount={};
      rows.forEach(r=>{ reasonCount[r.reason]=(reasonCount[r.reason]||0)+1; });
      const topReason = Object.entries(reasonCount).sort((a,b)=>b[1]-a[1])[0];
      return {count:rows.length, qty, topReason: topReason?topReason[0]:'—'};
    };
    return stores.map(s=>{
      const cur = calc(s.id, st.from, st.to);
      const prev = calc(s.id, fmtD(prevFrom), fmtD(prevTo));
      const delta = prev.qty>0 ? Math.round(((cur.qty-prev.qty)/prev.qty)*100) : (cur.qty>0?100:0);
      return {store:s, ...cur, delta};
    }).sort((a,b)=>b.qty-a.qty);
  },
  exportBranchPerfRows(){
    const ranking = this.computeBranchPerfRanking();
    return [['الفرع','عدد العمليات','إجمالي الكمية','أكثر سبب','التغيّر %'], ...ranking.map(r=>[r.store.name, r.count, r.qty, r.topReason, r.delta])];
  },

  /* ---------------- SINGLE RECORD LOOKUP (find one return/transfer by its number) ---------------- */
  rp_record:{query:''},
  reportRecordLookup(){
    const d=this.db, u=this.currentUser();
    const st=this.rp_record;

    const q=(st.query||'').trim().toLowerCase();

      detailHtml = `<div class="empty" style="margin-top:14px;">لا توجد عملية بهذا الرقم${this.allStores()?'':' (في نطاق فرعك)'}</div>`;
    } else if(rec){

  /* ---------------- REAL (VECTOR) PDF + EXCEL EXPORT FOR ANY REPORT TAB ----------------
     The browser's own print engine renders the report — real Arabic text, sharp at any
     zoom — and "Save as PDF" writes a genuine PDF (not a picture). */
  printHtmlDoc(html){
    const old = document.getElementById('printFrame');
    if(old) old.remove();
    const fr = document.createElement('iframe');
    fr.id = 'printFrame';
    fr.setAttribute('aria-hidden','true');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(fr);
    const w = fr.contentWindow, doc = w.document;
    doc.open(); doc.write(html); doc.close();
    const fire = ()=>{
      try{ w.focus(); w.print(); }
      catch(e){
        const nw = window.open('', '_blank');
        if(nw){ nw.document.write(html); nw.document.close(); setTimeout(()=>{ try{ nw.print(); }catch(_){} }, 800); }
        else this.notify('المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة للموقع ده وجرّب تاني.');
      }
    };
    const fontsReady = (doc.fonts && doc.fonts.ready) ? doc.fonts.ready : Promise.resolve();
    const imgs = Array.from(doc.images||[]).filter(im=>!im.complete).map(im=>new Promise(r=>{ im.onload = im.onerror = r; }));
    Promise.race([Promise.all([fontsReady].concat(imgs)), new Promise(r=>setTimeout(r, 3000))])
      .then(()=>setTimeout(fire, 200));
  },
  reportStamp(){
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

</style></head><body>
  <div class="ph">

  },
  currentReportTitle(){
    const tab = this.reportTabs().find(t=>t.id===this.reportsTab);
    return tab ? tab.label.replace(/^[^؀-ۿA-Za-z0-9]+/, '').trim() : 'تقرير';
  },
  /* snapshot of the report on screen, with filter controls turned into plain text */
  reportSnapshot(){
    const src = document.getElementById('reportBody');
    if(!src) return null;
    const clone = src.cloneNode(true);
    const live = src.querySelectorAll('input,select,textarea');
    clone.querySelectorAll('input,select,textarea').forEach((el,i)=>{
      const l = live[i] || el;
      if(el.type==='file' || el.type==='hidden'){ el.remove(); return; }
      let txt;
      if(el.tagName==='SELECT'){ const o = l.options[l.selectedIndex]; txt = o ? o.text : ''; }
      else if(el.type==='checkbox' || el.type==='radio'){ txt = l.checked ? '✓' : '✗'; }
      else txt = l.value;
      const span = document.createElement('span');
      span.className = 'pv';
      span.textContent = (txt||'').trim() || '—';
      el.replaceWith(span);
    });
    clone.querySelectorAll('.pill-tabs').forEach(p=>{
      const a = p.querySelector('.pill-tab.active');
      if(a){ const d = document.createElement('div'); d.className='pv-view'; d.textContent = 'العرض: ' + a.textContent.trim(); p.replaceWith(d); }
      else p.remove();
    });
    clone.querySelectorAll('button, .actions, .help-box, .no-print, script').forEach(el=>el.remove());
    clone.querySelectorAll('[style*="display:none"]').forEach(el=>el.remove());
    return clone;
  },
  printCurrentReport(){
    if(!this.can('export.pdf')){ this.notify('مش مسموح لحسابك بالتحميل ده — كلّم المدير.'); return; }
    const clone = this.reportSnapshot();
    if(!clone) return;
    const maxCols = Math.max(0, ...Array.from(clone.querySelectorAll('table')).map(t=>t.querySelectorAll('thead th').length));
    this.printHtmlDoc(this.buildPrintDoc({ title: this.currentReportTitle(), bodyHtml: clone.innerHTML, landscape: maxCols>7 }));
  },
  excelCurrentReport(){
    if(!this.can('export.excel')){ this.notify('مش مسموح لحسابك بالتحميل ده — كلّم المدير.'); return; }
    const src = document.getElementById('reportBody');
    const tables = src ? Array.from(src.querySelectorAll('table')) : [];
    if(!tables.length){ this.notify('مفيش جداول في التقرير ده للتصدير.'); return; }
    const toNum = (v)=>{
      if(typeof v!=='string') return v;
      const t = v.replace(/[٠-٩]/g, dg=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(dg))).replace(/[٬,]/g,'').replace('٫','.').replace(/‏|‎|؜/g,'').trim();
      return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : v;
    };
    const wb = XLSX.utils.book_new();
    const used = new Set();
    tables.forEach((t,i)=>{
      const card = t.closest('.card');
      const h = card && card.querySelector('h3');
      let name = ((h ? h.textContent : '') || ('جدول '+(i+1))).replace(/[\\\/\?\*\[\]:]/g,'').replace(/\s+/g,' ').trim().slice(0,28) || ('جدول '+(i+1));
      let n = name, k = 2;
      while(used.has(n)) n = name.slice(0,25) + ' ' + (k++);
      used.add(n);
      const heads = t.tHead && t.tHead.rows[0] ? Array.from(t.tHead.rows[0].cells).map(c=>c.innerText.trim()) : [];
      const keepText = heads.map(h=>/كود|رمز|باركود|رقم|code|barcode/i.test(h)); // ids stay as text (leading zeros, long barcodes)
      const aoa = Array.from(t.rows).map((tr,ri)=>Array.from(tr.cells).map((c,ci)=>{
        const v = c.innerText.trim();
        return (ri===0 && t.tHead) || keepText[ci] ? v : toNum(v);
      }));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = (aoa[0]||[]).map((_,ci)=>({wch: Math.min(45, Math.max(10, ...aoa.map(r=>String(r[ci]==null?'':r[ci]).length+2)))}));
      XLSX.utils.book_append_sheet(wb, ws, n);
    });
    wb.Workbook = {Views:[{RTL:true}]};
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const fname = this.sanitizeFilename(this.currentReportTitle() + '_' + this.reportStamp().slice(0,10)) + '.xlsx';
    this.saveFile(fname, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  },

  reReport(){ this.renderInto('reportBody', ()=> this.renderReportBody()); },

  /* ---------------- FILE SAVING ---------------- */
  _downloadsCapPromise: null,
  getDownloadsCap(){
    if(!this._downloadsCapPromise){
      this._downloadsCapPromise = (async ()=>{
        try{
          if(!window.claude || !window.claude.use) return null;
          return await window.claude.use('downloads');
        }catch(e){ return null; }
      })();
    }
    return this._downloadsCapPromise;
  },
  saveFileViaBrowser(filename, data){
    try{
      const blob = (data instanceof Blob) ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      return true;
    }catch(err){
      console.error(err);
      return false;
    }
  },
  async saveFile(filename, data){
    const cap = await this.getDownloadsCap();
    if(cap){
      try{
        await cap.save({filename, data});
        this.logActivity(`نزّل تقرير/ملف: ${filename}`);
        saveData(this.db);
      }catch(err){
        if(err && err.code==='declined') return;
        console.error(err);
        this.notify('تعذّر حفظ الملف. جرّب مرة أخرى.');
      }
      return;
    }
    const ok = this.saveFileViaBrowser(filename, data);
    if(ok){
      this.logActivity(`نزّل تقرير/ملف: ${filename}`);
      saveData(this.db);
    }else{
      this.notify('تعذّر حفظ الملف. جرّب مرة أخرى.');
    }
  },

  /* ---------------- CSV EXPORT ---------------- */
  /* every export (any report/table pulled from the app) is stamped with
     who pulled it and exactly when, so it's always traceable later */
  reportPullStampRows(title){
    const u = this.currentUser();
    const now = new Date();
    const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    return [
      [title||'تقرير'],
      ['تم سحب هذا التقرير بواسطة', u?(u.name||u.username):'—'],
      ['تاريخ ووقت السحب', stamp],
      [],
    ];
  },
  exportCSV(rows, filename){
    if(!this.can('export.excel')){ this.notify('مش مسموح لحسابك بالتحميل ده — كلّم المدير.'); return; }
    rows = this.reportPullStampRows(filename).concat(rows);
    const csv = rows.map(row=>row.map(cell=>{
      const s = String(cell==null?'':cell);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    this.saveFile((filename||'تقرير')+'.csv', blob);
  },
};

/* =====================================================================
   FIREBASE (shared Firestore backend, cross-device)
   App.db already holds the local-cache value from loadData() above, so the
   very first paint (App.init() below) has something to show. Once we sign
   in anonymously and get the first snapshot from Firestore, App.db is
   replaced (or Firestore is seeded from it, if it doesn't exist yet), and
   every following snapshot keeps App.db - and the visible screen, if the
   app is showing - live-synced across every connected device.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCZ2b4wrlxhLpP534ddyLsAlrgNWIeGeMU",
  authDomain: "returns---manager.firebaseapp.com",

};
window.__fsReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const fsdb = firebase.firestore();
  const appCol = fsdb.collection('appdata');
  const mainDocRef = appCol.doc('main');
  window.__mainDocRef = mainDocRef;
  window.__appCol = appCol;
  const S = window.__store;

  let firstLoad = true;
  let lastKnownActivityTs = 0;
  let chunksReady = false;
  // build App.db from the main doc (+ its pieces in split mode); returns null while pieces are still arriving
  const assemble = ()=>{
    const m = S.main;
    if(!m) return null;
    if(!(m.__storage && m.__storage.mode==='split')){ S.mode='single'; return m; }
    if(!chunksReady) return null;
    S.mode = 'split';
    const out = {};
    Object.keys(m).forEach(k=>{ if(k!=='__storage' && !SPLIT_KEYS.includes(k)) out[k]=m[k]; });
    for(const key of SPLIT_KEYS){
      const n = (m.__storage.parts||{})[key]||0;
      let arr = [];
      for(let i=0;i<n;i++){
        const id = `${key}__${i}`, raw = S.chunks[id];
        if(raw==null) return null;             // a piece hasn't arrived yet — wait
        arr = arr.concat(JSON.parse(raw));
        S.lastWritten[id] = raw;
      }
      out[key] = arr; S.lastCount[key] = n;
    }
    return out;
  };
  const apply = ()=>{
    const data = assemble();
    if(!data) return;
    if(firstLoad){
      firstLoad = false;
      App.db = migrateData(data);
      const log0 = App.db.activityLog||[];
      lastKnownActivityTs = log0.length? Math.max(...log0.map(e=>e.ts)) : 0;
      window.__fsReady = true;
      App.applyTheme();
      setTimeout(()=>App.dailyBackups(), 2500);
    } else {
      App.db = migrateData(data);
      App.checkNewActivityForNotifications(lastKnownActivityTs);
      const log1 = App.db.activityLog||[];
      if(log1.length) lastKnownActivityTs = Math.max(lastKnownActivityTs, ...log1.map(e=>e.ts));
      App.applyTheme();
    }
    if(document.getElementById('app').style.display !== 'none'){ App.buildNav(); App.render(); }
  };

  auth.onAuthStateChanged(user=>{
    if(!user){ auth.signInAnonymously().catch(e=>console.error('firebase anonymous sign-in failed', e)); return; }

    // can we use more than one document? (depends on the project's security rules)
    const probe = appCol.doc('__probe');
    probe.set({kind:'probe', ts:Date.now()}).then(()=>probe.delete()).then(()=>{
      S.splitSupported = true;
      appCol.doc('__backups').get().then(s=>{ S.bkIndex = s.exists? s.data() : {kind:'bkindex', list:[]}; if(window.__fsReady){ App.autoUpgradeStorage(); App.serverBackup(false); } }).catch(()=>{});
    }).catch(()=>{ S.splitSupported = false; })
      .finally(()=>{ if(App.view==='settings' && document.getElementById('app').style.display!=='none') App.render(); });

    appCol.where('kind','==','chunk').onSnapshot(qs=>{
      qs.docChanges().forEach(ch=>{
        if(ch.type==='removed') delete S.chunks[ch.doc.id];
        else S.chunks[ch.doc.id] = ch.doc.data().data;
      });
      chunksReady = true;
      apply();
    }, err=>{ chunksReady = true; console.warn('chunk listener unavailable (single-document rules)', err && err.code); apply(); });

    mainDocRef.onSnapshot(snap=>{
      if(!snap.exists){
        if(firstLoad){
          // nothing in Firestore yet: seed it with whatever we have locally
          window.__fsReady = true; firstLoad = false;
          mainDocRef.set(App.db).catch(e=>console.error('firestore seed failed', e));
        }
        return;
      }
      S.main = snap.data();
      apply();
    }, err=>{ console.error('firestore snapshot listener failed', err); });
  });
}catch(e){ console.error('firebase init failed', e); }

App.init();
